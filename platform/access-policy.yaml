apiVersion: v1
data:
  access-policy.yaml: |
    policies:
    - name: platform-admin-access-administrator
      role: accessAdministrator
      scope:
        clusterWide: true
        clusters:
        - lke643351
        environments:
        - dev
      subjects:
      - kind: user
        name: platform-admin
        reason: sole access administrator for this installation
    - name: platform-read-only
      role: viewer
      scope:
        clusters:
        - lke643351
        environments:
        - dev
        namespaces:
        - access-change-api
        - argocd
        - audit-conformance
        - authelia
        - cert-manager
        - clickstack
        - cost-explorer
        - crossplane
        - gatus
        - goldilocks
        - headlamp
        - holmes
        - ingress-nginx
        - kyverno
        - metrics-server
        - openbao
        - openbao-prod
        - opencost
        - policy-reporter
        - prometheus
        - synthetic-monitoring
      subjects:
      - kind: group
        name: platform-operators
    - name: task230-admin-access-administrator
      role: accessAdministrator
      scope:
        clusterWide: true
        clusters:
        - lke643351
        environments:
        - dev
      subjects:
      - kind: user
        name: task230-admin
        reason: disposable TASK-230 acceptance administrator
    - name: task230-ui-policy
      role: viewer
      scope:
        clusters:
        - lke643351
        environments:
        - dev
        namespaces:
        - headlamp
      subjects:
      - kind: group
        name: task230-acceptance
    privilegeCeiling:
      roles:
      - viewer
      - accessAdministrator
    version: v1alpha1
kind: ConfigMap
metadata:
  annotations:
    access.sre.platform.io/customer-id: sre-tools
    access.sre.platform.io/environment: dev
    access.sre.platform.io/request-id: 5a75e71f024c27f0
    access.sre.platform.io/submitted-by: task230-admin
  labels:
    app.kubernetes.io/component: access-change
    app.kubernetes.io/managed-by: access-change-api
    app.kubernetes.io/name: access-policy
    app.kubernetes.io/part-of: sre-platform
  name: access-policy
  namespace: platform
