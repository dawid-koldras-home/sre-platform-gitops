apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: access-headlamp-pilot
  namespace: argocd
  annotations:
    argocd.argoproj.io/refresh: hard
  labels:
    app.kubernetes.io/part-of: sre-platform
    sre.platform.io/tenant: acl-stagec
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: "https://github.com/dawid-koldras-home/sre-platform-gitops.git"
    targetRevision: "task/215-headlamp-group-rbac"
    path: "platform/modules/headlamp-pilot"
  destination:
    server: https://kubernetes.default.svc
    namespace: "acl-live-acceptance"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m