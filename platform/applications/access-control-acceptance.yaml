apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: access-control-acceptance
  namespace: argocd
  annotations:
    argocd.argoproj.io/refresh: hard
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels:
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
    sre.platform.io/tenant: "acl-stagec"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: "https://github.com/dawid-koldras-home/sre-platform-gitops.git"
    targetRevision: "task/220-access-control-live-acceptance"
    path: "platform/modules/access-control-acceptance"
  destination:
    server: https://kubernetes.default.svc
    namespace: "acl-live-acceptance"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
