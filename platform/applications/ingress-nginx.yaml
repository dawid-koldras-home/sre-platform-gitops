apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/refresh: hard
  labels:
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
    sre.platform.io/tenant: "sre-tools"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: "https://github.com/dawid-koldras-home/sre-platform-gitops.git"
    targetRevision: "main"
    path: "platform/modules/ingress-nginx"
  destination:
    server: https://kubernetes.default.svc
    namespace: "ingress-nginx"
  ignoreDifferences:
    - group: ""
      kind: Service
      name: ingress-nginx-controller
      jsonPointers:
        - /metadata/annotations
        - /metadata/finalizers
        - /metadata/labels/argocd.argoproj.io~1instance
        - /spec/allocateLoadBalancerNodePorts
        - /spec/clusterIP
        - /spec/clusterIPs
        - /spec/externalTrafficPolicy
        - /spec/healthCheckNodePort
        - /spec/internalTrafficPolicy
        - /spec/ipFamilies
        - /spec/ipFamilyPolicy
        - /spec/ports/0/nodePort
        - /spec/ports/1/nodePort
        - /spec/publishNotReadyAddresses
        - /spec/sessionAffinity
        - /status/loadBalancer
      jqPathExpressions:
        - .spec.ports[].appProtocol
    - group: ""
      kind: Service
      name: ingress-nginx-controller-admission
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /spec/ipFamilies
        - /spec/ipFamilyPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: ingress-nginx-admission
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
