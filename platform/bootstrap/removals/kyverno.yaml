jobName: kyverno-scale-to-zero
jobManifest: |
    apiVersion: batch/v1
    kind: Job
    metadata:
        annotations:
            helm.sh/hook: pre-delete
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
            sre.platform.io/removal-id: de379f497f3e7b3fa0e9dfc92368c0511d32e7554c8fac092d5b4aa98a76f5cd
        labels:
            app.kubernetes.io/component: hooks
            app.kubernetes.io/instance: kyverno
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/part-of: kyverno
            app.kubernetes.io/version: 3.2.0
            helm.sh/chart: kyverno-3.2.0
        name: kyverno-scale-to-zero
        namespace: kyverno
    spec:
        backoffLimit: 2
        template:
            metadata: null
            spec:
                containers:
                    - command:
                        - /bin/bash
                        - -c
                        - |-
                          set -euo pipefail
                          kubectl scale -n kyverno deployment -l app.kubernetes.io/part-of=kyverno --replicas=0
                          sleep 30
                          kubectl delete validatingwebhookconfiguration -l webhook.kyverno.io/managed-by=kyverno
                          kubectl delete mutatingwebhookconfiguration -l webhook.kyverno.io/managed-by=kyverno
                      image: docker.io/alpine/k8s:1.30.0@sha256:bd01dae02676ce4cab62fc744e43443eee5bf660054e94d3496d23bfc35d384e
                      imagePullPolicy: null
                      name: kubectl
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                            drop:
                                - ALL
                        privileged: false
                        readOnlyRootFilesystem: true
                        runAsGroup: 65534
                        runAsNonRoot: true
                        runAsUser: 1000
                        seccompProfile:
                            type: RuntimeDefault
                restartPolicy: Never
                serviceAccount: kyverno-admission-controller
