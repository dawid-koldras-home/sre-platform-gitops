# Source: holmes/templates/holmes.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmesgpt-holmes
  namespace: holmes
  labels:
    app: holmes
    
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: holmes
  template:
    metadata:
      labels:
        app: holmes
        
      annotations:
        # checksum annotation triggering pod reload when .Values.toolsets changes by helm upgrade
        checksum/toolset-config: e8eb837a341364c4f5b1d57b3719781d7b1594369ccd5c78402588384a12205e
    spec:
      serviceAccountName: holmes
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      dnsPolicy: ClusterFirst
      containers:
      - name: holmes
        image: "robustadev/holmes@sha256:7ae20e4012a870fb7a1ce2b4f4e61c9f8adb08283fa3c9a5f7b9438abe351294"
        imagePullPolicy: IfNotPresent
        # Read-only root filesystem for security hardening.
        # /tmp is mounted as a writable emptyDir for ephemeral tool result files.
        # Required for OpenShift restricted SCC and other security-hardened
        # environments that enforce read-only root filesystems.
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command: ["python3", "-u", "/app/experimental/ag-ui/server-agui.py"]
        ports:
        - containerPort: 5050
          name: http
        livenessProbe:
          httpGet:
            path: /api/agui/chat/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /api/agui/chat/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
          - name: LOG_LEVEL
            value: INFO
          - name: ENABLE_JSON_LOGS_FORMAT
            value: "false"
          - name: ENABLE_TELEMETRY
            value: "false"
          - name: SENTRY_DSN
            value: 
          
          
          - name: HOME
            value: /tmp
        envFrom:
        - secretRef:
            name: holmes-provider
        lifecycle:
          preStop:
            exec:
              command: ["bash", "-c", "kill -SIGINT 1"]
        volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
          - name: playbooks-config-secret
            mountPath: /etc/robusta/config
          - name: custom-toolsets-configmap
            mountPath: /etc/holmes/config
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
            cpu: "500m"
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 256Mi
        - name: playbooks-config-secret
          secret:
            secretName: robusta-playbooks-config-secret
            optional: true
        - name: custom-toolsets-configmap
          configMap:
            name: custom-toolsets-configmap
            optional: true

