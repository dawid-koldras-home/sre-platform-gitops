apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: holmes-required-traffic
  namespace: holmes
spec:
  podSelector:
    matchLabels:
      app: holmes
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5050
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        # Managed Kubernetes Services can DNAT the kubernetes Service port 443
        # to an external control-plane endpoint on 6443 (for example LKE).
        - protocol: TCP
          port: 6443
