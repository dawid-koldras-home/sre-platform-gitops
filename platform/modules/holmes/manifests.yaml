    """Bounded validation and sanitization for the Holmes Operator guard.

    The guard is the only component that talks to the model provider on behalf of an
    operator-driven health check. It owns three decisions that the alpha operator
    cannot make itself:

    * refuse a check that would leave the monitor-only boundary,
    * refuse a run or a model call that would exceed a documented budget, and
    * reduce whatever the model returned to a bounded, credential-free summary
      before the operator stores it in a CustomResource status.

    Nothing in this module reads a Secret, a ConfigMap or the Kubernetes API. The
    inputs are the HTTP bodies the operator and Holmes already send, and the output
    is a small JSON document. Prompts and completions are never persisted by this
    module; only counters and one short sanitized outcome per run are kept.
    """

    from __future__ import annotations

    import re
    from dataclasses import dataclass
    from typing import Any, Dict, Iterable, List, Optional, Tuple

    # Namespaces a health-check query may name. Anything else is treated as a
    # cross-installation scope and refused before a model call is made.
    ALLOWED_NAMESPACES = frozenset(
        {
            "access-change-api",
            "argocd",
            "audit-sink",
            "authelia",
            "cert-manager",
            "gatus",
            "headlamp",
            "holmes",
            "ingress-nginx",
            "kube-system",
            "kyverno",
            "metrics-server",
            "opencost",
            "prometheus",
            "synthetic-monitoring",
            "synthetic-status",
        }
    )

    # Credential-shaped text is refused even though the query is only a prompt: a
    # query that names a Secret or carries a token invites the model to repeat it in
    # status, logs or a later conversation.
    CREDENTIAL_PATTERNS = (
        re.compile(r"\bsecret(s)?\b", re.IGNORECASE),
        re.compile(r"\bconfigmap(s)?\b", re.IGNORECASE),
        re.compile(r"\b(token|password|passwd|api[_-]?key|private[_-]?key)\b", re.IGNORECASE),
        re.compile(r"bearer\s+[a-z0-9._\-]+", re.IGNORECASE),
        re.compile(r"-----BEGIN [A-Z ]+PRIVATE KEY-----"),
        re.compile(r"\bkubeconfig\b", re.IGNORECASE),
        re.compile(r"\b[a-zA-Z0-9+/]{40,}={0,2}\b"),
    )

    # Interactive or mutating Kubernetes access is outside monitor-only mode.
    FORBIDDEN_ACCESS_PATTERNS = (
        re.compile(r"\bkubectl\s+(exec|attach|port-forward|cp|apply|delete|patch|edit|scale|rollout\s+restart)\b", re.IGNORECASE),
        re.compile(r"\b(pods?/exec|port-forward|attach)\b", re.IGNORECASE),
        re.compile(r"\b(all[- ]namespaces|cluster[- ]wide|every namespace)\b", re.IGNORECASE),
    )

    NAMESPACE_PATTERN = re.compile(
        r"\b(?:namespace|ns)\s*(?:[:=]|\s)\s*['\"]?([a-z0-9]([-a-z0-9]*[a-z0-9])?)",
        re.IGNORECASE,
    )

    # Fields a sanitized status may keep. Every one is a short scalar.
    SAFE_STATUS_FIELDS = ("status", "message", "rationale", "error", "model_used", "duration")


    @dataclass(frozen=True)
    class Limits:
        max_query_chars: int = 2000
        min_query_chars: int = 10
        max_timeout_seconds: int = 300
        min_timeout_seconds: int = 5
        max_history_items: int = 10
        max_message_chars: int = 600
        max_rationale_chars: int = 800
        max_error_chars: int = 300


    DEFAULT_LIMITS = Limits()


    class BoundaryError(ValueError):
        """A request that must not reach the model provider."""

        def __init__(self, rejection_class: str, message: str):
            super().__init__(message)
            self.rejection_class = rejection_class


    def _text(value: Any) -> str:
        return value.strip() if isinstance(value, str) else ""


    def validate_query(query: str) -> str:
        """Return the query when it is bounded and monitor-only, else raise."""
        text = _text(query)
        if len(text) < DEFAULT_LIMITS.min_query_chars:
            raise BoundaryError("query_too_short", "the health-check query is too short to be actionable")
        if len(text) > DEFAULT_LIMITS.max_query_chars:
            raise BoundaryError("query_too_long", "the health-check query exceeds the bounded length")
        for pattern in CREDENTIAL_PATTERNS:
            if pattern.search(text):
                raise BoundaryError("credential_like_query", "the health-check query names credential material")
        for pattern in FORBIDDEN_ACCESS_PATTERNS:
            if pattern.search(text):
                raise BoundaryError("forbidden_access_query", "the health-check query requests interactive or mutating access")
        for match in NAMESPACE_PATTERN.finditer(text):
            namespace = match.group(1).lower()
            if namespace not in ALLOWED_NAMESPACES:
                raise BoundaryError("cross_tenant_scope", "the health-check query names a namespace outside this installation")
        return text


    def validate_schedule_interval_minutes(schedule: str) -> int:
        """Return the maximum repeats per hour implied by a five-field cron.

        The supported grammar is deliberately narrow: the minute field must be one
        integer. `*`, `*/N`, lists and ranges can fire more than once an hour, which
        the initial release does not allow. The scheduler itself is pinned to hourly
        or slower by admission; this function is the resolver-side gate.
        """
        fields = _text(schedule).split()
        if len(fields) != 5:
            raise BoundaryError("invalid_schedule", "the schedule must be a five-field cron expression")
        minute = fields[0]
        if not re.fullmatch(r"\d{1,2}", minute):
            raise BoundaryError("schedule_too_frequent", "the schedule minute must be a single value so it cannot run more than hourly")
        value = int(minute)
        if value < 0 or value > 59:
            raise BoundaryError("invalid_schedule", "the schedule minute is out of range")
        return 60


    def validate_execution_request(payload: Any, guarded_model: str, limits: Limits = DEFAULT_LIMITS) -> Dict[str, Any]:
        """Validate the Holmes `/api/checks/execute` body for monitor-only mode."""
        if not isinstance(payload, dict):
            raise BoundaryError("invalid_request", "the check request is not a JSON object")
        mode = payload.get("mode", "monitor")
        if mode != "monitor":
            raise BoundaryError("alert_mode_refused", "only monitor mode is supported; alert destinations arrive in a later task")
        destinations = payload.get("destinations")
        if destinations not in (None, []):
            raise BoundaryError("destinations_refused", "alert destinations are not supported in monitor-only mode")
        query = validate_query(str(payload.get("query", "")))
        timeout = payload.get("timeout", 30)
        if not isinstance(timeout, int) or isinstance(timeout, bool):
            raise BoundaryError("invalid_timeout", "the check timeout must be an integer number of seconds")
        if timeout < limits.min_timeout_seconds or timeout > limits.max_timeout_seconds:
            raise BoundaryError("timeout_out_of_bounds", "the check timeout is outside the supported range")
        model = payload.get("model")
        if model != guarded_model:
            raise BoundaryError("model_not_guarded", "the check must use the guarded operator model so usage and budgets are enforced")
        return {"query": query, "timeout": timeout, "name": _text(payload.get("name"))}


    _SANITIZE_PATTERNS: Tuple[Tuple[re.Pattern, str], ...] = (
        (re.compile(r"https?://[^\s'\"<>]+", re.IGNORECASE), "<redacted-url>"),
        (re.compile(r"\bBearer\s+[A-Za-z0-9._\-]+", re.IGNORECASE), "Bearer <redacted>"),
        (re.compile(r"(?i)\b(token|password|passwd|api[_-]?key|secret)\b\s*[:=]\s*[^\s,;]+"), r"\1=<redacted>"),
        (re.compile(r"-----BEGIN [A-Z ]+PRIVATE KEY-----.*?-----END [A-Z ]+PRIVATE KEY-----", re.DOTALL), "<redacted-key>"),
        (re.compile(r"\b[a-z0-9+/]{40,}={0,2}\b"), "<redacted-value>"),
        (re.compile(r"[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]"), " "),
    )


    def sanitize_text(value: Any, limit: int) -> str:
        """Return a single-line, credential-free, length-bounded string."""
        if not isinstance(value, str):
            return ""
        text = value
        for pattern, replacement in _SANITIZE_PATTERNS:
            text = pattern.sub(replacement, text)
        text = " ".join(text.split())
        if len(text) > limit:
            text = text[: max(0, limit - 1)].rstrip() + "\u2026"
        return text


    def sanitize_status(payload: Any, limits: Limits = DEFAULT_LIMITS) -> Dict[str, Any]:
        """Reduce a Holmes check response to the fields the CRD may keep."""
        if not isinstance(payload, dict):
            return {
                "status": "error",
                "message": "Holmes returned an unreadable check result",
                "error": "invalid_response",
                "duration": 0.0,
            }
        status = payload.get("status")
        if status not in ("pass", "fail", "error"):
            status = "error"
        result: Dict[str, Any] = {
            "status": status,
            "message": sanitize_text(payload.get("message"), limits.max_message_chars),
            "rationale": sanitize_text(payload.get("rationale"), limits.max_rationale_chars),
            "error": sanitize_text(payload.get("error"), limits.max_error_chars),
            "duration": _bounded_duration(payload.get("duration")),
        }
        model_used = sanitize_text(payload.get("model_used"), 120)
        if model_used:
            result["model_used"] = model_used
        if not result["message"]:
            result["message"] = "Health check produced no summary"
        return result


    def _bounded_duration(value: Any) -> float:
        try:
            duration = float(value)
        except (TypeError, ValueError):
            return 0.0
        if duration < 0:
            return 0.0
        return round(min(duration, 3600.0), 3)


    def usage_from_provider_response(payload: Any) -> Dict[str, int]:
        """Extract token usage and tool-call count from an OpenAI-compatible body.

        Providers that do not report a field contribute zero and are never guessed.
        Cache tokens are counted separately because a cached prompt is still a
        prompt; the daily budget uses the reported input total.
        """
        usage = {"prompt_tokens": 0, "completion_tokens": 0, "total_tokens": 0, "cached_tokens": 0}
        if not isinstance(payload, dict):
            return usage
        raw = payload.get("usage")
        if isinstance(raw, dict):
            usage["prompt_tokens"] = _non_negative_int(raw.get("prompt_tokens"))
            usage["completion_tokens"] = _non_negative_int(raw.get("completion_tokens"))
            usage["total_tokens"] = _non_negative_int(raw.get("total_tokens"))
            if usage["total_tokens"] == 0:
                usage["total_tokens"] = usage["prompt_tokens"] + usage["completion_tokens"]
            details = raw.get("prompt_tokens_details")
            if isinstance(details, dict):
                usage["cached_tokens"] = _non_negative_int(details.get("cached_tokens"))
        return usage


    def tool_output_bytes(messages: Iterable[Any]) -> int:
        """Sum the bytes of tool-role message content without retaining it."""
        total = 0
        for message in messages:
            if not isinstance(message, dict):
                continue
            if message.get("role") != "tool":
                continue
            content = message.get("content")
            if isinstance(content, str):
                total += len(content.encode("utf-8", "replace"))
            elif isinstance(content, list):
                for part in content:
                    if isinstance(part, dict):
                        text = part.get("text")
                        if isinstance(text, str):
                            total += len(text.encode("utf-8", "replace"))
        return total


    def tool_call_count(payload: Any) -> int:
        if not isinstance(payload, dict):
            return 0
        choices = payload.get("choices")
        if not isinstance(choices, list):
            return 0
        count = 0
        for choice in choices:
            if not isinstance(choice, dict):
                continue
            message = choice.get("message")
            if not isinstance(message, dict):
                continue
            calls = message.get("tool_calls")
            if isinstance(calls, list):
                count += len(calls)
        return count


    def _non_negative_int(value: Any) -> int:
        if isinstance(value, bool):
            return 0
        if isinstance(value, int):
            return max(0, value)
        if isinstance(value, float):
            return max(0, int(value))
        return 0


    def summarize_history(entries: List[Dict[str, Any]], limit: int) -> List[Dict[str, Any]]:
        """Keep at most `limit` most recent sanitized entries."""
        if limit <= 0:
            return []
        return entries[-limit:]


    def error_class_for_status(status: int, body: str) -> str:
        """Classify an upstream failure without reading message content."""
        text = (body or "").lower()
        if status == 429 or ("rate" in text and "limit" in text) or "quota" in text:
            return "rate_limited"
        if status in (401, 403):
            return "provider_denied"
        if status == 402 or "insufficient" in text or "billing" in text:
            return "quota_exhausted"
        if status >= 500:
            return "upstream_unavailable"
        return "upstream_error"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: holmes-operator
  namespace: holmes
  labels:
    app.kubernetes.io/name: holmes-operator
    app.kubernetes.io/part-of: sre-platform
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: holmes-operator
  labels:
    app.kubernetes.io/name: holmes-operator
    app.kubernetes.io/part-of: sre-platform
rules:
  # The operator may manage only Holmes health-check resources. It cannot read
  # Pods, Secrets, ConfigMaps or logs, and it cannot mutate any other kind.
  - apiGroups: ["holmesgpt.dev"]
    resources: ["healthchecks"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["holmesgpt.dev"]
    resources: ["healthchecks/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["holmesgpt.dev"]
    resources: ["scheduledhealthchecks", "triggeredhealthchecks"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["holmesgpt.dev"]
    resources: ["scheduledhealthchecks/status", "triggeredhealthchecks/status"]
    verbs: ["get", "patch", "update"]
  # Rollout triggers must observe pod-template changes. Read-only.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Kubernetes events are the operator's own audit trail on the CR.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # kopf watches CRD establishment; metadata only.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: holmes-operator
  labels:
    app.kubernetes.io/name: holmes-operator
    app.kubernetes.io/part-of: sre-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: holmes-operator
subjects:
  - kind: ServiceAccount
    name: holmes-operator
    namespace: holmes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holmes-operator-guard-state
  namespace: holmes
  labels:
    app.kubernetes.io/name: holmes-operator-guard
    app.kubernetes.io/part-of: sre-platform
  annotations:
    # Budget counters and the bounded sanitized history survive a pod restart
    # and a module disable. Destructive deletion is a separate reviewed action.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-operator
  namespace: holmes
  labels:
    app.kubernetes.io/name: holmes-operator
    app.kubernetes.io/part-of: sre-platform
spec:
  # One active scheduler. Recreate never leaves the old pod running beside the
  # new one, so a repeated reconcile cannot run two schedules at once.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: holmes-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: holmes-operator
        app.kubernetes.io/part-of: sre-platform
      annotations:
        platform.sre-platform.io/operator-mode: "monitor-only"
        platform.sre-platform.io/chart-version: "0.42.0"
    spec:
      serviceAccountName: holmes-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "robustadev/holmes-operator:0.42.0@sha256:d947df947562ab1c3fc160cf803e71417bc31f39f265cad947ce2f10b7f7a106"
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "holmes_operator.operator"]
          env:
            - name: HOLMES_API_URL
              value: "http://127.0.0.1:8098"
            - name: HOLMES_API_TIMEOUT
              value: "330"
            - name: LOG_LEVEL
              value: "WARNING"
            - name: ENABLE_JSON_LOGS_FORMAT
              value: "true"
            - name: MAX_HISTORY_ITEMS
              value: "10"
            - name: CLEANUP_COMPLETED_CHECKS
              value: "true"
            - name: COMPLETED_CHECK_TTL_HOURS
              value: "24"
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: guard
          image: "robustadev/holmes-operator:0.42.0@sha256:d947df947562ab1c3fc160cf803e71417bc31f39f265cad947ce2f10b7f7a106"
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/holmes-operator-guard/guard.py"]
          env:
            - name: GUARD_STATE_DIR
              value: "/var/lib/holmes-operator-guard"
            - name: GUARD_API_LISTEN
              value: "127.0.0.1:8098"
            - name: GUARD_PROVIDER_LISTEN
              value: "0.0.0.0:8099"
            - name: GUARD_METRICS_LISTEN
              value: "0.0.0.0:8097"
            - name: HOLMES_UPSTREAM
              value: "http://holmesgpt-holmes.holmes.svc.cluster.local:80"
            - name: PROVIDER_UPSTREAM
              value: "http://holmes-opencode-adapter.holmes.svc.cluster.local:8080/v1"
            - name: GUARD_MODEL_KEY
              value: "operator-deepseek-v4.1-flash"
            - name: GUARD_MAX_RUNS_PER_DAY
              value: "36"
            - name: GUARD_MAX_MODEL_CALLS_PER_DAY
              value: "216"
            - name: GUARD_MAX_TOKENS_PER_DAY
              value: "1000000"
            - name: GUARD_MAX_MODEL_CALLS_PER_RUN
              value: "6"
            - name: GUARD_MAX_TOOL_CALLS_PER_RUN
              value: "12"
            - name: GUARD_MAX_PROMPT_TOKENS_PER_RUN
              value: "120000"
            - name: GUARD_MAX_COMPLETION_TOKENS_PER_RUN
              value: "12000"
            - name: GUARD_MIN_RUN_GAP_SECONDS
              value: "60"
            - name: GUARD_CIRCUIT_FAILURE_THRESHOLD
              value: "3"
            - name: GUARD_CIRCUIT_COOLDOWN_SECONDS
              value: "900"
            - name: GUARD_HISTORY_LIMIT
              value: "20"
          ports:
            - name: metrics
              containerPort: 8097
            - name: provider
              containerPort: 8099
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: guard-code
              mountPath: /opt/holmes-operator-guard
              readOnly: true
            - name: guard-state
              mountPath: /var/lib/holmes-operator-guard
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: guard-code
          configMap:
            name: holmes-operator-guard-code
        - name: guard-state
          persistentVolumeClaim:
            claimName: holmes-operator-guard-state
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-operator-guard
  namespace: holmes
  labels:
    app.kubernetes.io/name: holmes-operator-guard
    app.kubernetes.io/part-of: sre-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: holmes-operator
  ports:
    - name: metrics
      port: 8097
      targetPort: metrics
    - name: provider
      port: 8099
      targetPort: provider
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: holmes-operator-guard
  namespace: holmes
  labels:
    app.kubernetes.io/name: holmes-operator-guard
    app.kubernetes.io/part-of: sre-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: holmes-operator
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Holmes reaches the guarded model entry only.
    - from:
        - podSelector:
            matchLabels:
              app: holmes
      ports:
        - protocol: TCP
          port: 8099
    # Metrics are read-only and carry no prompt, response or credential. They
    # are reachable through the Service proxy for the Control Center and for
    # acceptance evidence.
    - ports:
        - protocol: TCP
          port: 8097
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: holmes
      ports:
        - protocol: TCP
          port: 5050
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: holmes-opencode-adapter
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: holmes-operator-monitor-only
  labels:
    app.kubernetes.io/name: holmes-operator
    app.kubernetes.io/part-of: sre-platform
  annotations:
    policies.kyverno.io/title: "Holmes Operator monitor-only boundary"
    policies.kyverno.io/category: "Platform Security"
    policies.kyverno.io/severity: "high"
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: monitor-only-and-bounded
      match:
        any:
          - resources:
              kinds: ["HealthCheck", "ScheduledHealthCheck", "TriggeredHealthCheck"]
              operations: ["CREATE", "UPDATE"]
      validate:
        cel:
          expressions:
            - expression: "!has(object.spec.mode) || object.spec.mode == 'monitor'"
              message: "Only monitor mode is allowed until alert destinations are implemented."
            - expression: "!has(object.spec.destinations) || object.spec.destinations.size() == 0"
              message: "Alert destinations are not allowed in monitor-only mode."
            - expression: "!has(object.spec.timeout) || (object.spec.timeout >= 5 && object.spec.timeout <= 300)"
              message: "The timeout must be between 5 and 300 seconds."
            - expression: "!has(object.spec.model) || object.spec.model == 'operator-deepseek-v4.1-flash'"
              message: "Every operator check must use the guarded operator model so budgets are enforced."
            - expression: "!has(object.spec.query) || (object.spec.query.size() >= 10 && object.spec.query.size() <= 2000)"
              message: "The query length must be between 10 and 2000 characters."
            - expression: "!has(object.spec.query) || !object.spec.query.matches('(?i)(secret|configmap|password|passwd|token|api[_-]?key|kubeconfig|private[_-]?key|bearer[[:space:]]|BEGIN [A-Z ]+PRIVATE KEY)')"
              message: "The query must not name or contain credential material."
            - expression: "!has(object.spec.query) || !object.spec.query.matches('(?i)(kubectl[[:space:]]+(exec|attach|port-forward|cp|apply|delete|patch|edit|scale)|pods?/exec|port-forward|all[- ]namespaces|cluster[- ]wide)')"
              message: "The query must not request interactive or mutating access."
            - expression: "!has(object.spec.schedule) || object.spec.schedule.matches('^[0-9]{1,2} [^ ]+ [^ ]+ [^ ]+ [^ ]+$')"
              message: "The schedule minute must be a single value so a check cannot run more than hourly."
    - name: rollout-selector-is-bounded
      match:
        any:
          - resources:
              kinds: ["TriggeredHealthCheck"]
              operations: ["CREATE", "UPDATE"]
      validate:
        cel:
          expressions:
            - expression: "!has(object.spec.deploymentRollout) || !has(object.spec.deploymentRollout.selector) || !has(object.spec.deploymentRollout.selector.matchLabels) || object.spec.deploymentRollout.selector.matchLabels.size() > 0"
              message: "A rollout trigger must use a non-empty label selector; an empty selector matches every Deployment in the namespace."
            - expression: "!has(object.spec.deploymentRollout) || !has(object.spec.delaySeconds) || (object.spec.delaySeconds >= 0 && object.spec.delaySeconds <= 604800)"
              message: "The rollout delay must be bounded."
            - expression: "!has(object.spec.deploymentRollout) || !has(object.spec.cooldownSeconds) || (object.spec.cooldownSeconds >= 0 && object.spec.cooldownSeconds <= 86400)"
              message: "The rollout cooldown must be bounded to one day or less."
---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: platform-readiness-hourly
  namespace: holmes
  labels:
    app.kubernetes.io/name: holmes-operator
    app.kubernetes.io/part-of: sre-platform
  annotations:
    platform.sre-platform.io/budget-class: "scheduled"
spec:
  schedule: "0 * * * *"
  enabled: true
  query: >-
    Evaluate the readiness of the platform control plane in this installation:
    Argo CD server and application controller, the ingress controller, the
    Headlamp console and its identity bridge, and the Authelia portal. Use
    Deployment and Pod readiness conditions, but do not read logs, Secrets or
    ConfigMaps. Report pass only when every named workload has an available
    replica and no warning Events in the last 15 minutes; otherwise fail with
    the exact workloads and conditions that are not ready.
  timeout: 240
  mode: monitor
  model: "operator-deepseek-v4.1-flash"
