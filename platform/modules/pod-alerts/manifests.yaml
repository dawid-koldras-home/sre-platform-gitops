---
# Source: alertmanager/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-alertmanager
  labels:
    helm.sh/chart: alertmanager-2.5.1
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: pod-alerts
    app.kubernetes.io/version: "v0.35.0"
    app.kubernetes.io/managed-by: Helm
  namespace: pod-alerts
automountServiceAccountToken: true
---
# Source: alertmanager/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-alertmanager
  labels:
    helm.sh/chart: alertmanager-2.5.1
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: pod-alerts
    app.kubernetes.io/version: "v0.35.0"
    app.kubernetes.io/managed-by: Helm
  namespace: pod-alerts
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    inhibit_rules:
    - equal:
      - namespace
      - workload
      source_matchers:
      - severity="critical"
      target_matchers:
      - severity=~"high|medium|low"
    - equal:
      - namespace
      - workload
      source_matchers:
      - alertname="DeploymentUnavailable"
      target_matchers:
      - alertname=~"PodNotReady|PodPending|PodRestartingFrequently|PodUnexpectedTermination"
    - equal:
      - namespace
      - workload
      source_matchers:
      - alertname="StatefulSetUnavailable"
      target_matchers:
      - alertname=~"PodNotReady|PodPending|PodRestartingFrequently|PodUnexpectedTermination"
    receivers:
    - name: platform-dispatcher
      webhook_configs:
      - http_config:
          authorization:
            credentials_file: /etc/pod-alerts/webhook/token
            type: Bearer
        max_alerts: 10
        send_resolved: true
        url: http://pod-alert-dispatcher.pod-alerts.svc.cluster.local:8088/webhook
    route:
      group_by:
      - customer
      - environment
      - namespace
      - workload
      - alertname
      - severity
      group_interval: 300s
      group_wait: 30s
      receiver: platform-dispatcher
      repeat_interval: 4h
    templates:
    - /etc/alertmanager/*.tmpl
---
# Source: alertmanager/templates/services.yaml
apiVersion: v1
kind: Service
metadata:
  name: platform-alertmanager
  labels:
    helm.sh/chart: alertmanager-2.5.1
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: pod-alerts
    app.kubernetes.io/version: "v0.35.0"
    app.kubernetes.io/managed-by: Helm
  namespace: pod-alerts
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: pod-alerts
