apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickstack-clickhouse
  namespace: "clickstack"
  labels:
    helm.sh/chart: clickhouse-1.0.4
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: "clickstack"
    app.kubernetes.io/version: "26.7.3"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/part-of: helmforge
spec:
  serviceName: clickstack-clickhouse-headless
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
      app.kubernetes.io/instance: "clickstack"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/instance: "clickstack"
      annotations:
        checksum/config: d83bc712ac31218b19ad4b06f701f3ea6deb7ca24e15bbf1e29c57fcf845557e
        checksum/secret: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
    spec:
      serviceAccountName: clickstack-clickhouse
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: clickhouse
          image: "clickhouse/clickhouse-server:26.3"
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_DB
              value: "default"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            - name: tcp
              containerPort: 9000
              protocol: TCP
            - name: interserver
              containerPort: 9009
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: config
              mountPath: /etc/clickhouse-server/config.d/helmforge.xml
              subPath: helmforge.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/users-helmforge.xml
              subPath: users-helmforge.xml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: clickstack-clickhouse-config
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 15Gi
        storageClassName: "linode-block-storage"
