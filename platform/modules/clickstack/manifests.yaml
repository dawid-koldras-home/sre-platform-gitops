# Source: clickhouse/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "clickstack-clickhouse-test-connection"
  namespace: "clickstack"
  labels:
    helm.sh/chart: clickhouse-1.0.4
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: "clickstack"
    app.kubernetes.io/version: "26.7.3"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/part-of: helmforge
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 60
  containers:
    - name: curl
      image: docker.io/curlimages/curl:8.21.0
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -ec
        - |-
          endpoint="http://clickstack-clickhouse:8123"
          auth="${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD:-}"
          curl -fsS --connect-timeout 5 --max-time 15 "${endpoint}/ping" | grep -q Ok
          actual_version="$(curl -fsS --connect-timeout 5 --max-time 15 --user "${auth}" --get --data-urlencode "query=SELECT version()" "${endpoint}/")"
          case "${actual_version}" in
            "${CLICKHOUSE_EXPECTED_VERSION}"*) ;;
            *)
              echo "unexpected ClickHouse version: expected ${CLICKHOUSE_EXPECTED_VERSION}, got ${actual_version}" >&2
              exit 1
              ;;
          esac
          curl -fsS --connect-timeout 5 --max-time 15 --user "${auth}" --get \
            --data-urlencode "query=EXPLAIN ANALYZE SELECT number FROM numbers(10) WHERE number % 2 = 0" \
            "${endpoint}/" | grep -q .
      env:
        - name: CLICKHOUSE_EXPECTED_VERSION
          value: "26.7.3"
        - name: CLICKHOUSE_USER
          value: "default"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

