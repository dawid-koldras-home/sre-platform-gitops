apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: clickstack
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: sre-platform
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          network: {}
          filesystem: {}
    processors:
      batch:
        timeout: 1s
        send_batch_size: 8192
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
    exporters:
      clickhouse:
        endpoint: tcp://clickstack-clickhouse.clickstack.svc.cluster.local:9000
        database: otel
        create_schema: true
        ttl: 0
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
  gateway-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 8192
      memory_limiter:
        check_interval: 1s
        limit_mib: 1024
        spike_limit_mib: 256
    exporters:
      clickhouse:
        endpoint: tcp://clickstack-clickhouse.clickstack.svc.cluster.local:9000
        database: otel
        create_schema: true
        ttl: 0
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
