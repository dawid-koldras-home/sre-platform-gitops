stringData:
  create-otel-db.sh: |
    #!/bin/bash
    set -e
    clickhouse-client --query "CREATE DATABASE IF NOT EXISTS otel"
    clickhouse-client --query "CREATE TABLE IF NOT EXISTS otel.logs (
      Timestamp DateTime64(9),
      TraceId String,
      SpanId String,
      SeverityText LowCardinality(String),
      SeverityNumber Int32,
      ServiceName LowCardinality(String),
      Body String,
      ResourceAttributes Map(LowCardinality(String), String),
      ScopeName String,
      ScopeAttributes Map(LowCardinality(String), String),
      LogAttributes Map(LowCardinality(String), String)
    ) ENGINE = MergeTree()
    ORDER BY (ServiceName, Timestamp)
    TTL Timestamp + INTERVAL 14 DAY
    PARTITION BY toYYYYMM(Timestamp)"
    clickhouse-client --query "CREATE TABLE IF NOT EXISTS otel.traces (
      TraceId String,
      SpanId String,
      ParentSpanId String,
      ServiceName LowCardinality(String),
      OperationName LowCardinality(String),
      SpanKind Int32,
      StartTime DateTime64(9),
      EndTime DateTime64(9),
      Duration UInt64,
      StatusCode Int32,
      StatusMessage String,
      ResourceAttributes Map(LowCardinality(String), String),
      ScopeName String,
      ScopeAttributes Map(LowCardinality(String), String),
      SpanAttributes Map(LowCardinality(String), String)
    ) ENGINE = MergeTree()
    ORDER BY (ServiceName, StartTime)
    TTL StartTime + INTERVAL 14 DAY
    PARTITION BY toYYYYMM(StartTime)"
    clickhouse-client --query "CREATE TABLE IF NOT EXISTS otel.metrics (
      ResourceAttributes Map(LowCardinality(String), String),
      ScopeName String,
      MetricName String,
      MetricDescription String,
      MetricUnit String,
      StartTime DateTime64(9),
      Time DateTime64(9),
      Value Double,
      Flags Int32,
      GaugeValue Nullable(Double),
      SumValue Nullable(Double),
      SumIsMonotonic Bool,
      HistogramCount Nullable(UInt64),
      HistogramSum Nullable(Double),
      HistogramBuckets Array(Nullable(Double)),
      Exemplars Array(Tuple(Timestamp DateTime64(9), Value Double, TraceId String))
    ) ENGINE = MergeTree()
    ORDER BY (MetricName, Time)
    TTL Time + INTERVAL 14 DAY
    PARTITION BY toYYYYMM(Time)"
