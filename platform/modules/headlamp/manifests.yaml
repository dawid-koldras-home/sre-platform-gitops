      }
      if (isPresent(draft, 'certificateExpiry') && draft.certificateExpiry !== undefined && draft.certificateExpiry !== null && draft.certificateExpiry !== '') {
        lines.push(`    certificateExpiry: ${quote(draft.certificateExpiry)}`);
      }
    // Last, because that is where the resolver's accepted-field order puts it.
      if (isPresent(draft, 'ignoreRedirects')) {
        lines.push(`    ignoreRedirects: ${draft.ignoreRedirects === true ? 'true' : 'false'}`);
      }
      return lines.join('\n');
    }

    function parseDuration(value) {
      const text = String(value);
      const unit = text[text.length - 1];
      const magnitude = Number(text.slice(0, -1));
      if (unit === 's') {
        return magnitude * 1000;
      }
      if (unit === 'm') {
        return magnitude * 60000;
      }
      return magnitude * 3600000;
    }

    /**
     * Quote a scalar for YAML.
     *
     * A single-quoted YAML scalar is literal, so a value containing `:` or `#` cannot be
     * reinterpreted as structure or as a comment. Every value goes through this rather than
     * only the awkward ones, because deciding per-value which are awkward is how an unquoted
     * colon eventually reaches a ConfigMap line and changes its meaning.
     */
    function quote(value) {
      return `'${String(value).replace(/'/g, "''")}'`;
    }

    /** The canonical configuration path this fragment belongs under, which is where a
     * customer pastes it and what `srectl` validates. */
    const FRAGMENT_PATH = 'spec.modules.gatus.endpoints';

    /**
     * Render the `spec.modules.gatus.endpoints` fragment.
     *
     * This is the artifact of record for the draft. It is the exact YAML an operator pastes
     * under `spec.modules.gatus.endpoints` in the canonical customer configuration, and it is
     * what `srectl` validates.
     */
    function renderEndpointsYaml(drafts) {
      const sorted = sortEndpoints(drafts);
      const body = sorted.map(draft => serialiseEndpoint(draft)).join('\n');
      return `endpoints:\n${body}\n`;
    }

    /** The exact prefix the imported fragment must carry, so the editor never guesses. */
    const ENDPOINTS_KEY = 'endpoints:';

    /**
     * Parse the `spec.modules.gatus.endpoints` fragment an operator imports.
     *
     * ## Why a bounded reader rather than a YAML library
     *
     * The plugin is deliberately self-contained: it ships no reader of its own, and adding a
     * general-purpose YAML engine would put one in the browser of an operator whose console is
     * meant to hold no credential and write nothing. So this reads exactly the shape this
     * editor emits and the customer configuration uses — one top-level `endpoints` key, then a
     * list of mappings of writable scalar fields — and refuses everything else by name.
     *
     * Refusing rather than guessing is the whole point. A reader that silently skipped an
     * unrecognised construct would produce a fragment missing whatever that construct held, and
     * an operator who pasted it back would delete a real endpoint. Every refusal names the line
     * so the operator can see precisely what the editor would not interpret.
     *
     * ## Why the imported text is not kept anywhere
     *
     * A pasted fragment carries customer targets, which is the one class of value TASK-207
     * keeps out of
     * the console's runtime state. It lives in a React state variable for the lifetime of the
     * page and nothing else: no browser-persisted store, no cookie, no session store, no
     * analytics, no log
     * line, no outbound request. Reloading the console discards it, and that is the intended
     * behaviour rather than a limitation to work around.
     *
     * @returns an object with `drafts` and `problems`. `drafts` is empty whenever anything was
     * refused, because a partial read is exactly the failure mode this parser exists to avoid.
     */
    function parseEndpointsYaml(text) {
      const problems = [];
      const source = String(text === undefined || text === null ? '' : text);
      const lines = source.split('\n');
      const drafts = [];

      let seenTopLevel = false;
      let inList = false;
      let current = null;
      let seenKeys = new Set();

      for (let index = 0; index < lines.length; index += 1) {
        const raw = lines[index];
        const lineNumber = index + 1;
        const withoutComment = stripComment(raw);
        const line = withoutComment.trim();
        // Indentation decides whether a line continues the current endpoint or starts a new
        // one, so it has to be read before the line is trimmed.
        const indented = /^\s/.test(withoutComment);

        if (line === '' || line === '---') {
          // A single document start is tolerated; a second one is refused below by the shape
          // rules, because a multi-document fragment is not what this path accepts.
          continue;
        }

        if (!inList) {
          if (line !== ENDPOINTS_KEY) {
            problems.push(`line ${lineNumber}: expected the fragment to start with "${ENDPOINTS_KEY}", got "${line}"`);
            return { drafts: [], problems };
          }
          seenTopLevel = true;
          inList = true;
          continue;
        }

        if (line.startsWith('- ') || line === '-') {
          current = importDraft(drafts.length);
          drafts.push(current);
          seenKeys = new Set();
          const first = line === '-' ? '' : line.slice(2).trim();
          if (first !== '') {
            if (!assign(current, seenKeys, first, lineNumber, problems)) {
              return { drafts: [], problems };
            }
          }
          continue;
        }

        if (indented) {
          if (!current) {
            problems.push(`line ${lineNumber}: a field appeared before the first endpoint`);
            return { drafts: [], problems };
          }
          if (!assign(current, seenKeys, line, lineNumber, problems)) {
            return { drafts: [], problems };
          }
          continue;
        }

        problems.push(`line ${lineNumber}: expected an endpoint or an indented field, got "${line}"`);
        return { drafts: [], problems };
      }

      if (!seenTopLevel) {
        return { drafts: [], problems: ['the fragment must start with an "endpoints:" key'] };
      }
      if (drafts.length === 0) {
        return { drafts: [], problems: ['the fragment contains no endpoints'] };
      }
      if (problems.length > 0) {
        return { drafts: [], problems };
      }

      // Validation is deliberately not skipped: text that parses is still not necessarily
      // acceptable, and the caller wants the same problems it would show for a typed row.
      const invalid = validateDraft(drafts);
      if (invalid.length > 0) {
        return {
          drafts: [],
          problems: invalid.map(item => `${item.field}: ${item.message}`),
        };
      }
      return { drafts, problems: [] };
    }

    /** Remove a trailing `#` comment that is not inside a quoted scalar. */
    function stripComment(line) {
      let quote = '';
      for (let index = 0; index < line.length; index += 1) {
        const character = line[index];
        if (quote !== '') {
          if (character === quote) {
            // A doubled single quote is an escaped quote, not a terminator.
            if (quote === "'" && line[index + 1] === "'") {
              index += 1;
              continue;
            }
            quote = '';
          }
          continue;
        }
        if (character === "'" || character === '"') {
          quote = character;
          continue;
        }
        if (character === '#' && (index === 0 || /\s/.test(line[index - 1]))) {
          return line.slice(0, index);
        }
      }
      return line;
    }

    /**
     * Assign one `key: value` pair onto a draft, refusing anything it will not interpret.
     *
     * @returns {boolean} false when the line was refused, so the caller can stop immediately
     * rather than accumulate a fragment that is missing a field.
     */
    function assign(draft, seenKeys, line, lineNumber, problems) {
      const separator = findKeySeparator(line);
      if (separator < 0) {
        problems.push(`line ${lineNumber}: expected "field: value", got "${line}"`);
        return false;
      }
      const key = line.slice(0, separator).trim();
      const value = line.slice(separator + 1).trim();

      if (DRAFT_ONLY_FIELDS.includes(key)) {
        problems.push(`line ${lineNumber}: "${key}" is browser bookkeeping and is not a configuration field`);
        return false;
      }
      if (key === '') {
        problems.push(`line ${lineNumber}: a field has no name`);
        return false;
      }
      if (!CONTRACT.writableFields.includes(key)) {
        problems.push(
          `line ${lineNumber}: "${key}" is not a configuration field this page understands`
        );
        return false;
      }
      // Tracked in a set rather than by testing the draft for the key, because a draft is
      // pre-seeded with empty defaults and those must not read as "the fragment set this".
      if (seenKeys.has(key)) {
        problems.push(`line ${lineNumber}: "${key}" is set twice`);
        return false;
      }

      const parsed = parseScalar(key, value, lineNumber, problems);
      if (!parsed.ok) {
        return false;
      }
      seenKeys.add(key);
      draft[key] = parsed.value;
      // An optional field that appears in the fragment is present, whatever its value. That is
      // what keeps an explicit `false` and an explicitly stated default distinguishable from
      // omission all the way to the exporter.
      if (OPTIONAL_FIELDS.includes(key)) {
        draft.presentFields = OPTIONAL_FIELDS.filter(field => field === key || draft.presentFields.includes(field));
      }
      if (key === 'url') {
        draft.targetKnown = true;
      }
      return true;
    }

    /** Find the `:` that separates a key from its value, ignoring quoted colons. */
    function findKeySeparator(line) {
      let quote = '';
      for (let index = 0; index < line.length; index += 1) {
        const character = line[index];
        if (quote !== '') {
          if (character === quote) {
            if (quote === "'" && line[index + 1] === "'") {
              index += 1;
              continue;
            }
            quote = '';
          }
          continue;
        }
        if (character === "'" || character === '"') {
          quote = character;
          continue;
        }
        if (character === ':') {
          return index;
        }
      }
      return -1;
    }

    /** Decode exactly the scalar forms this editor emits, and refuse the rest by name. */
    function parseScalar(key, value, lineNumber, problems) {
      // The three optional booleans are decoded before the generic scalar handling, because a
      // quoted or numeric value has to be refused as a type error rather than carried into the
      // draft as a string the resolver would later reject. Only the bare literals are accepted,
      // which is exactly what the resolver's YAML decoder resolves to a Go bool.
      if (CONTRACT.booleanFields.includes(key)) {
        if (!BOOLEAN_LITERALS.includes(value)) {
          problems.push(
            `line ${lineNumber}: "${key}" must be true or false without quotes, got "${value}"`
          );
          return { ok: false };
        }
        return { ok: true, value: value === 'true' };
      }

      if (value === '') {
        return { ok: true, value: '' };
      }

      if (value.startsWith('[')) {
        if (key !== 'expectedStatusCodes') {
          problems.push(`line ${lineNumber}: "${key}" cannot be a list`);
          return { ok: false };
        }
        if (!value.endsWith(']')) {
          problems.push(`line ${lineNumber}: a multi-line list is not accepted; keep it on one line`);
          return { ok: false };
        }
        const tokens = value
          .slice(1, -1)
          .split(',')
          .map(token => token.trim())
          .filter(token => token !== '');
        const codes = tokens.map(token => Number(token));
        if (codes.some(code => !Number.isInteger(code))) {
          problems.push(`line ${lineNumber}: expectedStatusCodes must contain integers, got "${value}"`);
          return { ok: false };
        }
        return { ok: true, value: codes };
      }

      if (value[0] === '{' || value[0] === '&' || value[0] === '*' || value[0] === '|' || value[0] === '>') {
        problems.push(`line ${lineNumber}: "${key}" uses a YAML construct this page will not interpret`);
        return { ok: false };
      }

      if (value[0] === "'") {
        if (!value.endsWith("'") || value.length < 2) {
          problems.push(`line ${lineNumber}: "${key}" has an unterminated single-quoted value`);
          return { ok: false };
        }
        return { ok: true, value: value.slice(1, -1).replace(/''/g, "'") };
      }

      if (value[0] === '"') {
        if (!value.endsWith('"') || value.length < 2) {
          problems.push(`line ${lineNumber}: "${key}" has an unterminated double-quoted value`);
          return { ok: false };
        }
        try {
          return { ok: true, value: JSON.parse(value) };
        } catch (error) {
          problems.push(`line ${lineNumber}: "${key}" is not a valid double-quoted value`);
          return { ok: false };
        }
      }

      if (key === 'maxResponseTimeMs') {
        const number = Number(value);
        if (!Number.isInteger(number)) {
          problems.push(`line ${lineNumber}: maxResponseTimeMs must be an integer, got "${value}"`);
          return { ok: false };
        }
        return { ok: true, value: number };
      }

      return { ok: true, value };
    }

    /**
     * Canonical sort by id, matching the resolver's stable sort.
     *
     * The order is total and independent of the order rows were added, so the same endpoint
     * set always renders the same fragment and a diff shows a real change rather than a
     * reshuffle.
     */
    function sortEndpoints(drafts) {
      return [...drafts].sort((left, right) => {
        const a = String((left && left.id) || '');
        const b = String((right && right.id) || '');
        if (a === b) {
          return 0;
        }
        return a < b ? -1 : 1;
      });
    }

    /**
     * The display order paired with each row's real position in the draft array.
     *
     * Sorting for display while editing by display position would write an edit into whichever
     * row happens to sit at that index once the ids are re-sorted, so an operator renaming a row
     * would change a different endpoint. Carrying the original index removes that class of bug:
     * the view may reorder freely while every mutation names the row it means.
     */
    function draftOrder(drafts) {
      return sortEndpoints(drafts)
        .map(draft => drafts.indexOf(draft))
        .map(index => ({ draft: drafts[index], index }));
    }

    /**
     * The sanitized endpoint view model the editor starts from.
     *
     * It is built from the delivered metadata, which deliberately carries no target URL, so
     * every draft begins with an empty target. An operator editing a row re-supplies it; the
     * exported fragment is then the complete record.
     *
     * Returning `targetKnown: false` is what lets the view say so, instead of rendering an
     * empty field as though the target were genuinely empty.
     */
    function draftFromMetadata(metadata) {
      return (metadata.endpoints || []).map(spec => {
        const draft = {
          id: String(spec.id || ''),
          name: String(spec.name || ''),
          group: spec.group === CONTRACT.defaultGroup ? '' : String(spec.group || ''),
          url: '',
          interval: canonicalDuration(Number(spec.intervalMs) || CONTRACT.interval.defaultMs),
          timeout: canonicalDuration(Number(spec.timeoutMs) || CONTRACT.timeout.defaultMs),
          targetKnown: false,
          presentFields: [],
        };
        // The delivered metadata carries resolved cadence for every endpoint, so those two are
        // written back explicitly if the operator completes this row. The group is only present
        // when the rendered configuration states a non-default one.
        for (const field of ['interval', 'timeout']) {
          draft.presentFields.push(field);
        }
        if (draft.group !== '') {
          draft.presentFields.push('group');
        }
        draft.presentFields = OPTIONAL_FIELDS.filter(name => draft.presentFields.includes(name));
        return draft;
      });
    }

    /**
     * Add an empty draft row.
     *
     * A new row starts blank rather than prefilled with a guess, because a prefilled target
     * would be a URL nobody chose and it would then be exported as though they had.
     */
    function addDraft(drafts) {
      if (drafts.length >= CONTRACT.maxEndpoints) {
        return { drafts, refused: `at most ${CONTRACT.maxEndpoints} endpoints are configurable` };
      }
      return { drafts: [...drafts, blankDraft(drafts.length)], refused: '' };
    }

    /**
     * A new row.
     *
     * Cadence starts on the documented editor defaults and is marked present, because a row the
     * operator creates has no imported fragment to preserve and the defaults are a deliberate,
     * reviewable starting point rather than something inferred later. The target, the group and
     * the three transport fields start absent, because there is no defensible default for any of
     * them: inventing one would write a URL, a group or a transport acknowledgement that
     * nobody chose.
     */
    function blankDraft(index) {
      return {
        id: '',
        name: '',
        group: '',
        url: '',
        interval: canonicalDuration(CONTRACT.interval.defaultMs),
        timeout: canonicalDuration(CONTRACT.timeout.defaultMs),
        expectedStatusCodes: [...CONTRACT.defaultStatusCodes],
        maxResponseTimeMs: '',
        certificateExpiry: '',
        targetKnown: false,
        isNew: true,
        draftIndex: index,
        presentFields: ['interval', 'timeout', 'expectedStatusCodes'],
      };
    }

    /**
     * An imported row.
     *
     * Identical in shape to a new row except that nothing is marked present: the presence record
     * is built up by the importer from the fragment's own lines, so a field the fragment omitted
     * cannot be mistaken for one it stated. The values are still seeded with the effective
     * defaults, because the form must show the configuration the resolver will actually apply,
     * and hiding a default behind an empty box would misrepresent what is in force.
     */
    function importDraft(index) {
      const draft = blankDraft(index);
      draft.isNew = false;
      draft.presentFields = [];
      return draft;
    }

    /**
     * Replace one row, preserving its position so typing does not reorder the table.
     *
     * The presence record is updated from the patch alone, and only for fields the patch names.
     * That is what makes editing one field leave every untouched field exactly as the imported
     * fragment had it: editing a name cannot materialise a default interval, and clearing a field
     * the operator had set removes it from the fragment rather than exporting it as a default.
     */
    function editDraft(drafts, index, patch) {
      return drafts.map((draft, position) => {
        if (position !== index) {
          return draft;
        }
        let next = { ...draft, ...patch };
        for (const field of OPTIONAL_FIELDS) {
          if (!Object.prototype.hasOwnProperty.call(patch, field)) {
            continue;
          }
          const value = next[field];
          const cleared =
            value === undefined ||
            value === null ||
            value === '' ||
            (Array.isArray(value) && value.length === 0);
          next = withPresence(next, field, !cleared);
        }
        return next;
      });
    }

    /** Remove one row. An invalid list is a property of the whole draft, not of a row. */
    function removeDraft(drafts, index) {
      return drafts.filter((_, position) => position !== index);
    }

    /**
     * The workflow state of a draft, stated explicitly.
     *
     * A local draft is never reported as live. `unapplied` is the honest terminal state for
     * this phase, and the view is required to render it as such rather than implying the
     * change reached the cluster.
     */
    const WORKFLOW_STATE = {
      draft: 'draft',
      invalid: 'invalid',
      unapplied: 'unapplied',
    };

    /**
     * Derive the workflow state from the draft.
     *
     * There is no `submitted`, `reconciling` or `applied` state in this phase, because no
     * write path exists to reach them. Inventing the states now would put a progress
     * indicator on screen that can never advance.
     */
    function workflowState(drafts) {
      const problems = validateDraft(drafts);
      if (problems.length > 0) {
        return WORKFLOW_STATE.invalid;
      }
      return WORKFLOW_STATE.draft;
    }

    /** Problems for one row, so one malformed endpoint degrades only its own row. */
    function problemsForIndex(problems, index) {
      return problems.filter(item => item.index === index);
    }

    /**
     * Compute the derived NetworkPolicy egress ports a draft implies.
     *
     * The resolver derives egress from the endpoints' target hosts and ports — including the
     * port each scheme lands on when the target names none — so the plan an operator reviews
     * here is the policy the installer will render, not an approximation of it. Reporting only
     * the ports an operator typed explicitly would understate the grant and would hide the one
     * that matters: adding a target adds a rule even when the port is the default.
     *
     * Only the port is reported, never the host. The host is customer topology, and this
     * string is rendered, copied and pasted.
     */
    function derivedEgressPorts(drafts) {
      return deriveEgress(drafts).ports;
    }

    /**
     * Derive the full egress picture the plan shows.
     *
     * The resolver derives egress from the endpoints' target hosts and ports — including the
     * port each scheme lands on when the target names none — so the plan an operator reviews here
     * is the policy the installer will render, not an approximation of it. Reporting only the
     * ports an operator typed explicitly would understate the grant and would hide the one that
     * matters: adding a target adds a rule even when the port is the default.
     *
     * Explicit and scheme-default ports are reported separately as well as together, because
     * they are different decisions. An explicit port is a choice the operator made; 443 on an
     * https target is an inference this page made and the operator should be able to see it.
     *
     * Only ports and destination classes are reported, never the host. The host is customer
     * topology, and this string is rendered, copied and pasted.
     */
    function deriveEgress(drafts) {
      const ports = new Set();
      const explicit = new Set();
      const schemeDefaults = new Set();
      let clusterInternal = 0;
      let publicTargets = 0;
      let unknown = 0;
      let cleartextHttp = false;
      let redirectSuppressed = false;

      for (const draft of drafts) {
        const described = describeDestination(draft);
        // A row with no usable target grants no egress and is not a destination. Counting it
        // would make the plan overstate the NetworkPolicy change the operator is about to make.
        if (described.klass === 'unset') {
          continue;
        }
        if (described.klass === 'cluster-internal') {
          clusterInternal += 1;
        } else if (described.klass === 'public') {
          publicTargets += 1;
        } else {
          unknown += 1;
        }
        if (described.port) {
          ports.add(described.port);
          if (described.source === 'explicit') {
            explicit.add(described.explicitPort);
          } else if (described.source === 'scheme-default') {
            schemeDefaults.add(described.schemeDefaultPort);
          }
        }
        if (draft && draft.allowInsecureHttp === true) {
          cleartextHttp = true;
        }
        if (draft && draft.ignoreRedirects === true) {
          redirectSuppressed = true;
        }
      }

      const ascending = set => [...set].sort((left, right) => left - right);
      return {
        ports: ascending(ports),
        explicitPorts: ascending(explicit),
        schemeDefaultPorts: ascending(schemeDefaults),
        clusterInternalTargets: clusterInternal,
        publicTargets,
        unclassifiedTargets: unknown,
        cleartextHttp,
        redirectSuppressed,
      };
    }

    /**
     * Build the sanitized plan.
     *
     * The comparison is by id, because that is the stable key the view keys rows on. A
     * changed endpoint is reported as changed without its target being printed, so the plan
     * can be shown to anyone who can see the console without leaking topology.
     */
    function buildPlan(current, drafts) {
      const currentById = new Map(current.map(spec => [String(spec.id || ''), spec]));
      const draftById = new Map(drafts.filter(draft => draft && draft.id).map(draft => [draft.id, draft]));

      const added = [];
      const changed = [];
      for (const draft of sortEndpoints([...drafts])) {
        const id = draft.id;
        if (id === '') {
          continue;
        }
        const existing = currentById.get(id);
        if (!existing) {
          added.push(sanitiseSummary(draft));
          continue;
        }
        const differences = describeChanges(existing, draft);
        if (differences.length > 0) {
          changed.push({ ...sanitiseSummary(draft), differences });
        }
      }

      const removed = current
        .filter(spec => !draftById.has(String(spec.id || '')))
        .map(spec => ({ id: String(spec.id || ''), name: String(spec.name || ''), group: String(spec.group || '') }));

      // The delivered metadata carries no target, so the currently granted egress set is not
      // derivable in the browser. That is reported as unknown rather than guessed: the plan
      // shows the full derived set and tells the operator to confirm it against the rendered
      // policy, instead of implying some of it is already allowed.
      const currentPorts = derivedEgressPorts(
        current.map(spec => ({ url: spec.url })).filter(spec => spec.url)
      );
      const currentEgressPortsKnown = current.some(spec => typeof spec.url === 'string' && spec.url !== '');
      const egress = deriveEgress(drafts);
      const draftPorts = egress.ports;
      const newPorts = currentEgressPortsKnown
        ? draftPorts.filter(port => !currentPorts.includes(port))
        : draftPorts;

      return {
        added,
        changed,
        removed,
        egressPorts: draftPorts,
        newEgressPorts: newPorts,
        currentEgressPortsKnown,
        egress,
        expectedRollout: 'gatus',
        rollback: 'git revert the customer configuration commit, then re-apply through srectl',
        checkerLimit: 'an in-cluster checker cannot detect a total cluster outage',
        applied: false,
      };
    }

    /** The endpoint identity and cadence, with no target. */
    function sanitiseSummary(draft) {
      const described = describeDestination(draft);
      return {
        id: draft.id,
        name: draft.name,
        group: draft.group === '' ? CONTRACT.defaultGroup : draft.group,
        interval: draft.interval,
        timeout: draft.timeout,
        // The destination class, not the destination. This is the one fact about the target an
        // operator needs in order to review the egress grant, and it names no host.
        destination: described.klass,
        cleartextHttp: draft.allowInsecureHttp === true,
        redirectSuppressed: draft.ignoreRedirects === true,
      };
    }

    /**
     * Name the fields that differ, so a plan says what changes without printing a target.
     *
     * A target change is reported as `url` rather than as the URL. The plan has to be
     * reviewable, and a reviewable plan that contained every hostname would be a second copy
     * of the customer's topology.
     */
    function describeChanges(existing, draft) {
      const differences = [];
      if (String(existing.name || '') !== String(draft.name || '')) {
        differences.push('name');
      }
      const existingGroup = existing.group === CONTRACT.defaultGroup ? '' : String(existing.group || '');
      if (existingGroup !== String(draft.group || '')) {
        differences.push('group');
      }
      const existingInterval = canonicalDuration(Number(existing.intervalMs) || CONTRACT.interval.defaultMs);
      if (existingInterval !== canonicalDuration(parseDuration(draft.interval))) {
        differences.push('interval');
      }
      const existingTimeout = canonicalDuration(Number(existing.timeoutMs) || CONTRACT.timeout.defaultMs);
      if (existingTimeout !== canonicalDuration(parseDuration(draft.timeout))) {
        differences.push('timeout');
      }
      // The metadata never carries the target, so a target change is undetectable here and is
      // not reported. The exported fragment is the record of what the target becomes.
      return differences;
    }

    /**
     * The reviewed command an operator runs after reviewing the fragment.
     *
     * It is a plan, not an action: nothing in this module runs it. The file path is the
     * operator's canonical configuration, which this module has deliberately not read and
     * cannot know.
     */
    function renderApplyCommand(configurationPath) {
      return `srectl apply -f ${configurationPath}`;
    }
      // ---- src/editorview.js ----
    // Endpoint fragment editor on the settings-namespaced plugin route.
    //
    // ## What this page is, and what it deliberately is not
    //
    // It is a draft builder. It reads the authoritative endpoint list the installer already
    // rendered, lets an operator add, edit or remove rows, validates the whole list with the
    // installer's semantics, shows a sanitized plan, and exports the exact
    // `spec.modules.gatus.endpoints` YAML fragment for a reviewed `srectl` run.
    //
    // It is not a write path, and that is a finding rather than an omission. The merged
    // baseline contains no server-side service that can update the canonical customer
    // configuration through a reviewable commit or pull request: `control-center/` is seven
    // markdown files with no code, and nothing in the repository commits customer YAML. The
    // valid write paths in the write-path contract therefore do not exist yet, so TASK-209's
    // contract requires this phase to fail closed, and it does.
    //
    // The alternatives were all rejected on the record. A hidden ConfigMap, a CRD, a
    // browser-persisted source of truth, a Git token held by the page, a direct manifest
    // editor or a second
    // controller would each make the console a reconciler holding a credential, which is what
    // the platform architecture forbids. Every one of them would also have satisfied the
    // literal wording of "Add/Edit/Remove" while violating the intent of "must not turn
    // Headlamp into a second reconciler".
    //
    // ## What it will not do
    //
    // It issues no write request of any kind. It holds no credential, reads no Secret and
    // stores nothing between visits: the draft lives in React state, so a reload discards it
    // and a discarded draft is the cheapest possible rollback. It never shows a local draft
    // as live; the workflow state is rendered as `draft` or `invalid` and the fragment is
    // labelled unapplied.


    /**
     * A short, always-visible statement of what this page does not do.
     *
     * It is above the controls rather than in a dialog or a tooltip, because the one thing an
     * operator must not leave this page believing is that an edit reached the cluster.
     */
    function NotAppliedNotice() {
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mb: 2, borderColor: 'warning.main' } },
        h(Typography, { variant: 'h6', gutterBottom: true, color: 'warning.main' }, 'Draft only — not applied'),
        h(
          Typography,
          { variant: 'body2' },
          'This page builds and validates a draft. It cannot change the platform: there is no ' +
            'approved server-side API that updates the canonical customer configuration, and this ' +
            'page deliberately does not write to Kubernetes, to a ConfigMap or to Git. Take the ' +
            'fragment, paste it under ',
          h(Typography, { component: 'span', variant: 'body2', sx: { fontFamily: 'monospace' } }, FRAGMENT_PATH),
          ' in your customer configuration, review the diff, and apply through srectl. The draft ' +
            'is discarded when this tab closes.'
        )
      );
    }

    function field(name, label, value, onChange, options) {
      const settings = options || {};
      // Resolved per call so a console that lacks the control fails on the editor row rather
      // than preventing the whole payload from loading.
      const Input = TextField();
      const props = {
        key: name,
        label: settings.label || name,
        value: value === undefined || value === null ? '' : String(value),
        onChange: event => onChange(name, event.target.value),
        size: 'small',
        fullWidth: true,
        placeholder: settings.placeholder || '',
        helperText: settings.helperText || '',
        type: settings.type || 'text',
        sx: { mb: 1 },
      };
      if (settings.disabled) {
        props.disabled = true;
      }
      if (settings.error) {
        props.error = true;
      }
      return h(Input, props);
    }

    /**
     * One draft row.
     *
     * A malformed row degrades only itself: problems are addressed by index, so a bad URL in
     * row three does not blank the two healthy rows. An invalid submitted list still fails the
     * whole plan, because the exported fragment is a single list and a partly-valid one is not
     * a thing the resolver accepts.
     */
    function DraftRow({ draft, index, problems, onEdit, onRemove, unknownTarget }) {
      // A metadata-derived row has no target, so editing or removing it would produce a
      // replacement fragment that silently drops an endpoint the operator never saw. The
      // controls are disabled rather than hidden, because the row is still displayed and an
      // operator is entitled to know why it cannot be touched.
      const locked = Boolean(unknownTarget);
      const patch = (name, value) => {
        if (!locked) {
          onEdit(index, { [name]: value });
        }
      };
      const remove = () => {
        if (!locked) {
          onRemove(index);
        }
      };
      const has = name => problems.some(item => item.field === `endpoints[${index}].${name}`);
      const messageFor = name => {
        const item = problems.find(entry => entry.field === `endpoints[${index}].${name}`);
        return item ? item.message : '';
      };

      const statusCodes = Array.isArray(draft.expectedStatusCodes) ? draft.expectedStatusCodes.join(',') : '';
      // Validation still reports on a locked row. An unresolvable url is a known, expected
      // state for a row the console cannot fully hold, and hiding that would leave the page
      // claiming the draft was complete.
      const notes = { locked };

      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mb: 2 } },
        h(
          Box,
          { sx: { display: 'flex', alignItems: 'center', mb: 1 } },
          h(Chip, { key: 'id', size: 'small', label: draft.id || `row ${index + 1}`, sx: { mr: 1 } }),
          draft.isNew
            ? h(Chip, { key: 'new', size: 'small', label: 'new', color: 'info', sx: { mr: 1 } })
            : null,
          h(
            Box,
            { key: 'rm', sx: { marginLeft: 'auto' } },
            h(
              Button(),
              { key: 'rm', color: 'error', size: 'small', disabled: locked, onClick: remove },
              'Remove'
            )
          )
        ),
        h(
          Box,
          { sx: { display: 'flex', flexWrap: 'wrap', gap: 2 } },
          h(
            Box,
            { key: 'a', sx: { flex: '1 1 220px' } },
            field('id', 'id', draft.id, patch, {
              disabled: notes.locked,
              error: has('id'),
              helperText: messageFor('id'),
            }),
            field('name', 'name', draft.name, patch, {
              disabled: notes.locked,
              error: has('name'),
              helperText: messageFor('name'),
            })
          ),
          h(
            Box,
            { key: 'b', sx: { flex: '1 1 220px' } },
            field('group', 'group', draft.group, patch, {
              disabled: notes.locked,
              helperText:
                draft.group === '' ? `empty means "${CONTRACT.defaultGroup}"` : messageFor('group'),
              error: has('group'),
            }),
            field(
              'url',
              'url',
              draft.url,
              patch,
              {
                disabled: notes.locked,
                error: has('url'),
                helperText:
                  messageFor('url') ||
                  (draft.url === '' && !draft.isNew
                    ? 'not held by this console; re-supply the target you intend'
                    : ''),
                placeholder: 'https://',
              }
            )
          ),
          h(
            Box,
            { key: 'c', sx: { flex: '1 1 220px' } },
            field('interval', 'interval', draft.interval, patch, {
              disabled: notes.locked,
              error: has('interval'),
              helperText:
                messageFor('interval') ||
                `${CONTRACT.interval.minMs / 1000}s–${CONTRACT.interval.maxMs / 1000}s`,
            }),
            field('timeout', 'timeout', draft.timeout, patch, {
              disabled: notes.locked,
              error: has('timeout'),
              helperText:
                messageFor('timeout') ||
                `${CONTRACT.timeout.minMs / 1000}s–${CONTRACT.timeout.maxMs / 1000}s`,
            }),
            field(
              'expectedStatusCodes',
              'expectedStatusCodes',
              statusCodes,
              value => patch('expectedStatusCodes', parseStatusCodes(value)),
              {
                disabled: notes.locked,
                helperText:
                  messageFor('expectedStatusCodes') ||
                  `1–${CONTRACT.maxStatusCodes} codes, default 200`,
              }
            ),
            field('maxResponseTimeMs', 'maxResponseTimeMs', draft.maxResponseTimeMs, patch, {
              disabled: notes.locked,
              error: has('maxResponseTimeMs'),
              helperText:
                messageFor('maxResponseTimeMs') ||
                `below timeout, max ${CONTRACT.maxResponseTimeMs}`,
            }),
            field('certificateExpiry', 'certificateExpiry', draft.certificateExpiry, patch, {
              disabled: notes.locked,
              error: has('certificateExpiry'),
              helperText: messageFor('certificateExpiry') || 'h or d, max 90d',
            })
          )
        ),
        h(AdvancedFields, { draft, patch, disabled: notes.locked, problems, index }),
        unknownTarget ? UnknownTargetNotice() : null
      );
    }

    /**
     * The Advanced section: the three optional booleans.
     *
     * They are behind their own labelled section because each one changes what the check is
     * allowed to do rather than how often it runs, and an operator reviewing a fragment should
     * be able to see that a cleartext or in-cluster decision was made deliberately.
     *
     * Each control is a switch rather than a text field, because the resolver requires a real
     * boolean: a free-text control would let an operator type `1` or `yes`, which the
     * installer refuses, and the editor would then have shown a plan for something that cannot
     * be applied. Toggling sets an explicit true or false; toggling back off leaves the field
     * set to false rather than removing it, so a deliberate `false` survives a round trip
     * instead of silently reverting to "not stated".
     *
     * The warnings name a behaviour, never a target. This page must be able to explain a
     * transport decision without printing the hostname the decision applies to.
     */
    function AdvancedFields({ draft, patch, disabled, problems, index }) {
      const Toggle = Switch();
      const messageFor = name => {
        const item = problems.find(entry => entry.field === `endpoints[${index}].${name}`);
        return item ? item.message : '';
      };
      const control = name => {
        const enabled = draft[name] === true;
        return h(
          Box,
          { key: name, sx: { display: 'flex', alignItems: 'flex-start', mb: 1 } },
          h(Toggle, {
            key: 'sw',
            checked: enabled,
            disabled,
            size: 'small',
            inputProps: { 'aria-label': name },
            onChange: (event, checked) => patch(name, checked === true),
          }),
          h(
            Box,
            { key: 'txt', sx: { ml: 1 } },
            h(
              Typography,
              { key: 'lbl', variant: 'body2', sx: { fontFamily: 'monospace' } },
              `${name}: ${enabled ? 'true' : 'false'}`
            ),
            h(
              Typography,
              { key: 'note', variant: 'caption', sx: { display: 'block' } },
              ADVANCED_FIELD_NOTES[name]
            ),
            messageFor(name)
              ? h(
                  Typography,
                  { key: 'err', variant: 'caption', color: 'error.main', sx: { display: 'block' } },
                  messageFor(name)
                )
              : null
          )
        );
      };

      return h(
        Box,
        { sx: { mt: 2, pt: 1, borderTop: '1px solid', borderColor: 'divider' } },
        h(Typography, { variant: 'subtitle2' }, 'Advanced — changes what the check may do'),
        h(
          Typography,
          { variant: 'caption', sx: { display: 'block', mb: 1 } },
          'These change network reachability or redirect handling, not cadence. Each is validated ' +
            "with the installer's own rules, and each is written to the fragment only when set."
        ),
        control('allowClusterInternal'),
        control('allowInsecureHttp'),
        control('ignoreRedirects')
      );
    }

    /**
     * Label a plan row's destination without naming it.
     *
     * "cluster-internal" is the fact that matters for egress review; the transport flags follow
     * it because a cleartext or redirect-suppressing endpoint is one an operator should notice
     * even when nothing else changed.
     */
    function describeDestinationLabel(row) {
      const parts = [row.destination || 'unknown'];
      if (row.cleartextHttp) {
        parts.push('cleartext http');
      }
      if (row.redirectSuppressed) {
        parts.push('no redirect follow');
      }
      return parts.join(', ');
    }

    /**
     * Parse the comma-separated status codes, keeping an unparseable token as text so the
     * validation error names the input the operator typed rather than a coerced number.
     */
    function parseStatusCodes(value) {
      const tokens = String(value)
        .split(',')
        .map(token => token.trim())
        .filter(token => token !== '');
      return tokens.map(token => (/^\d+$/.test(token) ? Number(token) : token));
    }

    /** The sanitized plan: what changes, what egress it implies, how it rolls back. */
    function PlanPanel({ plan, state, fragment, onCopy }) {
      if (state === WORKFLOW_STATE.invalid) {
        return h(
          Paper,
          { variant: 'outlined', sx: { p: 2, mb: 2 } },
          h(Typography, { variant: 'h6', gutterBottom: true, color: 'error.main' }, 'Draft is invalid'),
          h(
            Typography,
            { variant: 'body2' },
            'Nothing can be exported until every row is valid. Fix the rows above; a single bad ' +
              'endpoint is not exportable because the fragment is one list.'
          )
        );
      }

      const section = (label, rows, describe) => {
        if (!rows || rows.length === 0) {
          return null;
        }
        return h(
          Box,
          { key: label, sx: { mb: 1 } },
          h(Typography, { variant: 'subtitle2' }, `${label} (${rows.length})`),
          h(
            Box,
            { component: 'ul', sx: { m: 0, pl: 3 } },
            rows.map(row => h('li', { key: row.id }, describe(row)))
          )
        );
      };

      const egress = plan.egress || {};
      const transport = [];
      if (egress.cleartextHttp) {
        transport.push('cleartext http accepted');
      }
      if (egress.redirectSuppressed) {
        transport.push('redirects not followed');
      }

      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mb: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true }, 'Plan (not applied)'),
        section('added', plan.added, row => `${row.id} — ${row.group} — ${describeDestinationLabel(row)}`),
        section(
          'changed',
          plan.changed,
          row => `${row.id} — ${row.differences.join(', ') || 'target'} — ${describeDestinationLabel(row)}`
        ),
        section('removed', plan.removed, row => `${row.id} — ${row.group}`),
        h(
          Typography,
          { variant: 'body2', sx: { mt: 1 } },
          `Derived NetworkPolicy egress ports: ${plan.egressPorts.join(', ') || 'none'}` +
            (plan.newEgressPorts.length > 0
              ? ` — new: ${plan.newEgressPorts.join(', ')}`
              : ' (no new port)')
        ),
        // Port provenance, because an explicit port is an operator decision and 443 on an https
        // target is this page's inference. An operator reviewing egress needs to tell them apart.
        h(
          Typography,
          { variant: 'body2' },
          `Explicit ports: ${(egress.explicitPorts || []).join(', ') || 'none'} — ` +
            `scheme-default ports: ${(egress.schemeDefaultPorts || []).join(', ') || 'none'}`
        ),
        // Destination class, because it is what decides whether the egress grant is a wildcard
        // address rule or a single named destination. No hostname is shown to say it.
        h(
          Typography,
          { variant: 'body2' },
          `Destinations: ${egress.publicTargets || 0} public, ` +
            `${egress.clusterInternalTargets || 0} cluster-internal` +
            (egress.unclassifiedTargets ? `, ${egress.unclassifiedTargets} unclassified` : '')
        ),
        transport.length > 0
          ? h(Typography, { variant: 'body2', color: 'warning.main' }, `Transport: ${transport.join('; ')}`)
          : null,
        h(Typography, { variant: 'body2' }, `Expected rollout: ${plan.expectedRollout}`),
        h(Typography, { variant: 'body2' }, `Rollback: ${plan.rollback}`),
        h(Typography, { variant: 'caption', sx: { display: 'block', mt: 1 } }, plan.checkerLimit),
        h(
          Typography,
          { variant: 'subtitle2', sx: { mt: 2 } },
          `${FRAGMENT_PATH} — paste under this path`
        ),
        h(
          Box,
          {
            component: 'pre',
            sx: {
              p: 1,
              mb: 1,
              fontSize: '0.8rem',
              overflowX: 'auto',
              bgcolor: 'action.hover',
            },
          },
          fragment
        ),
        h(
          Box,
          { sx: { display: 'flex', flexWrap: 'wrap', gap: 1, mb: 1 } },
          h(
            Button(),
            { key: 'copy', size: 'small', variant: 'outlined', onClick: () => onCopy(fragment) },
            'Copy fragment'
          ),
          h(
            Button(),
            { key: 'dl', size: 'small', variant: 'outlined', onClick: () => downloadText('gatus-endpoints.yaml', fragment) },
            'Download fragment'
          )
        ),
        h(
          Typography,
          { variant: 'caption', sx: { display: 'block' } },
          `After reviewing, apply the whole customer configuration with: ${renderApplyCommand('<your-customer-config.yaml>')}`
        )
      );
    }

    /**
     * The paste panel: the only way an existing endpoint target can reach this page.
     *
     * ## Why pasting the current fragment is required rather than optional
     *
     * The delivered metadata carries identity and cadence but deliberately carries no target, so
     * the browser cannot reconstruct what an operator has configured today. That is the correct
     * privacy boundary, and it has a direct consequence for editing: an Edit or Remove action on
     * a row whose target was never delivered would produce a replacement fragment silently
     * missing that target, and pasting it back would delete a real endpoint.
     *
     * So this page refuses to offer Edit or Remove on an imported set it has not read. The
     * operator supplies the current fragment explicitly, it is validated, and only then does the
     * page offer full Add/Edit/Remove over the complete list. Without the current fragment the
     * page still
     * works, but only for Add: an operator can compose a new endpoint without ever being able to
     * damage one they have not shown the page.
     *
     * ## Why the pasted fragment is not kept anywhere
     *
     * A pasted fragment is the only customer target this console ever holds. It lives in React
     * state and nowhere else: no browser-persisted store, no session storage, no cookie, no
     * telemetry, no log line, no network request. Reloading the console discards it. That is the
     * intended behaviour, and it is why the page can be trusted not to accumulate customer
     * topology in a browser.
     */
    function ImportPanel({ text, onText, onImport, refused, imported }) {
      const Input = TextField();
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mb: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true }, 'Import the current fragment'),
        h(
          Typography,
          { variant: 'body2', sx: { mb: 1 } },
          'The console is given the endpoint list without its targets, so it cannot edit what it ' +
            'cannot see. Paste the ',
          h(Typography, { component: 'span', variant: 'body2', sx: { fontFamily: 'monospace' } }, FRAGMENT_PATH),
          ' fragment from your customer configuration to enable editing and removing existing ' +
            'endpoints. It is validated, held only in this tab and discarded on reload.'
        ),
        h(Input, {
          key: 'import',
          label: 'Current endpoints fragment (YAML)',
          value: text,
          onChange: event => onText(event.target.value),
          multiline: true,
          minRows: 6,
          fullWidth: true,
          placeholder: 'endpoints:\n  - id: ...\n    name: ...\n    url: ...',
          sx: { fontFamily: 'monospace' },
        }),
        imported
          ? h(
              Typography,
              { variant: 'caption', sx: { display: 'block', mt: 1 } },
              `${imported} endpoints imported. The draft is now editable and removable.`
            )
          : null,
        refused.length > 0
          ? h(
              Paper,
              { key: 'refusals', variant: 'outlined', sx: { p: 1, mt: 1, borderColor: 'error.main' } },
              h(Typography, { variant: 'body2', color: 'error.main' }, 'The fragment was not imported:'),
              h(
                Typography,
                { component: 'ul', variant: 'body2', sx: { m: 0, pl: 2 } },
                refused.map((reason, index) => h('li', { key: `r:${index}` }, reason))
              ),
              h(
                Typography,
                { variant: 'caption', sx: { display: 'block', mt: 1 } },
                'Nothing was imported, so no existing endpoint was changed. Every endpoint below ' +
                  'still has an unknown target.'
              )
            )
          : null,
        h(
          Box,
          { sx: { mt: 1, display: 'flex', justifyContent: 'flex-end' } },
          h(Button(), { size: 'small', variant: 'outlined', onClick: onImport }, 'Import fragment')
        )
      );
    }

    /**
     * The per-row warning shown when a target is unknown.
     *
     * Without it an empty target field reads as "this endpoint has no target", which is a very
     * different statement from "this page was never told the target", and the difference is the
     * one that would delete a live endpoint.
     */
    function UnknownTargetNotice() {
      return h(
        Typography,
        { variant: 'caption', sx: { display: 'block', color: 'warning.main' } },
        'Target unknown: the console is not given existing targets. Import the current fragment ' +
          'to edit or remove this endpoint, or supply a target to add it.'
      );
    }

    /**
     * The endpoint editor page.
     *
     * Exported and registered by view.js so every route in this plugin is registered in one
     * place, and so the editor is part of the module graph the build follows rather than a
     * module that silently fails to ship.
     */
    function EndpointEditorPage() {
      const metadata = useMemo(() => readEndpointMetadata(), []);
      const [drafts, setDrafts] = useState(() => draftFromMetadata(metadata));
      const [notice, setNotice] = useState('');
      const [importText, setImportText] = useState('');
      const [refused, setRefused] = useState([]);
      const [importedCount, setImportedCount] = useState(0);

      const state = workflowState(drafts);
      const problems = useMemo(() => validateDraft(drafts), [drafts]);
      const plan = useMemo(() => buildPlan(metadata.endpoints || [], drafts), [metadata, drafts]);
      const fragment = useMemo(() => renderEndpointsYaml(drafts), [drafts]);

      const onEdit = useCallback((index, patch) => setDrafts(current => editDraft(current, index, patch)), []);
      const onRemove = useCallback((index) => setDrafts(current => removeDraft(current, index)), []);
      const onAdd = useCallback(() => {
        setDrafts(current => {
          const result = addDraft(current);
          setNotice(result.refused);
          return result.drafts;
        });
      }, []);

      const onImport = useCallback(() => {
        const result = parseEndpointsYaml(importText);
        setRefused(result.problems);
        if (result.problems.length > 0) {
          // Nothing is replaced on a refusal: a partial read is the one outcome that could
          // silently drop an endpoint, so the existing draft is left exactly as it was.
          setNotice('');
          return;
        }
        setDrafts(result.drafts);
        setImportedCount(result.drafts.length);
        setNotice('');
      }, [importText]);

      const onCopy = useCallback(text => {
        copyText(text).then(result => setNotice(result));
      }, []);

      if (metadata.degraded) {
        return h(
          Paper,
          { variant: 'outlined', sx: { p: 2 } },
          h(Typography, { variant: 'h6', gutterBottom: true, color: 'error.main' }, 'Endpoint metadata is missing'),
          h(
            Typography,
            { variant: 'body2' },
            'The installer did not render the endpoint list next to this plugin, so there is ' +
              'nothing authoritative to edit and no draft can be compared to the live ' +
              'configuration. Re-apply the installation to restore it. No draft is offered rather ' +
              'than a draft that would overwrite an unknown list.'
          )
        );
      }

      // Display order is canonical, but every mutation names the row by its real position, so
      // re-sorting the table can never redirect an edit onto a different endpoint.
      const ordered = draftOrder(drafts);

      return h(
        Box,
        { sx: { p: 2 } },
        h(Typography, { variant: 'h5', gutterBottom: true }, 'Service Status endpoints'),
        NotAppliedNotice(),
        ImportPanel({
          text: importText,
          onText: setImportText,
          onImport,
          refused,
          imported: importedCount,
        }),
        h(
          Box,
          { sx: { display: 'flex', alignItems: 'center', mb: 2, flexWrap: 'wrap', gap: 1 } },
          h(
            Chip,
            {
              key: 'state',
              label: state,
              color: state === WORKFLOW_STATE.invalid ? 'error' : 'default',
              sx: { mr: 1 },
            },
            null
          ),
          h(
            Box,
            { key: 'add', sx: { marginLeft: 'auto' } },
            h(Button(), { size: 'small', variant: 'contained', onClick: onAdd }, 'Add endpoint')
          )
        ),
        notice
          ? h(
              Paper,
              { key: 'notice', variant: 'outlined', sx: { p: 1, mb: 2 } },
              h(Typography, { variant: 'body2' }, notice)
            )
          : null,
        ordered.map(({ draft, index }) =>
          h(DraftRow, {
            key: draft.id ? `d:${draft.id}` : `d:${index}`,
            draft,
            index,
            problems: problemsForIndex(problems, index),
            onEdit,
            onRemove,
            unknownTarget: !draft.targetKnown,
          })
        ),
        PlanPanel({ plan, state, fragment, onCopy })
      );
    }

      // ---- src/view.js ----
    // The Service Status page.
    //
    // This is a read-only view over what Gatus already reported. It performs one GET
    // per refresh through the Kubernetes Service proxy, holds no credential in the
    // browser, embeds no iframe, never addresses the Gatus ClusterIP directly and
    // exposes no create, update or delete action. Every failure mode of that single
    // read is rendered as an explicit state, because the alternative — a page that
    // shows an empty table when it could not read anything — is indistinguishable from
    // "everything is down", which is the one conclusion this page must never suggest
    // without evidence.


    /** Poll a little faster than the slowest configured interval, and never tighter. */
    const REFRESH_MS = 60000;

    const STATE_COLOUR = {
      [STATE.UP]: 'success',
      [STATE.UNSTABLE]: 'warning',
      [STATE.DOWN]: 'error',
      [STATE.STALE]: 'warning',
      [STATE.PENDING]: 'default',
      [STATE.MISSING]: 'default',
      [STATE.MALFORMED]: 'error',
    };

    /**
     * A single full-width message, used for every page-level state so loading,
     * unavailable, malformed and empty are all visually distinct from a populated
     * table. Keeping one component for them means a new failure mode cannot invent a
     * look that an operator has to learn.
     */
    function Notice({ tone, heading, body }) {
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mb: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true, color: `${tone}.main` }, heading),
        h(Typography, { variant: 'body2' }, body)
      );
    }

    function stateChip(row) {
      return h(
        Chip,
        { key: 'state', label: row.state, size: 'small', color: STATE_COLOUR[row.state] || 'default' }
      );
    }

    function formatDuration(durationMs) {
      if (typeof durationMs !== 'number') {
        return 'n/a';
      }
      return durationMs >= 1000 ? `${(durationMs / 1000).toFixed(2)} s` : `${durationMs} ms`;
    }

    function formatTime(timestamp, nowMs) {
      if (typeof timestamp !== 'number') {
        return 'never';
      }
      const absolute = new Date(timestamp).toISOString();
      if (typeof nowMs !== 'number') {
        return absolute;
      }
      const ageSeconds = Math.max(0, Math.round((nowMs - timestamp) / 1000));
      return `${absolute} (${ageSeconds}s ago)`;
    }

    function aggregatePanel(counts, gatusUiUrl) {
      const parts = [
        h(Chip, { key: 'total', size: 'small', label: `${counts.total} configured`, sx: { mr: 1 } }, null),
      ];
      const ordered = [
        STATE.UP,
        STATE.UNSTABLE,
        STATE.DOWN,
        STATE.STALE,
        STATE.PENDING,
        STATE.MISSING,
        STATE.MALFORMED,
      ];
      for (const state of ordered) {
        if (!counts[state]) {
          continue;
        }
        parts.push(
          h(
            Chip,
            {
              key: state,
              size: 'small',
              label: `${counts[state]} ${state}`,
              color: STATE_COLOUR[state],
              sx: { mr: 1 },
            },
            null
          )
        );
      }
      if (gatusUiUrl) {
        parts.push(
          h(
            Link,
            {
              key: 'ui',
              href: gatusUiUrl,
              target: '_blank',
              rel: 'noreferrer noopener',
              variant: 'body2',
            },
            'Open the protected Gatus dashboard'
          )
        );
      }
      return h(Box, { sx: { display: 'flex', alignItems: 'center', flexWrap: 'wrap', mb: 2 } }, parts);
    }

    /**
     * Rows are emitted as a flat child list rather than through a wrapper component,
     * so the element tree stays exactly the TableHead/TableBody structure Headlamp's
     * own components expect and no custom element is introduced.
     */
    function dataTable(groups, nowMs) {
      const children = [];
      for (const group of groups) {
        children.push(
          h(
            TableRow,
            { key: `g:${group.name}` },
            h(TableCell, { colSpan: 6, variant: 'head' }, group.name)
          )
        );
        for (const row of group.rows) {
          children.push(
            h(
              TableRow,
              { key: `r:${row.id || row.name}`, hover: true },
              h(TableCell, null, row.name),
              h(TableCell, null, row.group || 'Ungrouped'),
              h(TableCell, null, stateChip(row)),
              h(TableCell, null, formatTime(row.evaluatedAt, nowMs)),
              h(TableCell, null, formatDuration(row.durationMs)),
              h(TableCell, null, row.detail)
            )
          );
        }
      }

      return h(
        TableContainer,
        { component: Paper, variant: 'outlined' },
        h(
          Table,
          { size: 'small' },
          h(
            TableHead,
            null,
            h(
              TableRow,
              null,
              h(TableCell, null, 'Endpoint'),
              h(TableCell, null, 'Group'),
              h(TableCell, null, 'Status'),
              h(TableCell, null, 'Last evaluation'),
              h(TableCell, null, 'Response'),
              h(TableCell, null, 'Detail')
            )
          ),
          h(TableBody, null, children)
        )
      );
    }

    function unavailabilityNotice(state) {
      if (state.reason === 'forbidden') {
        return Notice({
          tone: 'error',
          heading: 'Service Status is not permitted',
          body:
            'The Headlamp ServiceAccount may not read the Gatus Service proxy. This is expected ' +
            'only when the gatus headlamp integration is disabled, or when the namespaced proxy ' +
            'grant is missing. No other Headlamp page is affected.',
        });
      }
      if (state.reason === 'malformed') {
        return Notice({
          tone: 'error',
          heading: 'Gatus returned a response this page cannot read',
          body:
            'The status document was not the expected list of endpoint status entries. Gatus is ' +
            'reachable but its response shape is not what this page understands, so nothing is ' +
            'shown rather than something misleading.',
        });
      }
      if (state.reason === 'network') {
        return Notice({
          tone: 'error',
          heading: 'Could not reach Gatus',
          body:
            'The request for Gatus status failed before a response was received. Check that the ' +
            'Gatus pod is Ready and that the Headlamp ServiceAccount can reach the named Service ' +
            'proxy. No other Headlamp page is affected.',
        });
      }
      if (state.reason === 'fetch-unavailable') {
        return Notice({
          tone: 'error',
          heading: 'This console build cannot issue the status request',
          body: 'The browser did not provide a fetch implementation, so no status could be read.',
        });
      }
      return Notice({
        tone: 'error',
        heading: `Gatus did not answer (HTTP ${state.status || 'unknown'})`,
        body:
          'The status request reached the API server but not the Gatus backend. Check the Gatus ' +
          'Service endpoints and the container logs. No other Headlamp page is affected.',
      });
    }

    function emptyNotice(endpointsConfigured) {
      return Notice({
        tone: 'warning',
        heading: 'No endpoints are configured',
        body: endpointsConfigured
          ? 'Gatus is running but reports no endpoints. Add endpoints to the installation ' +
            'configuration and apply; this is an empty result set, not a failure to read.'
          : 'Gatus reported no endpoint statuses and none are configured in the installation.',
      });
    }

    function ServiceStatusPage() {
      const metadata = useMemo(() => readEndpointMetadata(), []);
      // The endpoint editor is reached from this page rather than from a second sidebar item.
      // It is a Service Status plugin page, not a control inside Headlamp's own plugin-details
      // screen, which 0.43.0 gives plugins no way to extend.
      //
      // The href is cluster-scoped. A plugin route is registered cluster-relative and rendered
      // by the console at `/c/<active-cluster><route>`, so the unprefixed route is not a usable
      // href: it leaves the cluster layout and renders the console 404. An empty result means no
      // active cluster could be resolved, and is reported rather than linked.
      const editorHref = useMemo(() => clusterScopedEditorHref(), []);
      const [state, setState] = useState({
        loading: true,
        reason: '',
        status: 0,
        payload: null,
        nowMs: Date.now(),
      });
      const [tick, setTick] = useState(0);

      const load = useCallback(async () => {
        const result = await fetchStatuses();
        setState({
          loading: false,
          reason: result.reason,
          status: result.status,
          payload: result.payload,
          nowMs: Date.now(),
        });
      }, []);

      useEffect(() => {
        load();
        const timer = setInterval(load, REFRESH_MS);
        return () => clearInterval(timer);
      }, [load, tick]);

      // `tick` lets an operator force a re-read without waiting a minute. It is the
      // only interaction on the page and it changes nothing but when the read happens.
      const refresh = useCallback(() => setTick(value => value + 1), []);

      if (state.loading) {
        return Notice({
          tone: 'info',
          heading: 'Loading service status',
          body: 'Reading the current status of every configured endpoint from Gatus.',
        });
      }

      if (!state.payload) {
        return unavailabilityNotice(state);
      }

      if (metadata.degraded) {
        return Notice({
          tone: 'error',
          heading: 'Endpoint metadata is missing',
          body:
            'The installer did not render the endpoint list next to this plugin, so results cannot ' +
            'be matched to endpoints or aged correctly. Re-apply the installation to restore it; ' +
            'no status is shown rather than an unlabelled list.',
        });
      }

      if (state.payload.length === 0) {
        return emptyNotice(metadata.endpoints.length > 0);
      }

      const built = buildRows(metadata.endpoints, state.payload, state.nowMs);
      const counts = aggregate(built.rows);

      if (counts.total === 0) {
        return emptyNotice(false);
      }

      return h(
        Box,
        null,
        aggregatePanel(counts, metadata.gatusUiUrl),
        built.partial
          ? Notice({
              tone: 'warning',
              heading: 'Partial response',
              body:
                'Gatus reported fewer endpoints than the installation configures. The missing ones ' +
                'are shown as MISSING rather than omitted, so a short read cannot be mistaken for ' +
                'full coverage.',
            })
          : null,
        dataTable(groupRows(built.rows), state.nowMs),
        h(
          Typography,
          { variant: 'caption', sx: { display: 'block', mt: 1 } },
          `Read every ${Math.round(REFRESH_MS / 1000)}s through ${PLUGIN_PROXY_PATH}. Gatus is the ` +
            'authoritative current-status source; this page only reads it. A Gatus instance inside ' +
            'the cluster cannot detect a total cluster outage.'
        ),
        h(Link, { component: 'button', variant: 'body2', onClick: refresh, sx: { mt: 1 } }, 'Refresh now'),
        h(
          Box,
          { sx: { mt: 2 } },
          editorHref
            ? h(
                Link,
                { href: editorHref, variant: 'body2' },
                'Open the endpoint fragment editor (a Service Status page; changes are not applied)'
              )
            : Notice({
                tone: 'warning',
                heading: 'Endpoint editor unavailable',
                body:
                  'This console did not report an active cluster, so the endpoint editor has no ' +
                  'address on this page. Select a cluster in the console and reload; the editor is ' +
                  'deliberately not linked without one, because the unprefixed route renders the ' +
                  'console 404 page.',
              })
        )
      );
    }

    registerSidebarEntry({
      parent: null,
      name: 'service-status',
      label: 'Service Status',
      url: PLUGIN_PATH,
      icon: 'mdi:heart-pulse',
    });

    registerRoute({
      path: PLUGIN_PATH,
      sidebar: 'service-status',
      name: 'service-status',
      exact: true,
      keepMounted: true,
      component: ServiceStatusPage,
    });

    // The endpoint editor is an ordinary plugin route in a plugin-owned namespace, reached from
    // the dashboard link above, and it is a Service Status page rather than a control inside
    // Headlamp's native plugin-details screen. Headlamp 0.43.0 exposes no plugin API for adding
    // a row to Settings -> Plugins or anything to that details page, so that remains an unmet
    // criterion needing a newer extension API or a separate upstream change. The route is
    // registered cluster-relative: the console owns the `/c/<cluster>` prefix and this plugin
    // registers no cluster name. Registering a sidebar entry would change the navigation
    // TASK-207 established, so the dashboard keeps the single entry.
    registerEditorRoute({
      path: PLUGIN_EDITOR_PATH,
      sidebar: null,
      name: 'service-status-endpoints',
      exact: true,
      keepMounted: false,
      component: EndpointEditorPage,
    });

    })();
  package.json: |-
    {
      "name": "@sre-platform/headlamp-service-status",
      "version": "0.1.7",
      "description": "Read-only Gatus availability view and endpoint fragment editor for the Headlamp operator console",
      "private": true,
      "license": "Apache-2.0",
      "main": "src/view.js",
      "type": "module",
      "scripts": {
        "build": "node build.mjs",
        "test": "node --test test/status.test.mjs test/payload.test.mjs test/editor.test.mjs"
      },
      "devDependencies": {
        "@kinvolk/headlamp-plugin": "0.13.1"
      }
    }
