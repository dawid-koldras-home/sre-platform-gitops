apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ui
  namespace: headlamp
  labels:
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
    sre.platform.io/component: headlamp
  annotations:
    sre-platform.io/ingress-type: headlamp-ui
    cert-manager.io/cluster-issuer: sre-tools-letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-method: GET
    nginx.ingress.kubernetes.io/auth-url: http://authelia.authelia.svc.cluster.local/api/authz/auth-request
    nginx.ingress.kubernetes.io/auth-signin: https://auth.139.162.145.158.nip.io?rm=$request_method
    nginx.ingress.kubernetes.io/auth-response-headers: Remote-User,Remote-Groups,Remote-Email,Remote-Id-Token
spec:

  ingressClassName: nginx
  tls:
    - hosts:
        - headlamp.139.162.145.158.nip.io
      secretName: headlamp-tls
  rules:
    - host: headlamp.139.162.145.158.nip.io
      http:
        paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: headlamp
                 port:
                   number: 80
