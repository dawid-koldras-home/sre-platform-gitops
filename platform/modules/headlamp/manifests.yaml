     * raw `/access-control` leaves the cluster layout and renders the console 404.
     * The cluster name is URL-encoded because it is operator-chosen. With no
     * resolvable cluster the result is the empty string, which callers must treat
     * as "render no link" rather than falling back to a route that cannot work.
