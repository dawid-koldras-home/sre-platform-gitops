  main.js: |
    globalThis.__SRE_GATUS_SERVICE_STATUS__={"endpoints":[{"id":"argocd-server","name":"Argo CD","group":"Platform","intervalMs":60000,"timeoutMs":10000,"failureThreshold":2,"recoveryThreshold":2},{"id":"authelia","name":"Authelia","group":"Identity","intervalMs":60000,"timeoutMs":10000,"failureThreshold":2,"recoveryThreshold":2},{"id":"headlamp-backend","name":"Headlamp backend health","group":"Platform","intervalMs":60000,"timeoutMs":10000,"failureThreshold":2,"recoveryThreshold":2},{"id":"headlamp-route","name":"Headlamp public route","group":"Platform","intervalMs":60000,"timeoutMs":10000,"failureThreshold":2,"recoveryThreshold":2},{"id":"openbao-api","name":"OpenBao API","group":"Secrets","intervalMs":60000,"timeoutMs":10000,"failureThreshold":2,"recoveryThreshold":2},{"id":"policy-reporter-ui","name":"Policy Reporter UI","group":"Security","intervalMs":60000,"timeoutMs":10000,"failureThreshold":2,"recoveryThreshold":2}]};
    // headlamp-service-status — first-party Headlamp plugin, built from committed source.
    // Generated by build.mjs. Do not edit: edit src/*.js and rebuild.
    // Entry: view.js. Build inputs are hashed in ../../../plugins.lock.yaml.
    (function () {
      'use strict';
      // ---- src/status.js ----
    // Status derivation for the Headlamp Service Status page.
    //
    // This module is deliberately free of React, of the Headlamp registry and of any
    // network call, because it is the part of the plugin that decides what an
    // operator is told. Gatus is the authoritative current-status source; everything
    // here is a read of what Gatus already reported, never a second opinion about
    // whether a service is healthy.
    //
    // Two properties are load-bearing and are proved by test/service-status.test.mjs:
    //
    //   1. Results are ordered by their own timestamp rather than by their position in
    //      the array. Gatus appends results as evaluations complete, so array order
    //      usually agrees with recency, but a reordered or partially delivered
    //      payload must not be able to invert the status. Sorting defensively means a
    //      status can only be wrong because a timestamp is wrong.
    //   2. A single evaluation never flips the dashboard. A timeout on one poll would
    //      otherwise show DOWN and then UP on the next, which is exactly the noise an
    //      availability dashboard exists to remove.
    //
    // The plugin is a view. It renders thresholds, it does not enforce them: Gatus
    // decides whether an evaluation succeeded, and this module decides only how stable
    // a run of evaluations has to be before the page claims the other state.

    /** The four states the task requires, plus the transition window between them. */
    const STATE = {
      UP: 'UP',
      DOWN: 'DOWN',
      PENDING: 'PENDING',
      STALE: 'STALE',
      /** One evaluation away from the threshold; deliberately not collapsed into UP. */
      UNSTABLE: 'UNSTABLE',
      /** A configured endpoint the payload did not describe at all. */
      MISSING: 'MISSING',
      /** A payload entry that is not a usable Gatus status tuple. */
      MALFORMED: 'MALFORMED',
    };

    const STATE_ORDER = [
      STATE.UP,
      STATE.UNSTABLE,
      STATE.DOWN,
      STATE.STALE,
      STATE.PENDING,
      STATE.MISSING,
      STATE.MALFORMED,
    ];

    /**
     * Platform defaults. The resolver injects the per-installation values next to the
     * payload; these are what the page falls back to, and they match the module's
     * documented default interval and timeout.
     */
    const DEFAULT_INTERVAL_MS = 60000;
    const DEFAULT_TIMEOUT_MS = 10000;

    /** Two consecutive evaluations, for both directions, per the task contract. */
    const DEFAULT_FAILURE_THRESHOLD = 2;
    const DEFAULT_RECOVERY_THRESHOLD = 2;

    /**
     * A newest result older than twice the interval plus the timeout is stale. One
     * missed poll is normal jitter; a result that old means the evaluator is no longer
     * reporting, and reporting UP from it would be a false claim.
     */
    function staleAfterMs(intervalMs, timeoutMs) {
      return 2 * intervalMs + timeoutMs;
    }

    function toMillis(value) {
      const parsed = Date.parse(value);
      return Number.isNaN(parsed) ? null : parsed;
    }

    function asPositiveInt(value, fallback) {
      const parsed = typeof value === 'number' ? value : Number.parseInt(value, 10);
      return Number.isFinite(parsed) && parsed > 0 ? Math.floor(parsed) : fallback;
    }

    /**
     * Normalise one configured endpoint. Anything unusable falls back to the platform
     * default rather than throwing, so one bad metadata entry degrades a single row
     * instead of the page.
     */
    function normaliseEndpointSpec(spec) {
      const intervalMs = asPositiveInt(spec && spec.intervalMs, DEFAULT_INTERVAL_MS);
      const timeoutMs = asPositiveInt(spec && spec.timeoutMs, DEFAULT_TIMEOUT_MS);
      return {
        id: String((spec && spec.id) || ''),
        name: String((spec && spec.name) || ''),
        group: String((spec && spec.group) || ''),
        intervalMs,
        timeoutMs,
        failureThreshold: asPositiveInt(
          spec && spec.failureThreshold,
          DEFAULT_FAILURE_THRESHOLD
        ),
        recoveryThreshold: asPositiveInt(
          spec && spec.recoveryThreshold,
          DEFAULT_RECOVERY_THRESHOLD
        ),
      };
    }

    function isRecord(value) {
      return typeof value === 'object' && value !== null && !Array.isArray(value);
    }

    /**
     * Extract the usable evaluations from a Gatus result list, newest first.
     *
     * A result is usable when it carries a parseable timestamp, an explicit boolean
     * `success` and a non-negative duration. Gatus can emit partial result objects
     * while an evaluation is still in flight; those are skipped rather than guessed
     * at, so a half-written result can never read as a failure.
     */
    function parseResults(rawResults) {
      if (!Array.isArray(rawResults)) {
        return null;
      }
      const results = [];
      let rejected = 0;
      for (const entry of rawResults) {
        if (!isRecord(entry)) {
          rejected += 1;
          continue;
        }
        const timestamp = toMillis(entry.timestamp);
        if (timestamp === null || typeof entry.success !== 'boolean') {
          rejected += 1;
          continue;
        }
        const duration =
          typeof entry.duration === 'number' && entry.duration >= 0
            ? entry.duration
            : null;
        results.push({ timestamp, success: entry.success, duration, errors: entry.errors });
      }
      results.sort((a, b) => b.timestamp - a.timestamp);
      return { results, rejected };
    }

    /** Count consecutive evaluations of one outcome from the newest backwards. */
    function consecutive(results, success) {
      let count = 0;
      for (const result of results) {
        if (result.success !== success) {
          break;
        }
        count += 1;
      }
      return count;
    }

    /**
     * Decide the displayed state for one endpoint from its normalised results.
     *
     * The order of the checks is the contract. Emptiness wins over staleness, because
     * an endpoint that has never reported is PENDING rather than stale; staleness is
     * checked before the run of evaluations, because a run of successes that ended
     * long ago is not evidence that the service is up now; and the threshold run is
     * checked before any single result so that one poll cannot decide the state.
     */
    function deriveState(results, spec, nowMs) {
      if (!results || results.length === 0) {
        return { state: STATE.PENDING, result: null, failureRun: 0, successRun: 0, ageMs: null };
      }

      const newest = results[0];
      const ageMs = nowMs - newest.timestamp;

      if (ageMs > staleAfterMs(spec.intervalMs, spec.timeoutMs)) {
        return {
          state: STATE.STALE,
          result: newest,
          failureRun: consecutive(results, false),
          successRun: consecutive(results, true),
          ageMs,
        };
      }

      const failureRun = consecutive(results, false);
      const successRun = consecutive(results, true);

      if (failureRun >= spec.failureThreshold) {
        return { state: STATE.DOWN, result: newest, failureRun, successRun, ageMs };
      }
      if (successRun >= spec.recoveryThreshold) {
        return { state: STATE.UP, result: newest, failureRun, successRun, ageMs };
      }
      return { state: STATE.UNSTABLE, result: newest, failureRun, successRun, ageMs };
    }

    /**
     * One line of operator-readable detail. Error text is taken from Gatus verbatim
     * because it names the failing condition, but the target URL is never included:
     * a URL can carry customer data and the page has no need to repeat it.
     */
    function describe(result, spec) {
      if (!result) {
        return 'No evaluation has completed yet.';
      }
      if (result.success) {
        return 'Last evaluation passed.';
      }
      const errors = Array.isArray(result.errors) ? result.errors : [];
      const messages = [];
      for (const error of errors) {
        if (typeof error === 'string' && error) {
          messages.push(error);
        } else if (isRecord(error) && typeof error.message === 'string' && error.message) {
          messages.push(error.message);
        }
      }
      if (messages.length === 0) {
        return `Last evaluation failed. Needs ${spec.failureThreshold} consecutive failures to report DOWN.`;
      }
      return messages.join('; ');
    }

    /**
     * Build a collision-safe join key from the two display fields shared by the
     * installer metadata and the Gatus status API.
     *
     * The API's `key` is not the installer endpoint ID. Gatus derives it from the
     * group and name (for example `platform_argo-cd`), while the customer config may
     * use an independent stable ID. Joining those unrelated
     * values made every live endpoint appear MISSING.
     */
    function endpointJoinKey(group, name) {
      return JSON.stringify([String(group || ''), String(name || '')]);
    }

    /**
     * Index a Gatus status payload by its exact group and display name.
     *
     * Gatus v5.34 answers `/api/v1/endpoints/statuses` with objects shaped as
     * `{key, name, group, results}`. `key` is still validated and required to be
     * unique, but it cannot be used as the join field because Gatus derives it rather
     * than preserving the installer ID. The resolver already rejects duplicate
     * endpoint names, and the exact group+name pair is present on both sides. Only
     * parsed results are retained.
     */
    function indexPayload(payload) {
      if (!Array.isArray(payload)) {
        return { byEndpoint: new Map(), malformedEntries: 0, totalEntries: 0 };
      }
      const byEndpoint = new Map();
      const backendKeys = new Map();
      let malformedEntries = 0;
      let totalEntries = 0;

      for (const entry of payload) {
        totalEntries += 1;
        if (
          !isRecord(entry) ||
          typeof entry.key !== 'string' ||
          !entry.key ||
          typeof entry.name !== 'string' ||
          !entry.name ||
          typeof entry.group !== 'string'
        ) {
          malformedEntries += 1;
          continue;
        }
        const joinKey = endpointJoinKey(entry.group, entry.name);
        const previousJoinKey = backendKeys.get(entry.key);
        if (!Array.isArray(entry.results) || previousJoinKey || byEndpoint.has(joinKey)) {
          malformedEntries += 1;
          if (previousJoinKey) {
            byEndpoint.set(previousJoinKey, { malformed: true });
          }
          byEndpoint.set(joinKey, { malformed: true });
          continue;
        }
        backendKeys.set(entry.key, joinKey);
        byEndpoint.set(joinKey, {
          malformed: false,
          ...parseResults(entry.results),
        });
      }

      return { byEndpoint, malformedEntries, totalEntries };
    }

    /**
     * Build every row the page renders, in the order the customer configured them.
     *
     * Iterating the configured list rather than the payload is what makes the page
     * deterministic: a payload cannot reorder the dashboard, drop a configured
     * endpoint silently, or add an endpoint the customer did not declare.
     */
    function buildRows(specs, payload, nowMs) {
      const normalised = specs.map(normaliseEndpointSpec);
      const { byEndpoint, malformedEntries, totalEntries } = indexPayload(payload);

      const rows = normalised.map(spec => {
        const found = byEndpoint.get(endpointJoinKey(spec.group, spec.name));

        if (!found) {
          return {
            id: spec.id,
            name: spec.name,
            group: spec.group,
            state: STATE.MISSING,
            detail: 'Gatus did not report this endpoint in the current response.',
            durationMs: null,
            evaluatedAt: null,
            ageMs: null,
            failureThreshold: spec.failureThreshold,
            recoveryThreshold: spec.recoveryThreshold,
          };
        }

        if (found.malformed) {
          return {
            id: spec.id,
            name: spec.name,
            group: spec.group,
            state: STATE.MALFORMED,
            detail: 'Gatus returned a status entry this page cannot read.',
            durationMs: null,
            evaluatedAt: null,
            ageMs: null,
            failureThreshold: spec.failureThreshold,
            recoveryThreshold: spec.recoveryThreshold,
          };
        }

        const derived = deriveState(found.results, spec, nowMs);
        return {
          id: spec.id,
          name: spec.name,
          group: spec.group,
          state: derived.state,
          detail: describe(derived.result, spec),
          durationMs: derived.result ? derived.result.duration : null,
          evaluatedAt: derived.result ? derived.result.timestamp : null,
          ageMs: derived.ageMs,
          failureThreshold: spec.failureThreshold,
          recoveryThreshold: spec.recoveryThreshold,
        };
      });

      return {
        rows,
        malformedEntries,
        totalEntries,
        // A payload is partial when it described fewer endpoints than were configured.
        // The page says so instead of presenting a short list as if it were complete.
        partial: rows.some(row => row.state === STATE.MISSING),
      };
    }

    /**
     * Aggregate counts, computed here because Gatus has no aggregate-status API.
     *
     * The counts are over every row, so a dashboard cannot read "3 up" while two
     * configured endpoints are missing from the payload.
     */
    function aggregate(rows) {
      const counts = {};
      for (const state of STATE_ORDER) {
        counts[state] = 0;
      }
      for (const row of rows) {
        counts[row.state] = (counts[row.state] || 0) + 1;
      }
      counts.total = rows.length;
      return counts;
    }

    /** Group rows for display, preserving configured order inside each group. */
    function groupRows(rows) {
      const groups = new Map();
      for (const row of rows) {
        const key = row.group || 'Ungrouped';
        if (!groups.has(key)) {
          groups.set(key, []);
        }
        groups.get(key).push(row);
      }
      return Array.from(groups.entries()).map(([name, entries]) => ({ name, rows: entries }));
    }

      // ---- src/contract.js ----
    // Authoritative validation contract for the endpoint editor.
    //
    // The installer is the single place where Gatus endpoint policy is expressed. The
    // resolver validates `spec.modules.gatus.endpoints` against constants in
    // internal/resolver/gatus.go, and this file must not become a second, looser copy of
    // them: a browser that accepted a wider set than the resolver would let an operator
    // build a draft that is refused only after review, which hides the real bound until the
    // worst possible moment.
    //
    // So the bounds below are transcribed from those constants and
    // TestGatusEndpointEditorContractMatchesResolverBounds parses this file and fails the Go
    // build if any value drifts. That test is the contract: a bound changed here and not
    // there breaks the build rather than shipping a looser editor.
    //
    // ## Why the contract is a source file and not part of the delivered metadata
    //
    // The obvious design is for the resolver to inject these numbers into the plugin payload
    // the way it already injects the endpoint list. That was implemented and reverted, because
    // TASK-207's isolation gates forbid the in-cluster DNS suffix and the default secure port
    // in the *runtime status metadata* the browser reads, and injecting validation bounds
    // through the same channel would have widened that metadata from display and timing
    // fields into installer policy.
    //
    // Those gates are correct, and so is the narrower place to enforce them. Cluster topology
    // has no business in a status console, but it has every business being named in this file:
    // an editor has to describe and validate these fields to be useful. The two concerns are
    // separated rather than one being sacrificed to the other — the metadata assignment stays
    // minimal, and the validation contract ships as reviewed first-party source.
    //
    // ## Why the advanced fields are supported rather than refused
    //
    // allowClusterInternal, allowInsecureHttp and ignoreRedirects were refused in 0.1.5 on the
    // grounds that they are transport and topology decisions. That reasoning was sound about
    // where the decision belongs and wrong about whether the page may carry it: the reviewed
    // live customer configuration contains all three, so refusing them made the editor
    // incompatible with the configuration it exists to edit. An operator pasting the real
    // fragment got a wall of refusals, and the page could not claim complete-fragment import,
    // Edit/Remove, or a deterministic replacement fragment while it did that.
    //
    // They are now supported with the resolver's exact semantics, which is the only version of
    // "supported" that does not create a second policy:
    //   - values must be real YAML booleans, so a quoted 'true', a numeric 1, and a bare yes
    //     are all refused exactly as the resolver refuses them;
    //   - a cleartext http target requires allowInsecureHttp;
    //   - an in-cluster target requires allowClusterInternal, and only the exact
    //     <service>.<namespace>.svc.cluster.local form is accepted, with the same DNS-label
    //     rules and the same refusal of the kubernetes Service;
    //   - allowClusterInternal on a public name is refused, so the flag cannot be used as a
    //     blanket "relax validation" switch.
    //
    // What has not changed is the privacy boundary and the absence of a write path. These
    // fields are still never inferred from status metadata, still never inferred from a
    // hostname the console does not hold, and the exported fragment is still unapplied.

    // Transcribed from internal/resolver/gatus.go. Do not edit without editing it there too.
    const CONTRACT = {
      maxEndpoints: 50,

      interval: { defaultMs: 60000, minMs: 30000, maxMs: 300000 },
      timeout: { defaultMs: 10000, minMs: 1000, maxMs: 30000 },

      maxResponseTimeMs: 60000,
      maxCertificateWindowHours: 2160,

      idMaxLength: 63,
      nameMaxLength: 200,
      groupMaxLength: 64,

      defaultStatusCodes: [200],
      maxStatusCodes: 10,
      maxPort: 65535,

      // The port each scheme lands on when the target names none. The resolver derives its
      // NetworkPolicy egress the same way, so the plan this editor shows an operator is the
      // policy the installer will render rather than an approximation of it.
      schemeDefaultPorts: { 'https:': 443, 'http:': 80 },

      // gatusClusterLocalSuffix and gatusClusterLocalLabel, transcribed from gatus.go. An
      // in-cluster target is named by an exact form rather than a suffix test, because a
      // suffix test alone would accept a name that resolves off-cluster.
      clusterLocalSuffix: '.svc.cluster.local',
      clusterLocalLabel: 'cluster.local',

      // gatusForbiddenInternalServices, transcribed from gatus.go. Reaching the Kubernetes API
      // server is not an availability signal for a platform component, so it is never a target
      // even with allowClusterInternal set.
      forbiddenInternalServices: ['kubernetes'],

      // The one group an endpoint with no group is reported under, and therefore the value
      // the status join compares against.
      defaultGroup: 'Ungrouped',

      // Every field the editor may write, in the resolver's own accepted-field order. A key
      // outside this set is refused, which is what keeps a typo from silently dropping a
      // default that matters.
      writableFields: [
        'id',
        'name',
        'group',
        'url',
        'allowInsecureHttp',
        'allowClusterInternal',
        'interval',
        'timeout',
        'expectedStatusCodes',
        'maxResponseTimeMs',
        'certificateExpiry',
        'ignoreRedirects',
      ],

      // The optional boolean fields. Each is written only when the operator set it explicitly,
      // so an explicit `false` survives a round trip and an absent field stays absent rather
      // than becoming a rendered `false` that looks like a decision nobody made.
      booleanFields: ['allowInsecureHttp', 'allowClusterInternal', 'ignoreRedirects'],

      // Fields that must be present and non-empty.
      requiredFields: ['id', 'name', 'url'],

      durationUnits: ['s', 'm', 'h'],
      hoursUnits: ['h', 'd'],
    };

    // The optional fields whose absence is itself part of the configuration.
    //
    // Every field here has a resolver default, so writing one that the operator never chose is
    // semantically free but not review-free: the exported fragment is a replacement for the
    // customer's canonical file, and a no-op round trip that adds `interval: 1m` to an endpoint
    // that omitted it produces a Git diff with no operator change behind it. An operator who
    // exports and applies a fragment they did not intend to change has been handed a change they
    // did not review, which is the specific failure the reviewed workflow exists to prevent.
