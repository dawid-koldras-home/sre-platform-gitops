          ? h(Typography, { variant: 'body2', color: 'error.main' }, `Removes: ${preview.removedRoles.join(', ')}`)
          : null,
        preview.warnings.map((warning, index) =>
          h(Typography, { key: `warn-${index}`, variant: 'body2', color: 'warning.main' }, warning)
        ),
        h(
          Typography,
          { variant: 'caption', sx: { display: 'block', mt: 1 } },
          preview.requiresApproval
            ? 'Every submission is committed through a reviewed Git transaction and requires approval before it can take effect.'
            : ''
        )
      );
    }

    function StatusPanel({ status, error }) {
      if (!status && !error) {
        return null;
      }
      if (error) {
        return h(
          Alert,
          { severity: error.reason === 'unauthorized' ? 'error' : 'warning', sx: { mt: 2 } },
          `Change request status is not available: ${error.message || error.reason || 'the read failed'}.`
        );
      }
      return h(
        Box,
        { sx: { mt: 2 } },
        h(Chip, { size: 'small', color: status.tone === 'success' ? 'success' : status.tone === 'error' ? 'error' : 'default', label: status.label }),
        h(Typography, { variant: 'body2', sx: { mt: 1 } }, `Request ${status.id} \u2014 ${status.operation} ${status.policyName}`),
        status.message ? h(Typography, { variant: 'body2' }, status.message) : null,
        status.commit ? h(Typography, { variant: 'caption' }, `Commit ${status.commit}`) : null,
        status.terminal ? null : h(Typography, { variant: 'caption' }, 'Polling for the next state\u2026')
      );
    }

    function EditorSection({ discovery, onChanged }) {
      const [list, setList] = useState({ loading: true, ok: false, entries: [], reason: '', message: '' });
      const [mode, setMode] = useState('idle');
      const [operation, setOperation] = useState('create');
      const [form, setForm] = useState(emptyEntry());
      const [original, setOriginal] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirming, setConfirming] = useState(false);
      const [submitError, setSubmitError] = useState('');
      const [status, setStatus] = useState(null);
      const [statusError, setStatusError] = useState(null);
      const pollerRef = useRef(null);

      const revision = discovery && discovery.revision ? String(discovery.revision) : '';

      const loadList = useCallback(async () => {
        setList(previous => ({ ...previous, loading: true }));
        const result = await fetchEditorPolicies();
        if (!result.ok) {
          setList({ loading: false, ok: false, entries: [], reason: result.reason, message: result.message || '' });
          return;
        }
        const entries = result.payload && Array.isArray(result.payload.policies) ? result.payload.policies : [];
        setList({ loading: false, ok: true, entries, reason: '', message: '' });
      }, []);

      useEffect(() => {
        loadList();
      }, [loadList]);

      useEffect(() => () => {
        if (pollerRef.current) {
          pollerRef.current.stop();
          pollerRef.current = null;
        }
      }, []);

      const errors = useMemo(() => validateEntry(form, null).errors, [form]);
      const preview = useMemo(() => {
        try {
          return impactPreview(operation, form, original);
        } catch (error) {
          return null;
        }
      }, [operation, form, original]);

      const startCreate = () => {
        setOperation('create');
        setForm(emptyEntry());
        setOriginal(null);
        setSubmitError('');
        setStatus(null);
        setStatusError(null);
        setMode('edit');
      };

      const startEdit = async name => {
        setBusy(true);
        setSubmitError('');
        const result = await fetchEditorPolicy(name);
        setBusy(false);
        if (!result.ok) {
          setSubmitError(result.message || 'The entry could not be read.');
          return;
        }
        const entry = result.payload && result.payload.policy ? result.payload.policy : null;
        setOperation('update');
        setOriginal(entry);
        setForm(entryToForm(entry));
        setStatus(null);
        setStatusError(null);
        setMode('edit');
      };

      const startDelete = entry => {
        setOperation('delete');
        setOriginal(entry);
        setForm(entryToForm(entry));
        setSubmitError('');
        setStatus(null);
        setStatusError(null);
        setConfirming(true);
      };

      const cancel = () => {
        setMode('idle');
        setConfirming(false);
        setSubmitError('');
      };

      const submit = async () => {
        setConfirming(false);
        setBusy(true);
        setSubmitError('');
        setStatus(null);
        setStatusError(null);
        const policy = operation === 'delete' ? null : canonicalEntry(form);
        const name = form.name;
        const result = await submitChange(operation, policy, name);
        setBusy(false);
        if (!result.ok) {
          setSubmitError(result.message || `The API refused the change request (${result.reason}).`);
          return;
        }
        const request = result.payload && result.payload.request ? result.payload.request : null;
        const initial = describeRequest(request);
        setStatus(initial);
        setMode('idle');
        if (pollerRef.current) {
          pollerRef.current.stop();
        }
        if (initial.id) {
          const poller = createStatusPoller({
            requestId: initial.id,
            fetchStatus: fetchRequestStatus,
            onUpdate: update => {
              setStatus(update.change);
              setStatusError(update.error && update.change ? null : update.error);
            },
            onDone: update => {
              if (update.change) {
                setStatus(update.change);
              }
              if (update.error && !update.change) {
                setStatusError(update.error);
              }
              if (update.change && update.change.terminal) {
                loadList();
                if (typeof onChanged === 'function') {
                  onChanged();
                }
              }
            }
          });
          pollerRef.current = poller;
          poller.start();
        }
      };

      const entryRows = list.entries.map(entry =>
        h(
          TableRow,
          { key: `entry-${entry.name}`, hover: true },
          h(TableCell, null, entry.name),
          h(TableCell, null, (entry.subjects || []).map(subjectText).join(', ')),
          h(TableCell, null, entry.role),
          h(TableCell, null, entry.scope && entry.scope.clusterWide ? 'cluster-wide' : (entry.scope && entry.scope.namespaces || []).join(', ')),
          h(
            TableCell,
            null,
            h(
              Box,
              { sx: { display: 'flex', gap: 1 } },
              h(Button, { size: 'small', onClick: () => startEdit(entry.name) }, 'Edit'),
              h(Button, { size: 'small', color: 'error', onClick: () => startDelete(entry) }, 'Delete')
            )
          )
        )
      );

      const listBody = list.loading
        ? h(CircularProgress, { size: 20 })
        : list.ok
          ? entryRows.length > 0
            ? h(
                TableContainer,
                { component: Paper, variant: 'outlined' },
                h(
                  Table,
                  { size: 'small' },
                  h(
                    TableHead,
                    null,
                    h(
                      TableRow,
                      null,
                      h(TableCell, null, 'Name'),
                      h(TableCell, null, 'Subjects'),
                      h(TableCell, null, 'Role'),
                      h(TableCell, null, 'Scope'),
                      h(TableCell, null, 'Actions')
                    )
                  ),
                  h(TableBody, null, entryRows)
                )
              )
            : h(Typography, { variant: 'body2' }, 'This installation has no AccessPolicy entries.')
          : h(Alert, { severity: 'warning' }, `The entries could not be read: ${list.message || list.reason}.`);

      return h(
        Box,
        { key: 'editor' },
        h(Typography, { variant: 'h5', sx: { mt: 3, mb: 1 } }, 'AccessPolicy editor'),
        h(
          Typography,
          { variant: 'body2', sx: { mb: 1 } },
          'Create, change and remove AccessPolicy entries through the reviewed Git transaction of ' +
            'the access-change API. Every submission requires approval before it takes effect; this ' +
            'page does not commit anything itself.'
        ),
        mode === 'idle'
          ? h(
              Box,
              null,
              h(
                Box,
                { sx: { display: 'flex', gap: 2, alignItems: 'center', mb: 2 } },
                h(Button, { variant: 'contained', onClick: startCreate }, 'New policy'),
                h(Button, { color: 'inherit', onClick: loadList }, 'Reload'),
                revision ? h(Chip, { size: 'small', label: `revision ${revision}` }) : null
              ),
              listBody,
              h(StatusPanel, { status, error: statusError }),
              submitError ? h(Alert, { severity: 'error', sx: { mt: 2 } }, submitError) : null
            )
          : h(
              Box,
              null,
              h(EditorForm, {
                operation,
                form,
                setForm,
                errors,
                busy,
                onSubmit: () => setConfirming(true),
                onCancel: cancel
              }),
              h(PreviewPanel, { preview }),
              submitError ? h(Alert, { severity: 'error', sx: { mt: 2 } }, submitError) : null,
              h(
                Dialog,
                { open: confirming, onClose: () => setConfirming(false) },
                h(DialogTitle, null, `Confirm ${operation} of ${form.name || 'the entry'}`),
                h(
                  DialogContent,
                  null,
                  h(
                    DialogContentText,
                    null,
                    'This submits one change request to the access-change API. It is committed through ' +
                      'a reviewed Git transaction and requires approval before it takes effect.'
                  ),
                  h(PreviewPanel, { preview })
                ),
                h(
                  DialogActions,
                  null,
                  h(Button, { onClick: () => setConfirming(false) }, 'Back'),
                  h(Button, { variant: 'contained', color: operation === 'delete' ? 'error' : 'primary', onClick: submit }, 'Submit for approval')
                )
              )
            )
      );
    }

      // ---- src/users.js ----
    // Declarative managed-identity lifecycle for the existing Access control view.
    //
    // This component never writes Git, Kubernetes or OpenBao directly. It uses the
    // four closed access-change-api routes: list, credential provisioning, impact
    // preview and identity request. Password fields are cleared immediately after
    // the provisioning request settles; only the structural credential reference
    // may advance to preview and submit.


    const EMPTY_DRAFT = {
      identityID: '',
      displayLabel: '',
      email: '',
      groups: '',
      password: '',
      confirmation: ''
    };

    function splitGroups(value) {
      return String(value)
        .split(/[\n,]/)
        .map(group => group.trim())
        .filter((group, index, all) => group !== '' && all.indexOf(group) === index)
        .sort();
    }

    // The API and the shared Go validator are authoritative. This is a
    // deliberately conservative pre-check so a missing or obviously malformed
    // mailbox is refused before the credential-provisioning request writes anything:
    // provisioning a password for an identity that cannot register MFA would leave
    // a usable first factor with no second factor, which is the defect TASK-224
    // exists to close.
    const EMAIL_PATTERN = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$/;

    function validEmail(value) {
      const email = String(value || '').trim();
      if (email === '' || email.length > 254) {
        return false;
      }
      if (!EMAIL_PATTERN.test(email) || email.includes('..')) {
        return false;
      }
      const [local, domain] = email.split('@');
      if (local.length > 64 || local.startsWith('.') || local.endsWith('.')) {
        return false;
      }
      return domain
        .split('.')
        .every(label => label !== '' && label.length <= 63 && !label.startsWith('-') && !label.endsWith('-'));
    }

    function errorText(result, fallback) {
      if (result && typeof result.message === 'string' && result.message !== '') {
        return result.message;
      }
      return fallback;
    }

    function stateTone(value) {
      if (value === 'enabled' || value === 'declared' || value === 'verified') {
        return 'success';
      }
      if (value === 'disabled' || value === 'pending' || value === 'not_observed') {
        return 'warning';
      }
      return 'default';
    }

    function PreviewPanel({ preview, request, busy, onSubmit, onCancel }) {
      if (!preview || !request) {
        return null;
      }
      const destructive = preview.reduces_access === true || request.operation === 'remove';
      const facts = [
        `email: ${(preview.after && preview.after.email) || 'none'}`,
        `groups added: ${(preview.groups_added || []).join(', ') || 'none'}`,
        `groups removed: ${(preview.groups_removed || []).join(', ') || 'none'}`,
        `roles gained: ${(preview.roles_gained || []).join(', ') || 'none'}`,
        `roles lost: ${(preview.roles_lost || []).join(', ') || 'none'}`,
        `materialization: ${preview.materialization || 'preview_only'}`,
        `session revocation: ${preview.session_revocation || 'not_required'}`
      ];
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mt: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true }, `Review ${request.operation} for ${request.identity_id}`),
        destructive
          ? h(Alert, { severity: 'warning', sx: { mb: 2 } }, 'This change reduces access. Review it before confirming.')
          : null,
        h(Typography, { variant: 'body2', sx: { whiteSpace: 'pre-line' } }, facts.join('\n')),
        h(
          Box,
          { sx: { display: 'flex', gap: 1, mt: 2 } },
          h(Button, { variant: 'contained', color: destructive ? 'warning' : 'primary', disabled: busy, onClick: onSubmit }, busy ? 'Submitting…' : 'Confirm and submit'),
          h(Button, { disabled: busy, onClick: onCancel }, 'Cancel')
        )
      );
    }

    function IdentityForm({ mode, draft, setDraft, busy, onPreview, onCancel }) {
      if (mode === '') {
        return null;
      }
      const creating = mode === 'create';
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mt: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true }, creating ? 'Add user' : `Edit ${draft.identityID}`),
        h(
          Box,
          { sx: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(220px, 1fr))', gap: 2 } },
          h(TextField, {
            label: 'Identity ID',
            value: draft.identityID,
            disabled: !creating,
            onChange: event => setDraft({ ...draft, identityID: event.target.value })
          }),
          h(TextField, {
            label: 'Display label',
            value: draft.displayLabel,
            onChange: event => setDraft({ ...draft, displayLabel: event.target.value })
          }),
          h(TextField, {
            label: 'Email',
            type: 'email',
            value: draft.email,
            required: creating,
            helperText: creating
              ? 'Required before the credential is provisioned; Authelia cannot register MFA without it.'
              : 'Leave blank to keep the current mailbox.',
            autoComplete: 'off',
            onChange: event => setDraft({ ...draft, email: event.target.value })
          }),
          h(TextField, {
            label: 'Groups',
            value: draft.groups,
            helperText: 'Comma-separated declarative groups.',
            onChange: event => setDraft({ ...draft, groups: event.target.value })
          }),
          creating
            ? h(TextField, {
                label: 'Initial password',
                type: 'password',
                value: draft.password,
                autoComplete: 'new-password',
                onChange: event => setDraft({ ...draft, password: event.target.value })
              })
            : null,
          creating
            ? h(TextField, {
                label: 'Confirm password',
                type: 'password',
                value: draft.confirmation,
                autoComplete: 'new-password',
                onChange: event => setDraft({ ...draft, confirmation: event.target.value })
              })
            : null
        ),
        h(
          Box,
          { sx: { display: 'flex', gap: 1, mt: 2 } },
          h(Button, { variant: 'contained', disabled: busy, onClick: onPreview }, busy ? 'Preparing…' : creating ? 'Provision and preview' : 'Preview update'),
          h(Button, { disabled: busy, onClick: onCancel }, 'Cancel')
        )
      );
    }

    function UsersSection({ canSubmit, onChanged, mfaSelfServiceURL }) {
      const [state, setState] = useState({ loading: true, identities: [], revision: '', error: '' });
      const [mode, setMode] = useState('');
      const [draft, setDraft] = useState({ ...EMPTY_DRAFT });
      const [preview, setPreview] = useState(null);
      const [pendingRequest, setPendingRequest] = useState(null);
      const [busy, setBusy] = useState(false);
      const [notice, setNotice] = useState(null);
      const secretDraft = useRef({ password: '', confirmation: '' });

      useEffect(() => {
        secretDraft.current.password = draft.password;
        secretDraft.current.confirmation = draft.confirmation;
      }, [draft.password, draft.confirmation]);

      useEffect(() => () => {
        secretDraft.current.password = '';
        secretDraft.current.confirmation = '';
      }, []);

      const load = useCallback(async () => {
        setState(previous => ({ ...previous, loading: true, error: '' }));
        const result = await fetchIdentities();
        if (!result.ok) {
          setState({ loading: false, identities: [], revision: '', error: errorText(result, 'The identity list is unavailable.') });
          return;
        }
        const payload = result.payload || {};
        setState({
          loading: false,
          identities: Array.isArray(payload.identities) ? payload.identities : [],
          revision: typeof payload.revision === 'string' ? payload.revision : '',
          error: ''
        });
      }, []);

      useEffect(() => {
        load();
      }, [load]);

      const clearForm = useCallback(() => {
        secretDraft.current.password = '';
        secretDraft.current.confirmation = '';
        setDraft({ ...EMPTY_DRAFT });
        setMode('');
      }, []);

      const showPreview = useCallback(async request => {
        const result = await previewIdentityChange(request);
        if (!result.ok) {
          setNotice({ severity: 'error', text: errorText(result, 'The identity preview failed.') });
          return false;
        }
        setPendingRequest(request);
        setPreview(result.payload);
        return true;
      }, []);

      const previewForm = useCallback(async () => {
        if (!state.revision) {
          setNotice({ severity: 'error', text: 'The identity revision is unavailable. Refresh before editing.' });
          return;
        }
        const identityID = draft.identityID.trim();
        const groups = splitGroups(draft.groups);
        const email = draft.email.trim();
        if (mode === 'create' && !validEmail(email)) {
          setNotice({ severity: 'error', text: 'A valid email address is required before provisioning a credential; Authelia cannot register MFA without one.' });
          return;
        }
        if (mode !== 'create' && email !== '' && !validEmail(email)) {
          setNotice({ severity: 'error', text: 'The email address is not a valid plain mailbox.' });
          return;
        }
        setBusy(true);
        setNotice(null);
        try {
          if (mode === 'create') {
            const password = secretDraft.current.password;
            const confirmation = secretDraft.current.confirmation;
            const credential = await provisionIdentityCredential(identityID, password, confirmation, newIdempotencyKey());
            secretDraft.current.password = '';
            secretDraft.current.confirmation = '';
            setDraft(previous => ({ ...previous, password: '', confirmation: '' }));
            if (!credential.ok) {
              setNotice({ severity: 'error', text: errorText(credential, 'Credential provisioning failed. No identity request was submitted.') });
              return;
            }
            const request = {
              operation: 'create',
              identity_id: identityID,
              display_label: draft.displayLabel.trim(),
              email,
              groups,
              credential_ref: credential.payload.credential_ref,
              expected_revision: state.revision
            };
            if (await showPreview(request)) {
              clearForm();
            } else {
              setPendingRequest(request);
              setNotice({ severity: 'error', text: 'The credential was stored but the identity preview failed. Retry the preview below; do not provision another credential.' });
              clearForm();
            }
          } else {
            const request = {
              operation: 'update',
              identity_id: identityID,
              display_label: draft.displayLabel.trim(),
              groups,
              expected_revision: state.revision
            };
            if (email !== '') {
              request.email = email;
            }
            if (await showPreview(request)) {
              clearForm();
            }
          }
        } finally {
          secretDraft.current.password = '';
          secretDraft.current.confirmation = '';
          setDraft(previous => ({ ...previous, password: '', confirmation: '' }));
          setBusy(false);
        }
      }, [clearForm, draft, mode, showPreview, state.revision]);

      const previewLifecycle = useCallback(async (operation, identity) => {
        setBusy(true);
        setNotice(null);
        try {
          await showPreview({
            operation,
            identity_id: identity.id,
            expected_revision: state.revision
          });
        } finally {
          setBusy(false);
        }
      }, [showPreview, state.revision]);

      const submitPreview = useCallback(async () => {
        if (!pendingRequest) {
          return;
        }
        setBusy(true);
        const result = await submitIdentityChange(pendingRequest, newIdempotencyKey());
        if (!result.ok) {
          setNotice({ severity: 'error', text: errorText(result, 'The identity request failed.') });
          setBusy(false);
          return;
        }
        const record = result.payload && result.payload.request ? result.payload.request : {};
        setNotice({
          severity: 'success',
          text: `Identity request ${record.request_id || ''} is ${record.state || 'submitted'}; reconciliation ${record.reconciliation || 'pending'}; session revocation ${record.session_revocation || 'not_required'}.`
        });
        setPreview(null);
        setPendingRequest(null);
        await load();
        if (typeof onChanged === 'function') {
          onChanged();
        }
        setBusy(false);
      }, [load, onChanged, pendingRequest]);

      const retryPendingPreview = useCallback(async () => {
        if (!pendingRequest) {
          return;
        }
        setBusy(true);
        setNotice(null);
        try {
          await showPreview(pendingRequest);
        } finally {
          setBusy(false);
        }
      }, [pendingRequest, showPreview]);

      const rows = state.identities.map(identity =>
        h(
          TableRow,
          { key: identity.id, hover: true },
          h(TableCell, null, h(Typography, { variant: 'body2' }, identity.display_label || identity.id), h(Typography, { variant: 'caption' }, identity.id)),
          h(TableCell, null, identity.email || 'not set'),
          h(TableCell, null, h(Chip, { size: 'small', label: identity.state, color: stateTone(identity.state) })),
          h(TableCell, null, (identity.groups || []).join(', ') || 'none'),
          h(TableCell, null, (identity.effective_roles || []).join(', ') || 'none'),
          h(TableCell, null, identity.credential_ready ? identity.credential_status : 'not ready'),
          h(TableCell, null, identity.mfa_status || 'not observed'),
          h(TableCell, null, identity.reconciliation ? `${identity.reconciliation.state} · ${identity.reconciliation.revision}` : 'unknown'),
          h(
            TableCell,
            null,
            canSubmit
              ? h(
                  Box,
                  { sx: { display: 'flex', gap: 0.5, flexWrap: 'wrap' } },
                  h(Button, { size: 'small', disabled: busy, onClick: () => { setMode('edit'); setPreview(null); setDraft({ ...EMPTY_DRAFT, identityID: identity.id, displayLabel: identity.display_label || '', email: identity.email || '', groups: (identity.groups || []).join(', ') }); } }, 'Edit'),
                  h(Button, { size: 'small', disabled: busy, onClick: () => previewLifecycle(identity.state === 'enabled' ? 'disable' : 'enable', identity) }, identity.state === 'enabled' ? 'Disable' : 'Enable'),
                  h(Button, { size: 'small', color: 'error', disabled: busy, onClick: () => previewLifecycle('remove', identity) }, 'Remove')
                )
              : 'Read only'
          )
        )
      );

      return h(
        Box,
        { sx: { mt: 3 } },
        h(Typography, { variant: 'h5', sx: { mb: 1 } }, 'Users & Access'),
        h(Typography, { variant: 'body2', sx: { mb: 2 } }, 'Declarative identities, effective access, credential readiness, MFA observation and reconciliation state. Mutations are previewed and submitted through the bounded Access Change API.'),
        mfaSelfServiceURL
          ? h(
              Alert,
              { severity: 'info', sx: { mb: 2 } },
              h(
                Typography,
                { variant: 'body2' },
                'My MFA enrollment opens in your own authenticated Authelia session. Administrators cannot view another user\'s QR code, seed or recovery material. '
              ),
              h(
                Button,
                {
                  component: 'a',
                  href: mfaSelfServiceURL,
                  target: '_blank',
                  rel: 'noopener noreferrer',
                  size: 'small',
                  sx: { mt: 1 }
                },
                'Open My MFA'
              )
            )
          : h(
              Alert,
              { severity: 'warning', sx: { mb: 2 } },
              'My MFA self-service is unavailable because this installation has no validated Authelia provider URL.'
            ),
        h(
          Alert,
          { severity: 'warning', sx: { mb: 2 } },
          'Disable and remove block new authentication after reconciliation. The pinned Authelia version has no supported administrator API for revoking one user\'s existing cookie session, so the API reports session revocation as pending until logout or expiry.'
        ),
        notice ? h(Alert, { severity: notice.severity, sx: { mb: 2 } }, notice.text) : null,
        state.error ? h(Alert, { severity: 'error', sx: { mb: 2 } }, state.error) : null,
