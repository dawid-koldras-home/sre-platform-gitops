            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: allow-list
          mountPath: /etc/identity-bridge
          readOnly: true
        - name: identity-state
          mountPath: /etc/identity-bridge-identities
          readOnly: true
        - name: audit-sink-ca
          mountPath: /etc/identity-bridge/audit-ca
          readOnly: true
        - name: audit-sink-token
          mountPath: /etc/identity-bridge/audit-token
          readOnly: true
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: allow-list
        configMap:
          name: sre-identity-bridge-allow-list
      - name: identity-state
        configMap:
          name: sre-identity-bridge-identities
          optional: true
          items:
          - key: identities.json
            path: identities.json
      - name: audit-sink-ca
        secret:
          secretName: audit-ca
          items:
          - key: ca.crt
            path: ca.crt
      - name: audit-sink-token
        secret:
          secretName: audit-token
          items:
          - key: token
            path: token
