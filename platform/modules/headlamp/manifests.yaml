          state: STATE.MALFORMED,
          missing: [],
          changed: [],
          unexpected: [],
          detail: `The inventory document could not be read: ${inventoryResult.detail || 'unknown reason'}`
        };
      }
      if (!inventoryResult.ok) {
        return {
          state: STATE.UNAVAILABLE,
          missing: [],
          changed: [],
          unexpected: [],
          detail: 'The inventory could not be read.'
        };
      }
      if (observedResult.partial) {
        return {
          state: STATE.PARTIAL,
          missing: [],
          changed: [],
          unexpected: [],
          detail:
            'Only part of the rendered RBAC could be read' +
            (observedResult.detail ? ` (${observedResult.detail})` : '') +
            ', so the comparison against the inventory is qualified rather than complete.'
        };
      }
      if (observedResult.reason === 'unavailable') {
        return {
          state: STATE.UNAVAILABLE,
          missing: [],
          changed: [],
          unexpected: [],
          detail: 'The observed-RBAC read did not reach its destination.'
        };
      }
      if (observedResult.reason === 'malformed') {
        return {
          state: STATE.MALFORMED,
          missing: [],
          changed: [],
          unexpected: [],
          detail: `The observed RBAC read could not be read: ${observedResult.detail || 'unknown reason'}`
        };
      }
      if (comparison && !comparison.agrees) {
        return {
          state: STATE.STALE,
          missing: comparison.missing,
          changed: comparison.changed,
          unexpected: comparison.unexpected,
          detail:
            'The API server and the rendered inventory disagree. The API server is ' +
            'authoritative; re-apply the installation to bring the two back together.'
        };
      }
      return {
        state: STATE.HEALTHY,
        missing: [],
        changed: [],
        unexpected: [],
        detail: 'Every object the inventory describes exists with matching annotations and rules.'
      };
    }

    function freshnessSeverity(state) {
      return SEVERITY.indexOf(state) >= 0 ? SEVERITY.indexOf(state) : SEVERITY.length;
    }

      // ---- src/effective.js ----
    // "Why do I hold this access?" — the client-side effective-access computation.
    //
    // Inputs are the inventory's normalized policy set and the allowlisted identity
    // ({ username, groups }) from identity.js. The output is every grant whose
    // subject, scope and time conditions all hold for this session, each carrying
    // the AccessPolicy name it came from, because a grant whose provenance cannot be
    // named is exactly the answer this view exists not to give.
    //
    // This computation is advisory, like the inventory it reads. It never feeds a
    // permission decision: the API server decides access with the rendered RBAC,
    // and the banner this page renders says so. What the computation answers is the
    // operator's question, from the same normalized data the installer approved, so
    // the answer cites policy names a reviewer can open in Git.
    //
    // Deliberate behaviours:
    //   - a service-account subject is never attributed to a browser session,
    //     because no session can be one; it stays visible in the policy inventory,
    //     which lists every grant regardless of subject;
    //   - a time bound that has passed marks the grant expired rather than dropping
    //     it, so "you had this until Friday" stays visible instead of vanishing;
    //   - scope verification against the active cluster and this installation's
    //     environment happens here, and an unresolvable cluster marks the grant
    //     unverified instead of silently passing or silently failing;
    //   - matching is exact string equality on normalized names, mirroring the
    //     resolver's exact-match scope model: no substring, no pattern, no glob.

    /** Why one grant is or is not effective for this session. */
    const MATCH = {
      MATCHED: 'matched',
      EXPIRED: 'expired',
      OUTSIDE_WINDOW: 'outside-window',
      WRONG_SCOPE: 'wrong-scope',
      UNVERIFIED_SCOPE: 'unverified-scope'
    };

    function subjectMatches(grant, identity) {
      if (grant.subjectKind === 'user') {
        return identity.username === grant.subjectName;
      }
      if (grant.subjectKind === 'group') {
        for (let index = 0; index < identity.groups.length; index += 1) {
          if (identity.groups[index] === grant.subjectName) {
            return true;
          }
        }
        return false;
      }
      return false;
    }

    function matchedVia(grant, identity) {
      if (grant.subjectKind === 'user') {
        return `user ${identity.username}`;
      }
      return `member of group ${grant.subjectName}`;
    }

    function listContains(list, value) {
      for (let index = 0; index < list.length; index += 1) {
        if (list[index] === value) {
          return true;
        }
      }
      return false;
    }

    /**
     * Scope verdict for the active cluster and this installation's environment.
     *
     * Returns { verdict, detail } where verdict is one of MATCH.MATCHED,
     * MATCH.WRONG_SCOPE or MATCH.UNVERIFIED_SCOPE. An empty clusters list means the
     * grant names no cluster restriction of its own beyond the installation, and
     * likewise for environments; a non-empty list must contain the active value. An
     * active cluster the console could not resolve cannot be checked, so the grant
     * is reported unverified rather than being counted as effective without
     * evidence.
     */
    function scopeVerdict(scope, context) {
      if (scope.clusters.length > 0) {
        if (context.cluster === '') {
          return { verdict: MATCH.UNVERIFIED_SCOPE, detail: 'the active cluster is unknown' };
        }
        if (!listContains(scope.clusters, context.cluster)) {
          return { verdict: MATCH.WRONG_SCOPE, detail: `not for cluster ${context.cluster}` };
        }
      }
      if (scope.environments.length > 0) {
        if (context.environment === '') {
          return { verdict: MATCH.UNVERIFIED_SCOPE, detail: 'this installation has no environment' };
        }
        if (!listContains(scope.environments, context.environment)) {
          return { verdict: MATCH.WRONG_SCOPE, detail: `not for environment ${context.environment}` };
        }
      }
      return { verdict: MATCH.MATCHED, detail: '' };
    }

    function timeVerdict(conditions, nowMs) {
      if (!conditions) {
        return { verdict: MATCH.MATCHED, detail: '' };
      }
      if (conditions.expiry) {
        const expiry = Date.parse(conditions.expiry);
        if (Number.isNaN(expiry)) {
          return { verdict: MATCH.MATCHED, detail: '' };
        }
        if (nowMs >= expiry) {
          return { verdict: MATCH.EXPIRED, detail: `expired ${conditions.expiry}` };
        }
      }
      if (conditions.windowStart) {
        const start = Date.parse(conditions.windowStart);
        if (!Number.isNaN(start) && nowMs < start) {
          return { verdict: MATCH.OUTSIDE_WINDOW, detail: `window opens ${conditions.windowStart}` };
        }
      }
      if (conditions.windowEnd) {
        const end = Date.parse(conditions.windowEnd);
        if (!Number.isNaN(end) && nowMs >= end) {
          return { verdict: MATCH.OUTSIDE_WINDOW, detail: `window closed ${conditions.windowEnd}` };
        }
      }
      return { verdict: MATCH.MATCHED, detail: '' };
    }

    function describeGrant(grant, verdict, detail) {
      return {
        policy: grant.policy,
        role: grant.role,
        subjectKind: grant.subjectKind,
        subjectName: grant.subjectName,
        subjectReason: grant.subjectReason || '',
        scope: grant.scope,
        conditions: grant.conditions || null,
        verdict: verdict,
        detail: detail,
        matchedVia: ''
      };
    }

    /**
     * Compute every grant in the policy set, classified for this session.
     *
     * The result carries all classes rather than only the effective ones: an
     * operator asking "why can't I do this any more" needs the expired and
     * wrong-scope grants to still be listed with their reason, and a view that
     * dropped them would answer only the easy half of its question.
     */
    function classifyGrants(policySet, identity, context) {
      const nowMs = context.nowMs;
      const grants = policySet && Array.isArray(policySet.grants) ? policySet.grants : [];
      const effective = [];
      const inactive = [];

      for (let index = 0; index < grants.length; index += 1) {
        const grant = grants[index];

        if (grant.subjectKind !== 'user' && grant.subjectKind !== 'group') {
          // Not this session's concern: a subject kind no browser session can be
          // appears in the policy inventory, not under "grants that name you".
          continue;
        }
        if (!subjectMatches(grant, identity)) {
          continue;
        }

        const scope = scopeVerdict(grant.scope, context);
        if (scope.verdict === MATCH.WRONG_SCOPE) {
          inactive.push(describeGrant(grant, MATCH.WRONG_SCOPE, scope.detail));
          continue;
        }

        const time = timeVerdict(grant.conditions, nowMs);
        if (time.verdict !== MATCH.MATCHED) {
          inactive.push(describeGrant(grant, time.verdict, time.detail));
          continue;
        }

        const entry = describeGrant(grant, MATCH.MATCHED, scope.detail);
        entry.matchedVia = matchedVia(grant, identity);
        if (scope.verdict === MATCH.UNVERIFIED_SCOPE) {
          entry.unverified = true;
          entry.detail = scope.detail;
        }
        effective.push(entry);
      }

      effective.sort((left, right) => (left.policy < right.policy ? -1 : left.policy > right.policy ? 1 : 0));
      inactive.sort((left, right) => (left.policy < right.policy ? -1 : left.policy > right.policy ? 1 : 0));
      return { effective, inactive };
    }

    /**
     * Attribution for one target: every grant whose scope covers it, for any
     * subject.
     *
     * This is the "who else holds access here" half of the view. The target is a
     * namespace name or the empty string for cluster-wide attribution, evaluated
     * against the same exact-match scope model the resolver validated, so what this
     * function reports covers exactly what the rendered definitions were built
     * from. Every row cites its AccessPolicy name.
     */
    function attributeGrants(policySet, target, context) {
      const grants = policySet && Array.isArray(policySet.grants) ? policySet.grants : [];
      const rows = [];
      for (let index = 0; index < grants.length; index += 1) {
        const grant = grants[index];
        const scope = grant.scope;
        const coversNamespace =
          target.namespace === ''
            ? scope.clusterWide === true
            : scope.clusterWide === true || listContains(scope.namespaces || [], target.namespace);
        if (!coversNamespace) {
          continue;
        }
        const verdict = scopeVerdict(scope, context);
        if (verdict.verdict === MATCH.WRONG_SCOPE) {
          continue;
        }
        const time = timeVerdict(grant.conditions, context.nowMs);
        rows.push({
          policy: grant.policy,
          role: grant.role,
          subjectKind: grant.subjectKind,
          subjectName: grant.subjectName,
          subjectReason: grant.subjectReason || '',
          scope: grant.scope,
          conditions: grant.conditions || null,
          timeVerdict: time.verdict,
          detail: time.detail
        });
      }
      rows.sort((left, right) => {
        if (left.policy !== right.policy) {
          return left.policy < right.policy ? -1 : 1;
        }
        return left.subjectName < right.subjectName ? -1 : left.subjectName > right.subjectName ? 1 : 0;
      });
      return rows;
    }

      // ---- src/view.js ----
    // The access-control view: My effective access, Policy inventory, Access
    // attribution, and the freshness of the data they rest on.
    //
    // The page answers operator questions — why do I hold this, who else does, and
    // is this view current — from two sources held side by side: the policy
    // inventory the installer rendered for this installation, and the rendered RBAC
    // objects read back from the API server. They are never merged into one
    // unqualified answer. The inventory is advisory; the API server is
    // authoritative; and when the two disagree the page says exactly that, in a
    // banner above every section, instead of presenting a computed table with no
    // provenance.
    //
    // Every section degrades on its own. A refused identity read blanks only the
    // effective-access section, a missing inventory blanks only the sections that
    // need it, and a failed observed-RBAC read downgrades freshness to an explicit
    // state. A single failure never collapses the page into one opaque error,
    // because a page that shows nothing cannot distinguish "nothing to show" from
    // "could not read".


    const FRESHNESS_TONE = {
      [STATE.HEALTHY]: 'success',
      [STATE.STALE]: 'error',
      [STATE.PARTIAL]: 'warning',
      [STATE.MALFORMED]: 'error',
      [STATE.MISSING]: 'warning',
      [STATE.UNAVAILABLE]: 'error',
      [STATE.UNAUTHORIZED]: 'error'
    };

    const VERDICT_LABEL = {
      [MATCH.MATCHED]: 'effective',
      [MATCH.EXPIRED]: 'expired',
      [MATCH.OUTSIDE_WINDOW]: 'outside window',
      [MATCH.WRONG_SCOPE]: 'out of scope',
      [MATCH.UNVERIFIED_SCOPE]: 'scope unverified'
    };

    const VERDICT_TONE = {
      [MATCH.MATCHED]: 'success',
      [MATCH.EXPIRED]: 'warning',
      [MATCH.OUTSIDE_WINDOW]: 'warning',
      [MATCH.WRONG_SCOPE]: 'default',
      [MATCH.UNVERIFIED_SCOPE]: 'warning'
    };

    /** One full-width message, used for every page- and section-level state. */
    function Notice({ tone, heading, body }) {
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mb: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true, color: `${tone}.main` }, heading),
        h(Typography, { variant: 'body2' }, body)
      );
    }

    function SectionHeading({ children }) {
      return h(
        Typography,
        { variant: 'h5', sx: { mt: 3, mb: 1 } },
        children
      );
    }

    function formatInstant(value) {
      if (typeof value !== 'string' || value === '') {
        return '';
      }
      const parsed = Date.parse(value);
      if (Number.isNaN(parsed)) {
        return value;
      }
      return new Date(parsed).toISOString();
    }

    function formatAge(nowMs, readAt) {
      if (typeof nowMs !== 'number' || typeof readAt !== 'number') {
        return 'unknown';
      }
      return `${Math.max(0, Math.round((nowMs - readAt) / 1000))}s ago`;
    }

    function describeScope(scope) {
      if (!scope) {
        return '';
      }
      const parts = [];
      parts.push(scope.clusterWide ? 'cluster-wide' : `namespaces: ${(scope.namespaces || []).join(', ') || 'none'}`);
      if (scope.clusters && scope.clusters.length > 0) {
        parts.push(`clusters: ${scope.clusters.join(', ')}`);
      }
      if (scope.environments && scope.environments.length > 0) {
        parts.push(`environments: ${scope.environments.join(', ')}`);
      }
      return parts.join('; ');
    }

    function describeConditions(conditions) {
      if (!conditions) {
        return 'no time bound';
      }
      const parts = [];
      if (conditions.expiry) {
        parts.push(`expires ${formatInstant(conditions.expiry)}`);
      }
      if (conditions.windowStart) {
        parts.push(`from ${formatInstant(conditions.windowStart)}`);
      }
      if (conditions.windowEnd) {
        parts.push(`until ${formatInstant(conditions.windowEnd)}`);
      }
      if (conditions.reason) {
        parts.push(`reason: ${conditions.reason}`);
      }
      return parts.length > 0 ? parts.join('; ') : 'no time bound';
    }

    function subjectLabel(row) {
      const kind = row.subjectKind === 'group' ? 'group' : row.subjectKind === 'user' ? 'user' : row.subjectKind;
      const reason = row.subjectReason ? ` (${row.subjectReason})` : '';
      return `${kind} ${row.subjectName}${reason}`;
    }

    function freshnessBanner(freshness, inventory, readAt, nowMs) {
      const tone = FRESHNESS_TONE[freshness.state] || 'warning';
      const facts = [];
      if (inventory) {
        facts.push(`inventory for customer ${inventory.customerId}, environment ${inventory.environment}`);
        facts.push(`policy digest ${inventory.policyDigest.slice(0, 17)}\u2026`);
        facts.push(`contract ${inventory.contractID}`);
        facts.push(`read ${formatAge(nowMs, readAt)}`);
      } else {
        facts.push(`read ${formatAge(nowMs, readAt)}`);
      }
      const disagreement =
        freshness.state === STATE.STALE
          ? h(
              Typography,
              { variant: 'body2', sx: { mt: 1 } },
              [
                freshness.missing.length > 0 ? `missing: ${freshness.missing.join(', ')}. ` : '',
                freshness.changed.length > 0 ? `changed: ${freshness.changed.join(', ')}. ` : '',
                freshness.unexpected.length > 0 ? `unexpected: ${freshness.unexpected.join(', ')}.` : ''
              ].join('')
            )
          : null;
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mb: 2 } },
        h(
          Box,
          { sx: { display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 1 } },
          h(Chip, { label: `data freshness: ${freshness.state}`, color: tone, size: 'small' }),
          h(Typography, { variant: 'body2' }, freshness.detail)
        ),
        h(Typography, { variant: 'caption', sx: { display: 'block', mt: 1 } }, facts.join(' \u00b7 ')),
        disagreement,
        h(
          Typography,
          { variant: 'caption', sx: { display: 'block', mt: 1 } },
          'The policy inventory is an advisory render of the approved configuration. The ' +
            'Kubernetes API server is authoritative for what is actually in the cluster; any ' +
            'disagreement above is a state to act on, not a rendering detail.'
        )
      );
    }

    function effectiveSection(identityResult, grants, context) {
      if (!identityResult.ok) {
        const heading =
          identityResult.reason === 'unauthorized'
            ? 'My effective access is not available'
            : 'The signed-in identity could not be read';
        return h(
          Box,
          { key: 'effective' },
          h(SectionHeading, null, 'My effective access'),
          Notice({
            tone: 'error',
            heading: heading,
            body:
              'The console identity endpoint did not return a usable session identity, so this ' +
              'section cannot answer why a grant does or does not apply. No access is computed ' +
              'rather than a computed empty result being shown. No other section is affected.',
          })
        );
      }

      const classified = classifyGrants(grants, identityResult.identity, context);
      const identity = identityResult.identity;

      const effectiveRows = [];
      for (let index = 0; index < classified.effective.length; index += 1) {
        const row = classified.effective[index];
        effectiveRows.push(
          h(
            TableRow,
            { key: `e:${row.policy}:${row.subjectName}`, hover: true },
            h(TableCell, null, row.role),
            h(TableCell, null, row.matchedVia),
            h(TableCell, null, describeScope(row.scope)),
            h(TableCell, null, describeConditions(row.conditions)),
            h(TableCell, null, row.policy),
            h(TableCell, null, row.unverified ? 'scope not verified against an active cluster' : row.detail || '\u2014')
          )
        );
      }

      const inactiveRows = [];
      for (let index = 0; index < classified.inactive.length; index += 1) {
        const row = classified.inactive[index];
        inactiveRows.push(
          h(
            TableRow,
            { key: `i:${row.policy}:${row.subjectName}`, hover: true },
            h(TableCell, null, row.role),
            h(TableCell, null, subjectLabel(row)),
            h(TableCell, null, describeScope(row.scope)),
            h(TableCell, null, h(Chip, { size: 'small', label: VERDICT_LABEL[row.verdict], color: VERDICT_TONE[row.verdict] })),
            h(TableCell, null, row.detail),
            h(TableCell, null, row.policy)
          )
        );
      }

      const effective =
        classified.effective.length > 0
          ? h(
              TableContainer,
              { component: Paper, variant: 'outlined', sx: { mb: 2 } },
              h(
                Table,
                { size: 'small' },
                h(
                  TableHead,
                  null,
                  h(
                    TableRow,
                    null,
                    h(TableCell, null, 'Role'),
                    h(TableCell, null, 'Matched through'),
                    h(TableCell, null, 'Scope'),
                    h(TableCell, null, 'Conditions'),
                    h(TableCell, null, 'AccessPolicy'),
                    h(TableCell, null, 'Note')
                  )
                ),
                h(TableBody, null, effectiveRows)
              )
            )
          : Notice({
              tone: 'info',
              heading: 'No access is effective for this session',
              body:
                `No grant in the policy set names ${identity.username} or any of this session's ` +
                `groups (${identity.groups.join(', ') || 'none'}) over a scope and time that hold ` +
                'right now. This is a computed empty result, not a failure to read.',
            });

      const inactive =
        classified.inactive.length > 0
          ? h(
              Box,
              { sx: { mb: 2 } },
              h(Typography, { variant: 'subtitle1', sx: { mb: 1 } }, 'Grants that name you but are not effective'),
              h(
                TableContainer,
                { component: Paper, variant: 'outlined' },
                h(
                  Table,
                  { size: 'small' },
                  h(
                    TableHead,
                    null,
                    h(
                      TableRow,
                      null,
                      h(TableCell, null, 'Role'),
                      h(TableCell, null, 'Subject'),
                      h(TableCell, null, 'Scope'),
                      h(TableCell, null, 'State'),
                      h(TableCell, null, 'Why'),
                      h(TableCell, null, 'AccessPolicy')
                    )
                  ),
                  h(TableBody, null, inactiveRows)
                )
              )
            )
          : null;

      return h(
        Box,
        { key: 'effective' },
        h(SectionHeading, null, 'My effective access'),
        h(
          Typography,
          { variant: 'body2', sx: { mb: 1 } },
          `Signed in as ${identity.username} with ${identity.groups.length} group(s): ` +
            `${identity.groups.join(', ') || 'none'}. Matched against the normalized policy set ` +
            'of this installation.'
        ),
        effective,
        inactive
      );
    }

    function inventorySection(inventoryResult, observedResult, comparison) {
      if (!inventoryResult.ok) {
        const map = {
          unauthorized: [
            'The policy inventory is not readable',
            'The API server refused the read of the inventory ConfigMap. Nothing is shown ' +
              'because the document this section would render could not be obtained.'
          ],
          missing: [
            'The policy inventory ConfigMap is missing',
            'No inventory was rendered for this plugin (it is rendered only when the ' +
              'accessControlView plugin is enabled), or it was removed while this payload was ' +
              'loaded. An empty inventory is never rendered as an empty policy set.'
          ],
          malformed: [
            'The policy inventory could not be read',
            `The document is not the expected envelope: ${inventoryResult.detail || 'unknown reason'}. ` +
              'Nothing is shown rather than a misshapen policy list.'
          ],
          unavailable: [
            'The policy inventory could not be reached',
            'The read did not reach its destination. This is a failure to read, not an empty ' +
              'inventory.'
          ]
        };
        const copy = map[inventoryResult.reason] || map.unavailable;
        return h(
          Box,
          { key: 'inventory' },
          h(SectionHeading, null, 'Policy inventory'),
          Notice({ tone: 'error', heading: copy[0], body: copy[1] })
        );
      }

      const inventory = inventoryResult.inventory;
      const grants = inventory.policySet.grants;

      const grantRows = [];
      for (let index = 0; index < grants.length; index += 1) {
        const grant = grants[index];
        grantRows.push(
          h(
            TableRow,
            { key: `g:${index}`, hover: true },
            h(TableCell, null, grant.policy),
            h(TableCell, null, subjectLabel(grant)),
            h(TableCell, null, grant.role),
            h(TableCell, null, describeScope(grant.scope)),
            h(TableCell, null, describeConditions(grant.conditions))
          )
        );
      }

      const observedByKey = {};
      if (observedResult.objects) {
        for (let index = 0; index < observedResult.objects.length; index += 1) {
          observedByKey[objectKey(observedResult.objects[index])] = observedResult.objects[index];
        }
      }
      const missingSet = {};
      const changedSet = {};
      if (comparison) {
        for (const key of comparison.missing) {
          missingSet[key] = true;
        }
        for (const key of comparison.changed) {
          changedSet[key] = true;
        }
      }

      const objectRows = [];
      for (let index = 0; index < inventory.renderedObjects.length; index += 1) {
        const object = inventory.renderedObjects[index];
        const key = objectKey(object);
        const observed = observedByKey[key];
        let state = 'unobserved';
        let tone = 'default';
        if (missingSet[key]) {
          state = 'missing in cluster';
          tone = 'error';
        } else if (changedSet[key]) {
          state = 'changed';
          tone = 'error';
        } else if (observed) {
          state = 'observed';
          tone = 'success';
        }
        objectRows.push(
          h(
            TableRow,
            { key: `o:${key}`, hover: true },
            h(TableCell, null, object.kind),
            h(TableCell, null, object.namespace ? `${object.namespace}/${object.name}` : object.name),
            h(TableCell, null, object.annotations['platform.sre-platform.io/access-role'] || ''),
            h(TableCell, null, object.annotations['platform.sre-platform.io/access-policies'] || ''),
            h(TableCell, null, observed ? String(observed.generation) : '\u2014'),
            h(TableCell, null, h(Chip, { size: 'small', label: state, color: tone }))
          )
        );
      }

      const emptyGrantState =
        grants.length === 0
          ? Notice({
              tone: inventory.policyConfigured ? 'warning' : 'info',
              heading: inventory.policyConfigured
                ? 'The policy set grants nothing'
                : 'No AccessPolicy is configured in this installation',
              body: inventory.policyConfigured
                ? 'The configured AccessPolicy resolved to an empty grant list: deny everything, ' +
                  'by configuration rather than by failure.'
                : 'This installation declares no spec.accessPolicy, so there is nothing to ' +
                  'inventory. The inventory itself is still rendered and still compared with ' +
                  'the API server.',
            })
          : null;

      return h(
        Box,
        { key: 'inventory' },
        h(SectionHeading, null, 'Policy inventory'),
        h(
          Typography,
          { variant: 'body2', sx: { mb: 1 } },
          `Rendered for customer ${inventory.customerId} in environment ${inventory.environment} ` +
            `from ${INVENTORY_NAME} in namespace ${INVENTORY_NAMESPACE}. Policy digest ` +
            `${inventory.policyDigest}. ` +
            (inventory.bindingsActive
              ? 'Authorization bindings are active for this installation.'
              : 'Authorization bindings are not active: the inventory describes rendered ' +
                'definitions only, and no binding in the cluster grants from this document.')
        ),
        emptyGrantState,
        grants.length > 0
          ? h(
              TableContainer,
              { component: Paper, variant: 'outlined', sx: { mb: 2 } },
              h(
                Table,
                { size: 'small' },
                h(
                  TableHead,
                  null,
                  h(
                    TableRow,
                    null,
                    h(TableCell, null, 'AccessPolicy'),
                    h(TableCell, null, 'Subject'),
                    h(TableCell, null, 'Role'),
                    h(TableCell, null, 'Scope'),
                    h(TableCell, null, 'Conditions')
                  )
                ),
                h(TableBody, null, grantRows)
              )
            )
          : null,
        h(Typography, { variant: 'subtitle1', sx: { mb: 1 } }, 'Rendered RBAC objects'),
        inventory.renderedObjects.length === 0
          ? Notice({
              tone: 'info',
              heading: 'No RBAC objects were rendered',
              body:
                'The current policy set produced no Role or ClusterRole definitions. This is ' +
                'consistent with an empty grant list, not with a failed render.',
            })
          : h(
              TableContainer,
              { component: Paper, variant: 'outlined' },
              h(
                Table,
                { size: 'small' },
                h(
                  TableHead,
                  null,
                  h(
                    TableRow,
                    null,
                    h(TableCell, null, 'Kind'),
                    h(TableCell, null, 'Name'),
                    h(TableCell, null, 'Role'),
                    h(TableCell, null, 'Policies'),
                    h(TableCell, null, 'Generation'),
                    h(TableCell, null, 'Observed state')
                  )
                ),
                h(TableBody, null, objectRows)
              )
            )
      );
    }

    function attributionSection(policySet, target, setTarget, context, cluster) {
      const rows = attributeGrants(policySet, { namespace: target }, context);
      const targetLink = target === '' ? '' : namespaceScopedHref(cluster, target);

      const body =
        rows.length > 0
          ? h(
              TableContainer,
              { component: Paper, variant: 'outlined' },
              h(
                Table,
                { size: 'small' },
                h(
                  TableHead,
                  null,
                  h(
                    TableRow,
                    null,
                    h(TableCell, null, 'AccessPolicy'),
                    h(TableCell, null, 'Subject'),
                    h(TableCell, null, 'Role'),
                    h(TableCell, null, 'Scope'),
                    h(TableCell, null, 'Conditions'),
                    h(TableCell, null, 'State')
                  )
                ),
                h(
                  TableBody,
                  null,
                  rows.map((row, index) =>
                    h(
                      TableRow,
                      { key: `a:${index}`, hover: true },
                      h(TableCell, null, row.policy),
                      h(TableCell, null, subjectLabel(row)),
                      h(TableCell, null, row.role),
                      h(TableCell, null, describeScope(row.scope)),
                      h(TableCell, null, describeConditions(row.conditions)),
                      h(
                        TableCell,
                        null,
                        h(Chip, {
                          size: 'small',
                          label: row.timeVerdict === MATCH.MATCHED ? 'in time' : VERDICT_LABEL[row.timeVerdict],
                          color: row.timeVerdict === MATCH.MATCHED ? 'success' : 'warning'
                        })
                      )
                    )
                  )
                )
              )
            )
          : Notice({
              tone: 'info',
              heading: target === '' ? 'No cluster-wide grant exists' : `No grant covers namespace ${target}`,
              body:
                'The normalized policy set contains no grant whose scope reaches this target. ' +
                'This is the attribution answer for the target, computed from the same ' +
                'exact-match scope model the resolver validated.',
            });

      return h(
        Box,
        { key: 'attribution' },
        h(SectionHeading, null, 'Access attribution'),
        h(
          Typography,
          { variant: 'body2', sx: { mb: 1 } },
          'Every grant in the policy set whose scope covers the target, for any subject, each ' +
            'cited by its AccessPolicy name. Enter a namespace to narrow the answer; leave it ' +
            'empty for cluster-wide grants.'
        ),
        h(
          Box,
          { sx: { display: 'flex', alignItems: 'center', gap: 2, mb: 1 } },
          h(TextField, {
            label: 'Namespace',
            value: target,
            size: 'small',
            sx: { minWidth: 240 },
            onChange: event => setTarget(event && event.target ? event.target.value : '')
          }),
          targetLink
            ? h(Link, { href: targetLink, variant: 'body2' }, `Open pods in ${target}`)
            : null
        ),
        body
      );
    }

    // discoveryNotice explains why the editor shows no controls.
    //
    // The distinction matters to an operator: "the API is unreachable" and "the API
    // is running but a dependency it refuses to work without is down" lead to
    // different actions, and the TASK-227 rebuild showed the second reported as the
    // first. The API reserves a durable audit record before every request, action
    // discovery included, so a sink outage makes it answer 503 for everything.
    function discoveryNotice(discovery) {
      if (discovery.status === 503) {
        return {
          tone: 'warning',
          heading: 'The API is running but its audit sink is unavailable',
          body:
            'The access-change API answered 503 with code "' +
            (discovery.code || 'unavailable') +
            '". It reserves a durable audit record before every request, action discovery included, so it ' +
            'refuses all work while that reservation fails. Check the audit-sink module status and the network ' +
            'policy that admits this API as a writer, then reload. The read-only sections above are unaffected.'
        };
      }
      if (discovery.reason === 'unauthorized') {
        return {
          tone: 'warning',
          heading: 'The access-change API did not accept this session',
          body:
            'Action discovery answered ' +
            String(discovery.status || 'without a status') +
            ', so no editor controls are shown. The API authorizes the session the console forwards; a session ' +
            'that is missing, expired or not granted the access administrator role is refused here as well.'
        };
      }
      return {
        tone: 'warning',
        heading: 'The editor is enabled but its API could not be reached',
        body:
          'The installation enables editing, but the access-change API did not answer action ' +
          'discovery, so no controls are shown. Editing fails closed: an unreachable or ' +
          'unauthorized API never presents a form. The read-only sections above are unaffected.'
      };
    }

    function editorSection(inventoryResult, discovery, refresh) {
      if (!inventoryResult.ok || !inventoryResult.inventory.editorEnabled) {
        return null;
      }
      if (!discovery.ok) {
        return h(
          Box,
          { key: 'editor' },
          h(SectionHeading, null, 'AccessPolicy editor'),
          Notice(discoveryNotice(discovery))
        );
      }
      if (!discovery.canSubmit) {
        return h(
          Box,
          { key: 'editor' },
          h(UsersSection, { canSubmit: false, onChanged: refresh, mfaSelfServiceURL: inventoryResult.inventory.mfaSelfServiceURL }),
          h(SectionHeading, null, 'AccessPolicy editor'),
          Notice({
            tone: 'info',
            heading: 'Editing is not permitted for this session',
            body:
              'The access-change API reports that this session may not submit changes, so no ' +
              'controls are shown. The read-only sections above remain available.'
          })
        );
      }
      return h(
        Box,
        { key: 'editor' },
        h(UsersSection, { canSubmit: true, onChanged: refresh, mfaSelfServiceURL: inventoryResult.inventory.mfaSelfServiceURL }),
        h(EditorSection, { discovery, onChanged: refresh })
      );
    }

    function AccessControlPage() {
      const cluster = useMemo(() => activeCluster(), []);
      const [target, setTarget] = useState('');
      const [tick, setTick] = useState(0);
      const [state, setState] = useState({
        loading: true,
        readAt: 0,
        nowMs: Date.now(),
        identity: { ok: false, identity: null, reason: '', status: 0 },
        inventory: { ok: false, inventory: null, reason: '', status: 0, detail: '' },
        discovery: { ok: false, canSubmit: false, revision: '', reason: 'pending', status: 0, code: '', message: '' },
        observed: { ok: false, partial: false, objects: [], reason: '', status: 0, detail: '' },
        comparison: null,
        freshness: null
      });

      const load = useCallback(async () => {
        const nowMs = Date.now();
        const [identity, inventory, observed] = await Promise.all([
          fetchIdentity(),
          fetchInventory(),
          fetchObservedRBAC()
        ]);
        let comparison = null;
        if (inventory.ok && observed.ok) {
          // Only a complete observed read may be compared. A partial read that lacks
          // an object proves nothing about it, so absence there must not be reported
          // as "missing in cluster"; freshness already reports the partial read.
          comparison = compareRendered(inventory.inventory.renderedObjects, observed.objects);
        }
        const freshness = computeFreshness(inventory, observed, comparison);
        // The editor is offered only when the installation enables it AND the
        // server's own discovery answers. A disabled editor, or one whose API is
        // unreachable, must not put a form on screen that the server will refuse.
        let discovery = { ok: false, canSubmit: false, revision: '', reason: 'disabled', status: 0, code: '', message: '' };
        if (inventory.ok && inventory.inventory.editorEnabled) {
          const actions = await fetchEditorActions();
          if (actions.ok) {
            const payload = actions.payload || {};
            discovery = {
              ok: true,
              canSubmit: payload.can_submit === true,
              revision: typeof payload.revision === 'string' ? payload.revision : '',
              reason: '',
              status: actions.status,
              code: '',
              message: ''
            };
          } else {
            discovery = {
              ok: false,
              canSubmit: false,
              revision: '',
              reason: actions.reason,
              status: actions.status,
              code: actions.code || '',
              message: actions.message || ''
            };
          }
        }
        setState({
          loading: false,
          readAt: nowMs,
          nowMs: nowMs,
          identity: identity,
          inventory: inventory,
          discovery: discovery,
          observed: observed,
          comparison: comparison,
          freshness: freshness
        });
      }, []);

      useEffect(() => {
        load();
      }, [load, tick]);

      const refresh = useCallback(() => setTick(value => value + 1), []);

      if (state.loading) {
        return Notice({
          tone: 'info',
          heading: 'Loading access control data',
          body:
            'Reading the signed-in identity, the policy inventory and the rendered RBAC objects ' +
            'this installation holds.',
        });
      }

      const inventoryResult = state.inventory;
      const inventory = inventoryResult.ok ? inventoryResult.inventory : null;
      const policySet = inventory ? inventory.policySet : { version: '', grants: [] };
      const context = {
        cluster: cluster,
        environment: inventory ? inventory.environment : '',
        nowMs: state.nowMs
      };

      const sections = [
        freshnessBanner(state.freshness, inventory, state.readAt, state.nowMs),
        effectiveSection(state.identity, policySet, context),
        inventorySection(inventoryResult, state.observed, state.comparison),
        attributionSection(policySet, target, setTarget, context, cluster),
        editorSection(inventoryResult, state.discovery, refresh)
      ];

      return h(
        Box,
        null,
        sections,
        h(
          Box,
          { sx: { mt: 2, display: 'flex', gap: 2, alignItems: 'center' } },
          h(Link, { component: 'button', variant: 'body2', onClick: refresh }, 'Refresh now'),
          h(
            Typography,
            { variant: 'caption' },
            'Reads: the console identity endpoint, one named inventory ConfigMap and the ' +
              'rendered Role and ClusterRole objects of this installation. Nothing else.'
          )
        )
      );
    }

    registerSidebarEntry({
      parent: null,
      name: PLUGIN_SIDEBAR,
      label: 'Access control',
      url: PLUGIN_PATH,
      icon: 'mdi:shield-lock-outline'
    });

    registerRoute({
      path: PLUGIN_PATH,
      sidebar: PLUGIN_SIDEBAR,
      name: PLUGIN_SIDEBAR,
      exact: true,
      keepMounted: true,
      component: AccessControlPage
    });

    })();
  package.json: |
    {
      "name": "@sre-platform/headlamp-access-control-view",
      "version": "0.6.0",
      "description": "Access control and managed-user view with bounded GitOps editors for the Headlamp operator console",
      "private": true,
      "license": "Apache-2.0",
      "main": "src/view.js",
      "type": "module",
      "scripts": {
        "build": "node build.mjs",
        "test": "node --test test/payload.test.mjs test/effective.test.mjs test/status.test.mjs test/schema.test.mjs test/preview.test.mjs test/requeststatus.test.mjs test/users.test.mjs test/errors.test.mjs"
      },
      "devDependencies": {
        "@kinvolk/headlamp-plugin": "0.13.1"
      }
    }
