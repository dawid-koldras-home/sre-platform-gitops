        image: ghcr.io/dawid-koldras-home/sre-platform-headlamp-identity-bridge@sha256:05046aedb19505ff632b21a1e3a7a9104371010587de1c7dd9ace1ea1f92b59b
        imagePullPolicy: IfNotPresent
        args:
