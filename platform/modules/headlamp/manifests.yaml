      }
      const problems = [];
      value.forEach((code, index) => {
        if (!Number.isInteger(code) || code < 100 || code > 599) {
          problems.push(problem(`expectedStatusCodes[${index}]`, 'must be an HTTP status code between 100 and 599'));
        }
      });
      return problems;
    }

    /**
     * Validate a target hostname the way classifyGatusTargetHost does.
     *
     * This is the rule that makes an in-cluster target an exact, opt-in form rather than a
     * suffix test. Reproduced from internal/resolver/gatus.go because an editor that guessed
     * would let an operator compose a target the installer refuses, and one that was looser
     * about the internal form would defeat the NetworkPolicy narrowing the resolver derives
     * from the namespace and port it returns.
     *
     * @returns an object with `ok` and, when the host is an accepted in-cluster target,
     * `service` and `namespace`. The caller never sees the host itself.
     */
    function classifyTargetHost(host, allowClusterInternal) {
      const text = String(host === undefined || host === null ? '' : host).toLowerCase().replace(/\.$/, '');
      if (text === '') {
        return { ok: false, message: 'must include a hostname' };
      }
      if (text === 'localhost' || text.endsWith('.localhost')) {
        return { ok: false, message: 'must not target localhost' };
      }

      if (isIpLiteral(text)) {
        const literal = parseIpLiteral(text);
        if (literal.loopback || literal.linkLocal || literal.unspecified) {
          return { ok: false, message: 'must not target a loopback, link-local or unspecified address' };
        }
        if (literal.private) {
          return {
            ok: false,
            message: 'must not target a raw private address; name the target so the platform can restrict egress to it',
          };
        }
        if (allowClusterInternal) {
          return {
            ok: false,
            message: `sets allowClusterInternal but the target is an address literal, not an in-cluster ${CONTRACT.clusterLocalSuffix} name`,
          };
        }
        return { ok: true, internal: false, service: '', namespace: '' };
      }

      // A cluster zone anywhere but the end is a name that resolves off-cluster while looking
      // internal. Refused for both flag states, because the honest answer is the same either
      // way.
      if (text.includes(CONTRACT.clusterLocalLabel) && !text.endsWith(CONTRACT.clusterLocalSuffix)) {
        return {
          ok: false,
          message: `must not embed ${CONTRACT.clusterLocalLabel} in the middle of the hostname; only the exact in-cluster form <service>.<namespace>${CONTRACT.clusterLocalSuffix} is accepted`,
        };
      }

      if (text.endsWith('.local')) {
        if (!text.endsWith(CONTRACT.clusterLocalSuffix)) {
          return {
            ok: false,
            message: `must not target a link-local or mDNS name; only the in-cluster ${CONTRACT.clusterLocalSuffix} form is accepted`,
          };
        }
        const parts = text.slice(0, -CONTRACT.clusterLocalSuffix.length).split('.');
        if (parts.length !== 2 || parts[0] === '' || parts[1] === '') {
          return {
            ok: false,
            message: `must be exactly <service>.<namespace>${CONTRACT.clusterLocalSuffix}`,
          };
        }
        const [service, namespace] = parts;
        if (!DNS1123.test(service)) {
          return { ok: false, message: `has an invalid service name "${service}"; it must be a lowercase DNS label` };
        }
        if (!DNS1123.test(namespace)) {
          return { ok: false, message: `has an invalid namespace "${namespace}"; it must be a lowercase DNS label` };
        }
        if (CONTRACT.forbiddenInternalServices.includes(service)) {
          return {
            ok: false,
            message:
              service === 'kubernetes'
                ? 'must not target the "kubernetes" Service: it is the Kubernetes API server Service, not a platform component'
                : `must not target the "${service}" Service`,
          };
        }
        if (!allowClusterInternal) {
          return {
            ok: false,
            message: `targets an in-cluster name; set allowClusterInternal: true to accept an internal readiness endpoint deliberately`,
          };
        }
        return { ok: true, internal: true, service, namespace };
      }

      if (allowClusterInternal) {
        return {
          ok: false,
          message: `sets allowClusterInternal but the target is a public name; the flag is only valid for an in-cluster ${CONTRACT.clusterLocalSuffix} target`,
        };
      }
      return { ok: true, internal: false, service: '', namespace: '' };
    }

    /**
     * Is this an IPv4 or IPv6 literal?
     *
     * Shape, not range: an unparseable "address" is then classified as a name and refused by
     * the DNS rules instead of being silently accepted as a public target.
     */
    function isIpLiteral(text) {
      if (/^\d{1,3}(\.\d{1,3}){3}$/.test(text)) {
