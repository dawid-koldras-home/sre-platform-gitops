# Source: headlamp/templates/extra-manifests.yaml
apiVersion: v1
data:
  main.js: |
    // headlamp-access-control-view — first-party Headlamp plugin, built from committed source.
    // Generated by build.mjs. Do not edit: edit src/*.js and rebuild.
    // Entry: view.js. Build inputs are hashed in ../../../plugins.lock.yaml.
    (function () {
      'use strict';
      // ---- src/contract.js ----
    // The access-control view contract: routes, the request manifest and the
    // identity allowlist.
    //
    // ## The request manifest is the security boundary
    //
    // REQUESTS below is the complete, closed list of every runtime call this plugin
    // can make. It is machine-read twice:
    //
    //   - at runtime by fetch.js, which is the only module allowed to call the
    //     console's API proxy, and which refuses any request id that is not declared
    //     here; and
    //   - at build time by TestHeadlampAccessViewRequestsMatchTheViewerBaseline in
    //     internal/resolver, which parses this literal, asserts the exact expected
    //     entry set, and proves every Kubernetes entry is authorised by a rule the
    //     installer already renders into the headlamp-read-only ClusterRole. Adding
    //     a request anywhere in the plugin therefore fails the Go test until the
    //     manifest is extended deliberately and the baseline comparison passes
    //     again.
    //
    // The manifest is a JSON literal on purpose, so the Go test extracts it with a
    // single regex and one json.Unmarshal rather than executing JavaScript.
    //
    // ## Why /me is not a Kubernetes request
    //
    // The signed-in identity comes from the console's own `/me` endpoint, which
    // Headlamp's backend serves from the Authelia forward-auth headers
    // (Remote-User, remote groups) of the operator's session. It is served on the
    // Headlamp backend, not by the API server, so reading it costs no RBAC review,
    // touches no Kubernetes resource and cannot widen the cluster permission set.
    // Only username and groups are read from the response; see IDENTITY_FIELDS.
    //
    // ## Why the inventory is one named GET in one namespace
    //
    // The policy inventory is a single ConfigMap the installer renders at a fixed
    // name in the headlamp namespace when (and only when) this plugin is enabled.
    // The manifest declares exactly that one get. There is no list, no watch, no
    // second namespace and no other ConfigMap anywhere in this plugin, so a payload
    // that could fetch a foreign installation's inventory has no request to make:
    // tenant scoping is enforced by the read path, not by client-side filtering of
    // a shared document.

    // The route this plugin registers, relative to the console's cluster prefix.
    const ROUTE_PATH = '/access-control';

    // The sidebar entry name the route binds to.
    const SIDEBAR_NAME = 'access-control';

    // The prefix Headlamp puts in front of every navigable plugin address. The
    // console owns `/c/<cluster>`; this plugin registers no cluster of its own.
    const CLUSTER_ROUTE_PREFIX = '/c/';

    /**
     * Build the navigable URL for a plugin route under the active cluster.
     *
     * A plugin route is registered cluster-relative and rendered by the console at
     * `/c/<active-cluster><route>`. An href written by the plugin is not routed: a
     * raw `/access-control` leaves the cluster layout and renders the console 404.
     * The cluster name is URL-encoded because it is operator-chosen. With no
     * resolvable cluster the result is the empty string, which callers must treat
     * as "render no link" rather than falling back to a route that cannot work.
     */
    function clusterScopedPath(clusterName, path) {
      if (typeof clusterName !== 'string' || clusterName.trim() === '') {
        return '';
      }
      if (typeof path !== 'string' || path === '' || path[0] !== '/') {
        return '';
      }
      if (path.startsWith(CLUSTER_ROUTE_PREFIX)) {
        return '';
      }
      return `${CLUSTER_ROUTE_PREFIX}${encodeURIComponent(clusterName.trim())}${path}`;
    }

    /**
     * A namespace-scoped resource address on the active cluster.
     *
     * This is the one navigation form the attribution view needs: a namespace name
     * from the inventory rendered as a link into the console's own resource list,
     * using the `?namespace=` query the console's sidebar uses. Empty results for a
     * missing cluster or namespace, and the caller renders no link instead.
     */
    function namespaceScopedHref(clusterName, namespace) {
      if (typeof namespace !== 'string' || namespace.trim() === '') {
        return '';
      }
      const base = clusterScopedPath(clusterName, '/pods');
      if (base === '') {
        return '';
      }
      return `${base}?namespace=${encodeURIComponent(namespace.trim())}`;
    }

    // The identity fields this plugin reads. The console's /me payload carries more
    // than these two values; everything outside this allowlist is discarded before
    // the response leaves identity.js, so no other field is stored, rendered,
    // logged or included in any fixture. The allowlist is asserted mechanically by
    // TestHeadlampAccessViewIdentityAllowlistIsUsernameAndGroups, which parses this
    // literal the same way the request-manifest test parses REQUESTS below.
    const IDENTITY_FIELDS = ["username", "groups"];

    // The inventory ConfigMap the installer renders for this plugin, at a fixed
    // name in the fixed headlamp namespace. These constants describe the object for
    // display; the read itself is declared once, below, in REQUESTS.
    const INVENTORY_NAME = 'headlamp-access-policy-inventory';
    const INVENTORY_NAMESPACE = 'headlamp';
    const INVENTORY_KEY = 'inventory.json';

    // The label selector that narrows the observed-RBAC reads to the objects this
    // platform rendered. Both list requests carry it, so a cluster's unrelated
    // Roles and ClusterRoles are never fetched or held in the browser.
    const RENDERED_OBJECT_SELECTOR = 'app.kubernetes.io/managed-by=srectl-accesscontrol';

    // The bounded same-origin prefix the access-change-api module exposes at, and
    // the base of its five capabilities. The editor reaches the API through the
    // console origin, never through a second host: a request path that did not
    // start here would be a destination the manifest does not declare. The default
    // is asserted against accessChangeAPIDefaultPathPrefix by the Go test
    // TestHeadlampAccessViewRequestsMatchTheViewerBaseline, so the two cannot
    // drift apart. An operator who overrides the prefix must leave it at the
    // default while the editor is enabled; the editor fails closed otherwise.
    const ACCESS_API_PREFIX = '/access-change';
    const ACCESS_API_BASE = `${ACCESS_API_PREFIX}/api/v1/access`;

    // The closed set of change operations the editor may submit. It mirrors the
    // TASK-218 operation vocabulary; the API re-checks it and rejects anything
    // else.
    const EDITOR_OPERATIONS = ['create', 'update', 'delete'];

    // The bounded validation for a value substituted into a path templated by an
    // access-change request. A caller cannot widen a request path: fetch.js refuses
    // a value that does not match the pattern for its manifest-declared kind, so
    // the only paths this plugin can form are the ones the server itself accepts.
    const PATH_PARAM_PATTERNS = {
      'policy-name': '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$',
      'request-id': '^[0-9a-f]{16}$'
    };

    // The complete, closed list of runtime requests this plugin can make.
    //
    // surface:
    //   "headlamp-backend" — served by Headlamp's own backend (the console's /me
    //     route); not a Kubernetes API request, no RBAC rule involved.
    //   "kubernetes" — forwarded by Headlamp's backend to the API server and
    //     authorised by the identity that reads it. Every k8s entry carries the
    //     apiGroup/resource/verb fields TestHeadlampAccessViewRequestsMatchTheViewerBaseline
    //     compares against the rendered headlamp-read-only ClusterRole.
    //   "access-change-api" — the bounded same-origin Access Change GitOps API
    //     enabled by TASK-218, reached at ACCESS_API_PREFIX. These are not
    //     Kubernetes requests and carry no k8s block: the API server authorises
    //     every one server-side. The editor's discovery, list, read, submit and
    //     status calls are the only access-change entries here; there is no delete,
    //     no arbitrary path and no proxy. The four POST entries are the bounded
    //     policy submit, credential write, identity preview and identity submit.
    //
    // This array must stay strict JSON - double-quoted keys and values, no trailing
    // commas - so the Go test extracts it with a single regex and one json.Unmarshal
    // rather than executing JavaScript. It is still an ordinary JavaScript array
    // literal at run time; only the quoting style is constrained.
    const REQUESTS = [
      {
        "id": "me",
        "surface": "headlamp-backend",
        "method": "GET",
        "path": "/me",
        "timeoutMs": 10000
      },
      {
        "id": "inventory",
        "surface": "kubernetes",
        "method": "GET",
        "path": "/api/v1/namespaces/headlamp/configmaps/headlamp-access-policy-inventory",
        "timeoutMs": 15000,
        "k8s": {
          "apiGroup": "",
          "resource": "configmaps",
          "verb": "get",
          "namespace": "headlamp",
          "name": "headlamp-access-policy-inventory"
        }
      },
      {
        "id": "observed-clusterroles",
        "surface": "kubernetes",
        "method": "GET",
        "path": "/apis/rbac.authorization.k8s.io/v1/clusterroles",
        "timeoutMs": 15000,
        "labelSelector": "app.kubernetes.io/managed-by=srectl-accesscontrol",
        "k8s": {
          "apiGroup": "rbac.authorization.k8s.io",
          "resource": "clusterroles",
          "verb": "list"
        }
      },
      {
        "id": "observed-roles",
        "surface": "kubernetes",
        "method": "GET",
        "path": "/apis/rbac.authorization.k8s.io/v1/roles",
        "timeoutMs": 15000,
        "labelSelector": "app.kubernetes.io/managed-by=srectl-accesscontrol",
        "k8s": {
          "apiGroup": "rbac.authorization.k8s.io",
          "resource": "roles",
          "verb": "list"
        }
      },
      {
        "id": "access-actions",
        "surface": "access-change-api",
        "method": "GET",
        "path": "/access-change/api/v1/access/actions",
        "timeoutMs": 10000
      },
      {
        "id": "access-policies",
        "surface": "access-change-api",
        "method": "GET",
        "path": "/access-change/api/v1/access/policies",
        "timeoutMs": 15000
      },
      {
        "id": "access-policy",
        "surface": "access-change-api",
        "method": "GET",
        "path": "/access-change/api/v1/access/policies/{policy_name}",
        "timeoutMs": 15000,
        "pathParams": { "policy_name": "policy-name" }
      },
      {
        "id": "access-submit",
        "surface": "access-change-api",
        "method": "POST",
        "path": "/access-change/api/v1/access/requests",
        "timeoutMs": 20000
      },
      {
        "id": "access-request",
        "surface": "access-change-api",
        "method": "GET",
        "path": "/access-change/api/v1/access/requests/{request_id}",
        "timeoutMs": 15000,
        "pathParams": { "request_id": "request-id" }
      },
      {
        "id": "identity-list",
        "surface": "access-change-api",
        "method": "GET",
        "path": "/access-change/api/v1/access/identities",
        "timeoutMs": 15000
      },
      {
        "id": "identity-credential",
        "surface": "access-change-api",
        "method": "POST",
        "path": "/access-change/api/v1/access/identity-credentials",
        "timeoutMs": 30000
      },
      {
        "id": "identity-preview",
        "surface": "access-change-api",
        "method": "POST",
        "path": "/access-change/api/v1/access/identity-previews",
        "timeoutMs": 20000
      },
      {
        "id": "identity-submit",
        "surface": "access-change-api",
        "method": "POST",
        "path": "/access-change/api/v1/access/identity-requests",
        "timeoutMs": 30000
      }
    ];

    /**
     * Resolve a declared request by id.
     *
     * Throws for an id the manifest does not declare, which is what makes an
     * undeclared request impossible rather than merely discouraged: the one call
     * site in fetch.js goes through this function, so a call for anything not
     * listed above fails before it reaches the network.
     */
    function requestEntry(id) {
      for (let index = 0; index < REQUESTS.length; index += 1) {
        if (REQUESTS[index].id === id) {
          return REQUESTS[index];
        }
      }
      throw new Error(
        `headlamp-access-control-view: request "${id}" is not declared in the REQUESTS ` +
          'manifest in src/contract.js; every runtime request must be declared there and ' +
          'must pass the viewer-baseline comparison before it can be issued'
      );
    }

      // ---- src/runtime.js ----
    // Runtime access to the Headlamp console.
    //
    // Headlamp 0.43.0 loads every plugin by evaluating its `main.js` as a bare
    // function body: the loader calls `new Function(source)()`. That is neither
    // CommonJS nor an ES module, so `module`, `exports` and `require` are all
    // undefined inside it. A payload that expects them throws before it registers
    // anything, while the console still lists the plugin from its package.json. So
    // everything the console publishes is read from `globalThis.pluginLib` at load
    // time and nothing is loaded through a module system.
    //
    // The console's API proxy reference is validated here but deliberately not
    // called here: fetch.js is the only module in this plugin allowed to turn a
    // declared manifest entry into a request, so every network call passes through
    // the REQUESTS manifest in contract.js. This module exposes the proxy to
    // fetch.js under a name that says what it is, and nothing else in the plugin
    // may touch it.


    function missing(field) {
      return new Error(
        `headlamp-access-control-view: globalThis.pluginLib.${field} is unavailable, so this ` +
          'page cannot render. The Headlamp console publishes pluginLib before loading plugins.'
      );
    }

    const pluginLib = (() => {
      const lib = typeof globalThis === 'undefined' ? undefined : globalThis.pluginLib;
      if (!lib) {
        throw new Error(
          'headlamp-access-control-view: globalThis.pluginLib is unavailable, so the Headlamp ' +
            'plugin registry cannot be reached. The console publishes it before loading plugins.'
        );
      }
      return lib;
    })();

    /** React and the registry are published at the top level and under `Headlamp`. */
    const target =
      pluginLib.registerRoute || pluginLib.registerSidebarEntry ? pluginLib : pluginLib.Headlamp;
    if (!target || (!target.registerRoute && !target.registerSidebarEntry)) {
      throw new Error(missing('registerRoute'));
    }

    const react = pluginLib.React;
    if (!react || typeof react.createElement !== 'function') {
      throw new Error(missing('React.createElement'));
    }

    /**
     * The element factory under its short name.
     *
     * This build concatenates every module into one shared function scope, so a name
     * declared at the top level of two modules is a SyntaxError in the console, not
     * a shadowed binding, and a plugin that throws while loading is still listed as
     * installed. The alias is declared here, once, in the module every other module
     * already depends on.
     */
    const h = react.createElement;

    function hook(name) {
      const value = react[name];
      if (typeof value !== 'function') {
        throw new Error(missing(`React.${name}`));
      }
      return value;
    }

    const useState = hook('useState');
    const useEffect = hook('useEffect');
    const useCallback = hook('useCallback');
    const useMemo = hook('useMemo');
    const useRef = hook('useRef');

    const apiRequest = pluginLib.ApiProxy && pluginLib.ApiProxy.request;
    if (typeof apiRequest !== 'function') {
      throw new Error(missing('ApiProxy.request'));
    }

    /**
     * The console's cluster-aware request function, handed to fetch.js only.
     *
     * Headlamp adds `/clusters/<current-cluster>` to the path there and forwards
     * the call through its own backend, which is what keeps the browser from having
     * to know any cluster address. A raw fetch of a Kubernetes path would instead
     * hit Headlamp's own routes and can return HTML for a JSON document.
     */
    function clusterAwareRequest(path, init, queryParams) {
      return apiRequest(path, init, false, true, queryParams);
    }

    /**
     * The console's same-origin request function, handed to fetch.js only.
     *
     * The access-change API is reached at a path on the console's own origin, not
     * under a cluster prefix, so the request goes out with no cluster segment and
     * with automatic login disabled: an unauthenticated API response must surface
     * as a JSON refusal the page can render, never as a redirect into a login flow
     * that would hide which authorization actually failed.
     */
    function sameOriginRequest(path, init, queryParams) {
      return apiRequest(path, init, false, false, queryParams);
    }

    function registerSidebarEntry(entry) {
      const register = target.registerSidebarEntry;
      if (!register) {
        throw new Error(missing('registerSidebarEntry'));
      }
      register(entry);
    }

    function registerRoute(route) {
      const register = target.registerRoute;
      if (!register) {
        throw new Error(missing('registerRoute'));
      }
      register(route);
    }

    /**
     * Component lookup, resolved lazily.
     *
     * The page renders Headlamp's own components rather than shipping a second copy
     * of the design system, so a theme change in the console is reflected here. A
     * missing component is fatal to this page and reported as such, because a
     * silently unstyled page would be worse than an explicit error.
     */
    function component(path) {
      const parts = path.split('.');
      let current = pluginLib;
      for (const part of parts) {
        if (!current) {
          throw new Error(missing(path));
        }
        current = current[part];
      }
      if (!current) {
        throw new Error(missing(path));
      }
      return current;
    }

    const Alert = component('MuiMaterial.Alert');
    const Box = component('MuiMaterial.Box');
    const Button = component('MuiMaterial.Button');
    const Checkbox = component('MuiMaterial.Checkbox');
    const Chip = component('MuiMaterial.Chip');
    const CircularProgress = component('MuiMaterial.CircularProgress');
    const Dialog = component('MuiMaterial.Dialog');
    const DialogActions = component('MuiMaterial.DialogActions');
    const DialogContent = component('MuiMaterial.DialogContent');
    const DialogContentText = component('MuiMaterial.DialogContentText');
    const DialogTitle = component('MuiMaterial.DialogTitle');
    const FormControlLabel = component('MuiMaterial.FormControlLabel');
    const FormHelperText = component('MuiMaterial.FormHelperText');
    const Link = component('MuiMaterial.Link');
    const MenuItem = component('MuiMaterial.MenuItem');
    const Paper = component('MuiMaterial.Paper');
    const Table = component('MuiMaterial.Table');
    const TableBody = component('MuiMaterial.TableBody');
    const TableCell = component('MuiMaterial.TableCell');
    const TableContainer = component('MuiMaterial.TableContainer');
    const TableHead = component('MuiMaterial.TableHead');
    const TableRow = component('MuiMaterial.TableRow');
    const TextField = component('MuiMaterial.TextField');
    const Typography = component('MuiMaterial.Typography');

    /**
     * The cluster the console is currently showing.
     *
     * `Utils.getCluster` is the console's own resolver and the only supported way
     * to learn it; window.location is not inspected. It returns '' rather than
     * throwing when the console exposes no Utils, when the resolver is absent, when
     * it throws, or when it reports no cluster. Callers must treat '' as "no
     * cluster": no scope may be verified and no cluster-scoped link may render.
     */
    function activeCluster() {
      const utils = pluginLib.Utils || (target && target.Utils);
      const resolve = utils && utils.getCluster;
      if (typeof resolve !== 'function') {
        return '';
      }
      let resolved;
      try {
        resolved = resolve();
      } catch (error) {
        return '';
      }
      return typeof resolved === 'string' ? resolved : '';
    }

    const PLUGIN_PATH = ROUTE_PATH;
    const PLUGIN_SIDEBAR = SIDEBAR_NAME;

      // ---- src/errors.js ----
    // One safe error normalizer for every failure the Headlamp request wrapper and
    // the access-change API can produce.
    //
    // The wrapper rejects with different shapes depending on where the failure came
    // from (a Headlamp transport error, a JSON refusal from the access-change API,
    // a bare non-2xx), and none of those shapes is guaranteed to carry a readable
    // message. This module reduces them all to one shape with a guaranteed non-empty
    // message, so the UI can never render "undefined", "null" or "[object Object]".
    //
    // It is also the last line of defence against leaking secret material: it never
    // surfaces an OpenBao response, a token, a credential path, a hash or a
    // password, and an unrecognised object yields a fixed fallback instead of a
    // stringified body.

    const UNREADABLE = new Set(['', 'undefined', 'null', '[object object]']);

    /** The first non-empty, readable string among the candidates. */
    function firstString(...values) {
      for (const value of values) {
        if (typeof value !== 'string') {
          continue;
        }
        const trimmed = value.trim();
        if (trimmed !== '' && !UNREADABLE.has(trimmed.toLowerCase())) {
          return trimmed;
        }
      }
      return '';
    }

    /** Reduce an arbitrary value to a readable string or the empty string. */
    function readable(value) {
      if (value === undefined || value === null) {
        return '';
      }
      if (typeof value === 'string') {
