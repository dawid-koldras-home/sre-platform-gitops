          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 85.90.247.96/32
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: audit-sink
      podSelector:
        matchLabels:
            app.kubernetes.io/name: audit-sink
    ports:
    - protocol: TCP
      port: 8443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gatus
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: gatus
          app.kubernetes.io/name: gatus
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: holmes
      podSelector:
        matchLabels:
          app: holmes
    ports:
    - protocol: TCP
      port: 5050
