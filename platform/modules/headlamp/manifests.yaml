        - --audit-sink-url=https://audit-sink.audit-sink.svc.cluster.local:8443
        - --audit-sink-ca-file=/etc/identity-bridge/audit-ca/ca.crt
        - --audit-token-path=/etc/identity-bridge/audit-token/token
        - --bridge-image-digest=ghcr.io/dawid-koldras-home/sre-platform-headlamp-identity-bridge@sha256:05046aedb19505ff632b21a1e3a7a9104371010587de1c7dd9ace1ea1f92b59b
        - --audit-impersonating-namespace=headlamp
        - --audit-impersonating-name=sre-identity-bridge
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
