          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: allow-list
          mountPath: /etc/identity-bridge
          readOnly: true
        - name: identity-state
          mountPath: /etc/identity-bridge-identities
