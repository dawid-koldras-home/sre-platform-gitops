    function parseIpLiteral(text) {
      if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(text)) {
        // An IPv6 literal. The resolver refuses loopback (::1), link-local (fe80::/10) and
        // unspecified (::); unique-local and IPv4-mapped private space are treated as private
        // here so the browser cannot be the more permissive of the two.
        const lower = text.toLowerCase();
        const mapped = /^::ffff:(\d{1,3}(?:\.\d{1,3}){3})$/.exec(lower);
        if (mapped) {
          return { ...classifyIpv4(mapped[1]), loopback: false, linkLocal: false, unspecified: false };
        }
        return {
          loopback: lower === '::1',
          linkLocal: /^fe[89ab][0-9a-f]:/.test(lower),
          unspecified: lower === '::',
          private: lower.startsWith('fc') || lower.startsWith('fd') || lower.startsWith('fe80:'),
