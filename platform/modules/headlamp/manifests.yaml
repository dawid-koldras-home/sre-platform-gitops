    function EditorSection({ discovery, onChanged }) {
      const [list, setList] = useState({ loading: true, ok: false, entries: [], reason: '', message: '' });
      const [mode, setMode] = useState('idle');
      const [operation, setOperation] = useState('create');
      const [form, setForm] = useState(emptyEntry());
      const [original, setOriginal] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirming, setConfirming] = useState(false);
      const [submitError, setSubmitError] = useState('');
      const [status, setStatus] = useState(null);
      const [statusError, setStatusError] = useState(null);
      const pollerRef = useRef(null);

      const revision = discovery && discovery.revision ? String(discovery.revision) : '';

      const loadList = useCallback(async () => {
        setList(previous => ({ ...previous, loading: true }));
        const result = await fetchEditorPolicies();
        if (!result.ok) {
          setList({ loading: false, ok: false, entries: [], reason: result.reason, message: result.message || '' });
          return;
        }
        const entries = result.payload && Array.isArray(result.payload.policies) ? result.payload.policies : [];
        setList({ loading: false, ok: true, entries, reason: '', message: '' });
      }, []);

      useEffect(() => {
        loadList();
      }, [loadList]);

      useEffect(() => () => {
        if (pollerRef.current) {
          pollerRef.current.stop();
          pollerRef.current = null;
        }
      }, []);

      const errors = useMemo(() => validateEntry(form, null).errors, [form]);
      const preview = useMemo(() => {
        try {
          return impactPreview(operation, form, original);
        } catch (error) {
          return null;
        }
      }, [operation, form, original]);

      const startCreate = () => {
        setOperation('create');
        setForm(emptyEntry());
        setOriginal(null);
        setSubmitError('');
        setStatus(null);
        setStatusError(null);
        setMode('edit');
      };

      const startEdit = async name => {
        setBusy(true);
        setSubmitError('');
        const result = await fetchEditorPolicy(name);
        setBusy(false);
        if (!result.ok) {
          setSubmitError(result.message || 'The entry could not be read.');
          return;
        }
        const entry = result.payload && result.payload.policy ? result.payload.policy : null;
        setOperation('update');
        setOriginal(entry);
        setForm(entryToForm(entry));
        setStatus(null);
        setStatusError(null);
        setMode('edit');
      };

      const startDelete = entry => {
        setOperation('delete');
        setOriginal(entry);
        setForm(entryToForm(entry));
        setSubmitError('');
        setStatus(null);
        setStatusError(null);
        setConfirming(true);
      };

      const cancel = () => {
        setMode('idle');
        setConfirming(false);
        setSubmitError('');
      };

      const submit = async () => {
        setConfirming(false);
        setBusy(true);
        setSubmitError('');
        setStatus(null);
        setStatusError(null);
        const policy = operation === 'delete' ? null : canonicalEntry(form);
        const name = form.name;
        const result = await submitChange(operation, policy, name);
        setBusy(false);
        if (!result.ok) {
          setSubmitError(result.message || `The API refused the change request (${result.reason}).`);
          return;
        }
        const request = result.payload && result.payload.request ? result.payload.request : null;
        const initial = describeRequest(request);
        setStatus(initial);
        setMode('idle');
        if (pollerRef.current) {
          pollerRef.current.stop();
        }
        if (initial.id) {
          const poller = createStatusPoller({
            requestId: initial.id,
            fetchStatus: fetchRequestStatus,
            onUpdate: update => {
              setStatus(update.change);
              setStatusError(update.error && update.change ? null : update.error);
            },
            onDone: update => {
              if (update.change) {
                setStatus(update.change);
              }
              if (update.error && !update.change) {
                setStatusError(update.error);
              }
              if (update.change && update.change.terminal) {
                loadList();
                if (typeof onChanged === 'function') {
                  onChanged();
                }
              }
            }
          });
          pollerRef.current = poller;
          poller.start();
        }
      };

      const entryRows = list.entries.map(entry =>
        h(
          TableRow,
          { key: `entry-${entry.name}`, hover: true },
          h(TableCell, null, entry.name),
          h(TableCell, null, (entry.subjects || []).map(subjectText).join(', ')),
          h(TableCell, null, entry.role),
          h(TableCell, null, entry.scope && entry.scope.clusterWide ? 'cluster-wide' : (entry.scope && entry.scope.namespaces || []).join(', ')),
          h(
            TableCell,
            null,
            h(
              Box,
              { sx: { display: 'flex', gap: 1 } },
              h(Button, { size: 'small', onClick: () => startEdit(entry.name) }, 'Edit'),
              h(Button, { size: 'small', color: 'error', onClick: () => startDelete(entry) }, 'Delete')
            )
          )
        )
      );

      const listBody = list.loading
        ? h(CircularProgress, { size: 20 })
        : list.ok
          ? entryRows.length > 0
            ? h(
                TableContainer,
                { component: Paper, variant: 'outlined' },
                h(
                  Table,
                  { size: 'small' },
                  h(
                    TableHead,
                    null,
                    h(
                      TableRow,
                      null,
                      h(TableCell, null, 'Name'),
                      h(TableCell, null, 'Subjects'),
                      h(TableCell, null, 'Role'),
                      h(TableCell, null, 'Scope'),
                      h(TableCell, null, 'Actions')
                    )
                  ),
                  h(TableBody, null, entryRows)
                )
              )
            : h(Typography, { variant: 'body2' }, 'This installation has no AccessPolicy entries.')
          : h(Alert, { severity: 'warning' }, `The entries could not be read: ${list.message || list.reason}.`);

      return h(
        Box,
        { key: 'editor' },
        h(Typography, { variant: 'h5', sx: { mt: 3, mb: 1 } }, 'AccessPolicy editor'),
        h(
          Typography,
          { variant: 'body2', sx: { mb: 1 } },
          'Create, change and remove AccessPolicy entries through the reviewed Git transaction of ' +
            'the access-change API. Every submission requires approval before it takes effect; this ' +
            'page does not commit anything itself.'
        ),
        mode === 'idle'
          ? h(
              Box,
              null,
              h(
                Box,
                { sx: { display: 'flex', gap: 2, alignItems: 'center', mb: 2 } },
                h(Button, { variant: 'contained', onClick: startCreate }, 'New policy'),
                h(Button, { color: 'inherit', onClick: loadList }, 'Reload'),
                revision ? h(Chip, { size: 'small', label: `revision ${revision}` }) : null
              ),
              listBody,
              h(StatusPanel, { status, error: statusError }),
              submitError ? h(Alert, { severity: 'error', sx: { mt: 2 } }, submitError) : null
            )
          : h(
              Box,
              null,
              h(EditorForm, {
                operation,
                form,
                setForm,
                errors,
                busy,
                onSubmit: () => setConfirming(true),
                onCancel: cancel
              }),
              h(PreviewPanel, { preview }),
              submitError ? h(Alert, { severity: 'error', sx: { mt: 2 } }, submitError) : null,
              h(
                Dialog,
                { open: confirming, onClose: () => setConfirming(false) },
                h(DialogTitle, null, `Confirm ${operation} of ${form.name || 'the entry'}`),
                h(
                  DialogContent,
                  null,
                  h(
                    DialogContentText,
                    null,
                    'This submits one change request to the access-change API. It is committed through ' +
                      'a reviewed Git transaction and requires approval before it takes effect.'
                  ),
                  h(PreviewPanel, { preview })
                ),
                h(
                  DialogActions,
                  null,
                  h(Button, { onClick: () => setConfirming(false) }, 'Back'),
                  h(Button, { variant: 'contained', color: operation === 'delete' ? 'error' : 'primary', onClick: submit }, 'Submit for approval')
                )
              )
            )
      );
    }

      // ---- src/users.js ----
    // Declarative managed-identity lifecycle for the existing Access control view.
    //
    // This component never writes Git, Kubernetes or OpenBao directly. It uses the
    // four closed access-change-api routes: list, credential provisioning, impact
    // preview and identity request. Password fields are cleared immediately after
    // the provisioning request settles; only the structural credential reference
    // may advance to preview and submit.


    const EMPTY_DRAFT = {
      identityID: '',
      displayLabel: '',
      email: '',
      groups: '',
      password: '',
      confirmation: ''
    };

    // A credential rotation is not an identity change: the declaration in Git already
    // carries the credential reference, so only the hash in the store moves. Keeping it
    // in its own small draft is what makes that visible in the UI - the password never
    // enters the form that produces a Git commit.
    const EMPTY_CREDENTIAL_DRAFT = {
      password: '',
      confirmation: ''
    };

    function splitGroups(value) {
      return String(value)
        .split(/[\n,]/)
        .map(group => group.trim())
        .filter((group, index, all) => group !== '' && all.indexOf(group) === index)
        .sort();
    }

    // The API and the shared Go validator are authoritative. This is a
    // deliberately conservative pre-check so a missing or obviously malformed
    // mailbox is refused before the credential-provisioning request writes anything:
    // provisioning a password for an identity that cannot register MFA would leave
    // a usable first factor with no second factor, which is the defect TASK-224
    // exists to close.
    const EMAIL_PATTERN = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$/;

    function validEmail(value) {
      const email = String(value || '').trim();
      if (email === '' || email.length > 254) {
        return false;
      }
      if (!EMAIL_PATTERN.test(email) || email.includes('..')) {
        return false;
      }
      const [local, domain] = email.split('@');
      if (local.length > 64 || local.startsWith('.') || local.endsWith('.')) {
        return false;
      }
      return domain
        .split('.')
        .every(label => label !== '' && label.length <= 63 && !label.startsWith('-') && !label.endsWith('-'));
    }

    function errorText(result, fallback) {
      if (result && typeof result.message === 'string' && result.message !== '') {
        return result.message;
      }
      return fallback;
    }

    // Delivery watching is bounded on purpose: the panel never spins forever and
    // never claims a change is usable when Argo CD has not applied it.
    const DELIVERY_POLL_MS = 5000;
    const DELIVERY_WATCH_MS = 5 * 60 * 1000;

    function deliveryNotice(delivery) {
      const state = delivery && typeof delivery.state === 'string' ? delivery.state : '';
      if (state === 'applied') {
        return {
          severity: 'info',
          text:
            'Argo CD has applied the commit carrying this identity declaration. Authelia reloads its user database within about a minute of that, so a newly created or changed password works from then on.'
        };
      }
      if (state === 'pending') {
        return {
          severity: 'warning',
          text:
            'Committed to Git, not applied yet: Argo CD has not synced the commit that carries this identity declaration. A new user cannot sign in to Authelia until it is applied, so do not hand the password over before this banner clears.'
        };
      }
      if (state === 'unavailable') {
        return {
          severity: 'warning',
          text:
            'The GitOps application state could not be read, so this panel cannot tell you whether the change reached the cluster. Treat the change as not yet delivered and check Argo CD.'
        };
      }
      return null;
    }

    function stateTone(value) {
      if (value === 'enabled' || value === 'declared' || value === 'verified') {
        return 'success';
      }
      if (value === 'disabled' || value === 'pending' || value === 'not_observed') {
        return 'warning';
      }
      return 'default';
    }

    function PreviewPanel({ preview, request, busy, onSubmit, onCancel }) {
      if (!preview || !request) {
        return null;
      }
      const destructive = preview.reduces_access === true || request.operation === 'remove';
      const facts = [
        `email: ${(preview.after && preview.after.email) || 'none'}`,
        `groups added: ${(preview.groups_added || []).join(', ') || 'none'}`,
        `groups removed: ${(preview.groups_removed || []).join(', ') || 'none'}`,
        `roles gained: ${(preview.roles_gained || []).join(', ') || 'none'}`,
        `roles lost: ${(preview.roles_lost || []).join(', ') || 'none'}`,
        `materialization: ${preview.materialization || 'preview_only'}`,
        `session revocation: ${preview.session_revocation || 'not_required'}`
      ];
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mt: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true }, `Review ${request.operation} for ${request.identity_id}`),
        destructive
          ? h(Alert, { severity: 'warning', sx: { mb: 2 } }, 'This change reduces access. Review it before confirming.')
          : null,
        h(Typography, { variant: 'body2', sx: { whiteSpace: 'pre-line' } }, facts.join('\n')),
        h(
          Box,
          { sx: { display: 'flex', gap: 1, mt: 2 } },
          h(Button, { variant: 'contained', color: destructive ? 'warning' : 'primary', disabled: busy, onClick: onSubmit }, busy ? 'Submitting…' : 'Confirm and submit'),
          h(Button, { disabled: busy, onClick: onCancel }, 'Cancel')
        )
      );
    }

    function IdentityForm({ mode, draft, setDraft, busy, onPreview, onCancel }) {
      if (mode === '') {
        return null;
      }
      const creating = mode === 'create';
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mt: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true }, creating ? 'Add user' : `Edit ${draft.identityID}`),
        h(
          Box,
          { sx: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(220px, 1fr))', gap: 2 } },
          h(TextField, {
            label: 'Identity ID',
            value: draft.identityID,
            disabled: !creating,
            onChange: event => setDraft({ ...draft, identityID: event.target.value })
          }),
          h(TextField, {
            label: 'Display label',
            value: draft.displayLabel,
            onChange: event => setDraft({ ...draft, displayLabel: event.target.value })
          }),
          h(TextField, {
            label: 'Email',
            type: 'email',
            value: draft.email,
            required: creating,
            helperText: creating
              ? 'Required before the credential is provisioned; Authelia cannot register MFA without it.'
              : 'Leave blank to keep the current mailbox.',
            autoComplete: 'off',
            onChange: event => setDraft({ ...draft, email: event.target.value })
          }),
          h(TextField, {
            label: 'Groups',
            value: draft.groups,
            helperText: 'Comma-separated declarative groups.',
            onChange: event => setDraft({ ...draft, groups: event.target.value })
          }),
          creating
            ? h(TextField, {
                label: 'Initial password',
                type: 'password',
                value: draft.password,
                autoComplete: 'new-password',
                onChange: event => setDraft({ ...draft, password: event.target.value })
              })
            : null,
          creating
            ? h(TextField, {
                label: 'Confirm password',
                type: 'password',
                value: draft.confirmation,
                autoComplete: 'new-password',
                onChange: event => setDraft({ ...draft, confirmation: event.target.value })
              })
            : null
        ),
        h(
          Box,
          { sx: { display: 'flex', gap: 1, mt: 2 } },
          h(Button, { variant: 'contained', disabled: busy, onClick: onPreview }, busy ? 'Preparing…' : creating ? 'Provision and preview' : 'Preview update'),
          h(Button, { disabled: busy, onClick: onCancel }, 'Cancel')
        )
      );
    }

    // CredentialForm sets or replaces the first factor of an identity that already
    // exists in the declaration.
    //
    // It is a separate form from IdentityForm on purpose. Provisioning a credential does
    // not commit to Git - the declaration already names the credential reference - so a
    // password typed here must never be able to reach the identity-preview or
    // identity-submit routes. The two fields are cleared by the caller as soon as the
    // request settles, whatever it returned.
    function CredentialForm({ identity, draft, setDraft, busy, onSubmit, onCancel }) {
      if (!identity) {
        return null;
      }
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mt: 2 } },
        h(Typography, { variant: 'h6', gutterBottom: true }, `Set password for ${identity.id}`),
        h(
          Typography,
          { variant: 'body2', sx: { mb: 2 } },
          'The password is written straight to the credential store as a hash. It is never sent to Git, never stored in the browser and never shown again. The identity declaration in Git does not change.'
        ),
        identity.email
          ? null
          : h(
              Alert,
              { severity: 'warning', sx: { mb: 2 } },
              'This identity has no mailbox, so Authelia cannot register a second factor for it. Set an email on the identity before this password is used for sign-in.'
            ),
        h(
          Box,
          { sx: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(220px, 1fr))', gap: 2 } },
          h(TextField, {
            label: 'New password',
            type: 'password',
            value: draft.password,
            autoComplete: 'new-password',
            onChange: event => setDraft({ ...draft, password: event.target.value })
          }),
          h(TextField, {
            label: 'Confirm new password',
            type: 'password',
            value: draft.confirmation,
            autoComplete: 'new-password',
            onChange: event => setDraft({ ...draft, confirmation: event.target.value })
          })
        ),
        h(
          Box,
          { sx: { display: 'flex', gap: 1, mt: 2 } },
          h(Button, { variant: 'contained', disabled: busy, onClick: onSubmit }, busy ? 'Writing…' : 'Set password'),
          h(Button, { disabled: busy, onClick: onCancel }, 'Cancel')
        )
      );
    }

    function UsersSection({ canSubmit, onChanged, mfaSelfServiceURL }) {
      const [state, setState] = useState({ loading: true, identities: [], revision: '', delivery: null, error: '' });
      const [mode, setMode] = useState('');
      const [draft, setDraft] = useState({ ...EMPTY_DRAFT });
      const [preview, setPreview] = useState(null);
      const [pendingRequest, setPendingRequest] = useState(null);
      const [busy, setBusy] = useState(false);
      const [notice, setNotice] = useState(null);
      const [watching, setWatching] = useState(false);
      const [credentialTarget, setCredentialTarget] = useState(null);
      const [credentialDraft, setCredentialDraft] = useState({ ...EMPTY_CREDENTIAL_DRAFT });
      const secretDraft = useRef({ password: '', confirmation: '' });
      const credentialDraftRef = useRef({ password: '', confirmation: '' });
      const watchTimer = useRef(null);
      const watchBusy = useRef(false);

      useEffect(() => {
        secretDraft.current.password = draft.password;
        secretDraft.current.confirmation = draft.confirmation;
      }, [draft.password, draft.confirmation]);

      useEffect(() => {
        credentialDraftRef.current.password = credentialDraft.password;
        credentialDraftRef.current.confirmation = credentialDraft.confirmation;
      }, [credentialDraft.password, credentialDraft.confirmation]);

      useEffect(() => () => {
        secretDraft.current.password = '';
        secretDraft.current.confirmation = '';
        credentialDraftRef.current.password = '';
        credentialDraftRef.current.confirmation = '';
      }, []);

      const stopDeliveryWatch = useCallback(() => {
        if (watchTimer.current) {
          clearInterval(watchTimer.current);
          watchTimer.current = null;
        }
        watchBusy.current = false;
        setWatching(false);
      }, []);

      // The watcher is a plain interval that reads the existing identity list. It
      // holds no request state and is cleared on unmount, so leaving the page never
      // leaves a poll running.
      useEffect(
        () => () => {
          if (watchTimer.current) {
            clearInterval(watchTimer.current);
            watchTimer.current = null;
          }
        },
        []
      );

      const load = useCallback(async () => {
        setState(previous => ({ ...previous, loading: true, error: '' }));
