apiVersion: v1
data:
  main.js: |
    // headlamp-access-control-view — first-party Headlamp plugin, built from committed source.
    // Generated by build.mjs. Do not edit: edit src/*.js and rebuild.
    // Entry: view.js. Build inputs are hashed in ../../../plugins.lock.yaml.
    (function () {
      'use strict';
      // ---- src/contract.js ----
    // The access-control view contract: routes, the request manifest and the
    // identity allowlist.
    //
    // ## The request manifest is the security boundary
    //
    // REQUESTS below is the complete, closed list of every runtime call this plugin
    // can make. It is machine-read twice:
    //
    //   - at runtime by fetch.js, which is the only module allowed to call the
    //     console's API proxy, and which refuses any request id that is not declared
    //     here; and
    //   - at build time by TestHeadlampAccessViewRequestsMatchTheViewerBaseline in
    //     internal/resolver, which parses this literal, asserts the exact expected
    //     entry set, and proves every Kubernetes entry is authorised by a rule the
    //     installer already renders into the headlamp-read-only ClusterRole. Adding
    //     a request anywhere in the plugin therefore fails the Go test until the
    //     manifest is extended deliberately and the baseline comparison passes
    //     again.
    //
    // The manifest is a JSON literal on purpose, so the Go test extracts it with a
    // single regex and one json.Unmarshal rather than executing JavaScript.
    //
    // ## Why /me is not a Kubernetes request
    //
    // The signed-in identity comes from the console's own `/me` endpoint, which
    // Headlamp's backend serves from the Authelia forward-auth headers
    // (Remote-User, remote groups) of the operator's session. It is served on the
    // Headlamp backend, not by the API server, so reading it costs no RBAC review,
    // touches no Kubernetes resource and cannot widen the cluster permission set.
    // Only username and groups are read from the response; see IDENTITY_FIELDS.
    //
    // ## Why the inventory is one named GET in one namespace
    //
    // The policy inventory is a single ConfigMap the installer renders at a fixed
    // name in the headlamp namespace when (and only when) this plugin is enabled.
    // The manifest declares exactly that one get. There is no list, no watch, no
    // second namespace and no other ConfigMap anywhere in this plugin, so a payload
    // that could fetch a foreign installation's inventory has no request to make:
    // tenant scoping is enforced by the read path, not by client-side filtering of
    // a shared document.

