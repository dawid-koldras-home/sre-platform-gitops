     *
     * Reports a class and a port, never a hostname. The plan is rendered, copied and pasted, so
     * anything that named a target would put customer topology into a string designed to be
     * shared. An in-cluster target is described as `cluster-internal` and an address literal or
     * public name as `public`, which is the distinction the NetworkPolicy actually cares about:
     * the first narrows egress to one namespace, the second cannot.
     *
     * @returns `{ klass, explicitPort, schemeDefaultPort, port, source }` where `source` is
     * `explicit`, `scheme-default` or `none`, and `klass` is `public`, `cluster-internal`,
     * `unknown` (a host the rules rejected) or `unset` (no usable target at all).
     *
     * `unset` and `unknown` are deliberately different. A row the operator has not filled in yet
     * is not a target, and counting it as one would make the plan claim egress that no endpoint
     * grants. A row whose host the rules rejected is a target the plan must not describe as
     * public, because that would understate what the operator is trying to point at.
