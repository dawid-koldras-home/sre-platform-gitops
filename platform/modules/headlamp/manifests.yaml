apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    helm.sh/chart: headlamp-0.43.0
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp
    app.kubernetes.io/version: "0.43.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp
  template:
    metadata:
      annotations:
        sre.platform.io/headlamp-plugins-sha256: 2dc3683ad067e080f3eda60d4fecc9b8e154412cc78b02dc66ab1b6f1b23227d
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/instance: headlamp
    spec:
      serviceAccountName: headlamp
      automountServiceAccountToken: true
      hostUsers: true
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headlamp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 100
          image: "ghcr.io/headlamp-k8s/headlamp:v0.43.0"
          imagePullPolicy: IfNotPresent
          
          env:
            - name: HEADLAMP_MODE
              value: local
          args:
            - "-in-cluster"
            - "-in-cluster-context-name=main"
            - "-plugins-dir=/headlamp/plugins"
            - "-session-ttl=86400"
            # Check if externalSecret is disabled
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          livenessProbe:
            httpGet:
              path: "/"
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/"
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /headlamp/plugins/argocd
              name: plugin-argocd
              readOnly: true
            - mountPath: /headlamp/plugins/opencost
              name: plugin-opencost
              readOnly: true
            - name: headlamp-tmp
              mountPath: /tmp
      volumes:
        - name: headlamp-tmp
          emptyDir: {}
        - configMap:
            defaultMode: 420
            items:
            - key: main.js
              path: main.js
            - key: package.json
              path: package.json
            name: headlamp-plugin-argocd
          name: plugin-argocd
        - configMap:
            defaultMode: 420
            items:
            - key: main.js
              path: main.js
            - key: package.json
              path: package.json
            name: headlamp-plugin-opencost
          name: plugin-opencost

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ui
  namespace: headlamp
  labels:
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
    sre.platform.io/component: headlamp
  annotations:
    sre-platform.io/ingress-type: headlamp-ui
spec:

  ingressClassName: nginx
  rules:
    - host: headlamp.139.162.145.158.nip.io
      http:
        paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: headlamp
                 port:
                   number: 80