    function PreviewPanel({ preview }) {
      if (!preview) {
        return null;
      }
      return h(
        Paper,
        { variant: 'outlined', sx: { p: 2, mt: 2 } },
        h(Typography, { variant: 'subtitle1' }, `Impact of ${preview.operation} on ${preview.policyName || 'the entry'}`),
        h(Typography, { variant: 'body2', sx: { mt: 1 } }, `Subjects: ${preview.subjects.join(', ') || 'none'}`),
        h(Typography, { variant: 'body2' }, `Scope: ${preview.scope || 'none'}`),
        preview.gainedRoles.length > 0
          ? h(Typography, { variant: 'body2', color: 'warning.main' }, `Grants: ${preview.gainedRoles.join(', ')}`)
          : null,
