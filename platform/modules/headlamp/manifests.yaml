          // breaches the threshold has already failed the timeout, so the condition could
          // never report a slow-but-answering endpoint.
          problems.push(
            problem('maxResponseTimeMs', `must be shorter than timeout (${canonicalDuration(timeoutMs)})`)
          );
        }
      }

      if (draft.certificateExpiry !== undefined && draft.certificateExpiry !== null && draft.certificateExpiry !== '') {
        const hours = parseWindowHours(draft.certificateExpiry);
        if (hours === null) {
          problems.push(
            problem('certificateExpiry', `must be a duration in ${CONTRACT.hoursUnits.join(' or ')}, got "${draft.certificateExpiry}"`)
          );
        } else if (hours < 1 || hours > CONTRACT.maxCertificateWindowHours) {
          problems.push(
            problem(
              'certificateExpiry',
              `must be between 1h and ${CONTRACT.maxCertificateWindowHours} h (90d), got "${draft.certificateExpiry}"`
            )
