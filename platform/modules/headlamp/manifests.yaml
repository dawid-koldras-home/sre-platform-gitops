      }

      if (draft.maxResponseTimeMs !== undefined && draft.maxResponseTimeMs !== null && draft.maxResponseTimeMs !== '') {
        const value = draft.maxResponseTimeMs;
        if (!Number.isInteger(value) || value < 1 || value > CONTRACT.maxResponseTimeMs) {
          problems.push(
            problem('maxResponseTimeMs', `must be between 1 and ${CONTRACT.maxResponseTimeMs} milliseconds`)
          );
        } else if (typeof timeoutMs === 'number' && value >= timeoutMs) {
