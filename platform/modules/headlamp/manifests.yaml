      if (octets.some(octet => !Number.isInteger(octet) || octet < 0 || octet > 255)) {
        return { loopback: true, linkLocal: false, unspecified: false, private: true };
      }
      const [a, b] = octets;
      return {
        loopback: a === 127,
        linkLocal: a === 169 && b === 254,
        unspecified: a === 0,
        private: a === 10 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168),
      };
    }

    /**
