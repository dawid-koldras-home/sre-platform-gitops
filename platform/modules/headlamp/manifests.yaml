    // Runtime access to the Headlamp console.
    //
    // Headlamp 0.43.0 loads every plugin by evaluating its `main.js` as a bare
    // function body: the loader calls `new Function(source)()`. That is neither
    // CommonJS nor an ES module, so `module`, `exports` and `require` are all
    // undefined inside it. A payload that expects them throws before it registers
    // anything, while the console still lists the plugin from its package.json. So
