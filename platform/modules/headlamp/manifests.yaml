      // ---- src/rbacobs.js ----
    // The observed-RBAC read: what the API server currently holds for the objects
    // this platform rendered.
    //
    // Two list requests, both narrowed by the platform's rendered-object label
    // selector, both authorised by the read-only rules the installer already puts
    // in the headlamp-read-only ClusterRole (roles and clusterroles, get/list/watch,
    // no write verbs and no impersonation anywhere). This is the authoritative half
    // of the freshness comparison: the inventory says what should exist, this read
    // says what does exist, and the page reports any disagreement rather than
    // trusting either document alone.
    //
    // Only what the comparison and the display need is kept: kind, name, namespace,
    // the generation, the platform annotations and the rules. Every other field the
    // API server returns — resourceVersion, managedFields, creationTimestamp,
    // managed metadata — is dropped here so nothing in the browser outlives its
    // purpose.


    // The platform annotation keys compared against the inventory. They are the
    // annotations every rendered definition carries, so an object whose annotations
    // moved while the inventory did not (or the reverse) is detected as stale
    // instead of silently agreeing.
    const COMPARED_ANNOTATIONS = [
      'platform.sre-platform.io/access-contract',
      'platform.sre-platform.io/access-matrix-digest',
      'platform.sre-platform.io/access-role',
      'platform.sre-platform.io/access-scope',
      'platform.sre-platform.io/access-policies',
      'platform.sre-platform.io/access-rule-ids'
    ];

    function pickObservedObject(item) {
      if (!item || typeof item !== 'object') {
        return null;
      }
      const metadata = item.metadata;
      if (!metadata || typeof metadata.name !== 'string') {
        return null;
      }
      const annotations = {};
      const source = metadata.annotations || {};
      for (let index = 0; index < COMPARED_ANNOTATIONS.length; index += 1) {
        const key = COMPARED_ANNOTATIONS[index];
        if (typeof source[key] === 'string') {
          annotations[key] = source[key];
        }
      }
      return {
        kind: item.kind === 'Role' ? 'Role' : 'ClusterRole',
        name: metadata.name,
        namespace: typeof metadata.namespace === 'string' ? metadata.namespace : '',
        generation: typeof metadata.generation === 'number' ? metadata.generation : 0,
        annotations: annotations,
        rules: Array.isArray(item.rules) ? item.rules : []
      };
    }

    function pickList(payload) {
      if (!payload || typeof payload !== 'object' || !Array.isArray(payload.items)) {
        return null;
      }
      const objects = [];
      for (let index = 0; index < payload.items.length; index += 1) {
        const picked = pickObservedObject(payload.items[index]);
        if (picked !== null) {
          objects.push(picked);
        }
      }
      objects.sort((left, right) => {
        if (left.kind !== right.kind) {
          return left.kind < right.kind ? -1 : 1;
        }
        return left.name < right.name ? -1 : left.name > right.name ? 1 : 0;
      });
      return objects;
    }

    /**
     * Read the rendered RBAC objects back from the API server.
     *
     * The two lists are independent on purpose. When one succeeds and the other
     * fails the result is `partial`, with the successful half still usable: a
     * freshness comparison against half the objects is a qualified answer, and the
     * page says so, rather than one failed list discarding a read that worked.
     */
    async function fetchObservedRBAC() {
      const clusterroles = await performRequest('observed-clusterroles');
      const roles = await performRequest('observed-roles');

      if (!clusterroles.ok && !roles.ok) {
        const reason =
          clusterroles.reason === 'unauthorized' || roles.reason === 'unauthorized'
            ? 'unauthorized'
            : clusterroles.reason === 'malformed' || roles.reason === 'malformed'
              ? 'malformed'
              : 'unavailable';
        return {
          ok: false,
          partial: false,
          objects: [],
          reason: reason,
          status: clusterroles.status || roles.status,
          detail: `clusterroles: ${clusterroles.reason}; roles: ${roles.reason}`
        };
      }

      const objects = [];
      const failures = [];
      let unauthorized = false;
      let malformed = false;

      const collect = (result, label) => {
        if (!result.ok) {
          failures.push(`${label}: ${result.reason}`);
          if (result.reason === 'unauthorized') {
            unauthorized = true;
          }
          if (result.reason === 'malformed') {
            malformed = true;
          }
          return;
        }
        const picked = pickList(result.payload);
        if (picked === null) {
          malformed = true;
          failures.push(`${label}: the list was not a Kubernetes list document`);
          return;
        }
        objects.push(...picked);
      };

      collect(clusterroles, 'clusterroles');
      collect(roles, 'roles');

      if (failures.length === 0) {
        return { ok: true, partial: false, objects: objects, reason: '', status: 200, detail: '' };
      }
      return {
        ok: false,
        partial: objects.length > 0,
        objects: objects,
        reason: unauthorized ? 'unauthorized' : malformed ? 'malformed' : 'unavailable',
        status: clusterroles.status || roles.status,
        detail: failures.join('; ')
      };
    }

    const OBSERVED_SELECTOR = RENDERED_OBJECT_SELECTOR;

      // ---- src/status.js ----
    // Freshness: the comparison between what the inventory says was rendered and
    // what the API server says is there.
    //
    // This module is React-free, DOM-free and network-free so the whole state
    // machine is tested directly by node --test with fixtures. It encodes the one
    // rule the task refuses to compromise on: NormalizedJSON and the inventory are
    // advisory inputs, the API server is authoritative, and any disagreement —
    // missing object, unexpected object, moved annotation, changed rules — becomes
    // a visible degraded state rather than being smoothed over. An empty or stale
    // inventory can never look like a healthy, up-to-date one.
    //
    // States, from worst to best:
    //   unauthorized  a read was refused (401/403); nothing can be asserted.
    //   unavailable   no read reached the API server; nothing can be asserted.
    //   missing       the inventory ConfigMap does not exist (404).
    //   malformed     a document arrived that is not the expected envelope.
    //   partial       only part of the observed RBAC could be read, so the
    //                 comparison is qualified and says so.
    //   stale         the observed objects disagree with the inventory.
    //   healthy       every expected object exists with matching annotations and
    //                 rules, and no unexpected rendered object was found.

    const STATE = {
      UNAUTHORIZED: 'unauthorized',
      UNAVAILABLE: 'unavailable',
      MISSING: 'missing',
      MALFORMED: 'malformed',
      PARTIAL: 'partial',
      STALE: 'stale',
      HEALTHY: 'healthy'
    };

    const SEVERITY = [
      STATE.UNAUTHORIZED,
      STATE.UNAVAILABLE,
      STATE.MISSING,
      STATE.MALFORMED,
      STATE.PARTIAL,
      STATE.STALE,
      STATE.HEALTHY
    ];

    /** The identity of a rendered object across the two reads: Kind[/namespace]/name. */
    function objectKey(entry) {
      return `${entry.kind}/${entry.namespace ? `${entry.namespace}/` : ''}${entry.name}`;
    }

    // The identity bridge's RBAC is rendered by the bridge subsystem, not by the
    // AccessPolicy compiler, but it carries the shared rendered-object ownership
    // label so the console can find it. It is intentionally outside the policy
    // inventory, so comparing it would report a healthy installation as stale. The
    // exclusion is the exact access-role marker: every other object, including any
    // policy object beside the bridge, is still compared normally.
    const IDENTITY_BRIDGE_ACCESS_ROLE = 'identity-bridge';
    const ACCESS_ROLE_ANNOTATION = 'platform.sre-platform.io/access-role';

    function isIdentityBridgeObject(entry) {
      return Boolean(
        entry &&
          entry.annotations &&
          entry.annotations[ACCESS_ROLE_ANNOTATION] === IDENTITY_BRIDGE_ACCESS_ROLE
      );
    }

    function annotationEqual(expected, observed) {
      for (const key of Object.keys(expected.annotations)) {
        if (observed.annotations[key] !== expected.annotations[key]) {
          return false;
        }
      }
      for (const key of Object.keys(observed.annotations)) {
        if (expected.annotations[key] === undefined) {
          return false;
        }
      }
      return true;
    }

    function rulesEqual(expected, observed) {
      try {
        return JSON.stringify(expected.rules) === JSON.stringify(observed.rules);
      } catch (error) {
        return false;
      }
    }

    /**
     * Compare the inventory's rendered objects against the observed ones.
     *
     * The comparison is symmetric: an object the cluster holds that the inventory
     * does not describe is as much a disagreement as the reverse, because both
     * mean the two documents are no longer describing the same cluster.
     */
    function compareRendered(inventoryObjects, observedObjects) {
      const expectedByKey = {};
      for (let index = 0; index < inventoryObjects.length; index += 1) {
        expectedByKey[objectKey(inventoryObjects[index])] = inventoryObjects[index];
      }
      const observedByKey = {};
      for (let index = 0; index < observedObjects.length; index += 1) {
        // The bridge's own RBAC is not AccessPolicy state. It stays visible in the
        // observed list but is not part of the symmetric policy comparison.
        if (isIdentityBridgeObject(observedObjects[index])) {
          continue;
        }
        observedByKey[objectKey(observedObjects[index])] = observedObjects[index];
      }

      const missing = [];
      const changed = [];
      const unexpected = [];

      for (const key of Object.keys(expectedByKey)) {
        const observed = observedByKey[key];
        if (!observed) {
          missing.push(key);
          continue;
        }
        const expected = expectedByKey[key];
        if (!annotationEqual(expected, observed)) {
          changed.push(`${key} (annotations)`);
          continue;
        }
        if (!rulesEqual(expected, observed)) {
          changed.push(`${key} (rules)`);
        }
      }
      for (const key of Object.keys(observedByKey)) {
        if (!expectedByKey[key]) {
          unexpected.push(key);
        }
      }

      missing.sort();
      changed.sort();
      unexpected.sort();
      return { missing, changed, unexpected, agrees: missing.length + changed.length + unexpected.length === 0 };
    }

    /**
     * Compute the freshness state from the three reads.
     *
     * Inputs are the already-shaped results of fetchInventory, fetchObservedRBAC
     * and the comparison above; the function itself performs no I/O, so every
     * branch is reachable from a fixture.
     */
    function computeFreshness(inventoryResult, observedResult, comparison) {
      if (inventoryResult.reason === 'unauthorized' || observedResult.reason === 'unauthorized') {
        return {
