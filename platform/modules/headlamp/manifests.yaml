          h(Typography, { key: `warn-${index}`, variant: 'body2', color: 'warning.main' }, warning)
        ),
        h(
          Typography,
          { variant: 'caption', sx: { display: 'block', mt: 1 } },
          preview.requiresApproval
            ? 'Every submission is committed through a reviewed Git transaction and requires approval before it can take effect.'
            : ''
        )
      );
    }

    function StatusPanel({ status, error }) {
      if (!status && !error) {
        return null;
      }
      if (error) {
        return h(
          Alert,
          { severity: error.reason === 'unauthorized' ? 'error' : 'warning', sx: { mt: 2 } },
          `Change request status is not available: ${error.message || error.reason || 'the read failed'}.`
        );
      }
      return h(
        Box,
        { sx: { mt: 2 } },
        h(Chip, { size: 'small', color: status.tone === 'success' ? 'success' : status.tone === 'error' ? 'error' : 'default', label: status.label }),
        h(Typography, { variant: 'body2', sx: { mt: 1 } }, `Request ${status.id} \u2014 ${status.operation} ${status.policyName}`),
        status.message ? h(Typography, { variant: 'body2' }, status.message) : null,
        status.commit ? h(Typography, { variant: 'caption' }, `Commit ${status.commit}`) : null,
        status.terminal ? null : h(Typography, { variant: 'caption' }, 'Polling for the next state\u2026')
      );
