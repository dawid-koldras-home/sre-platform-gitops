apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-pilot
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-pilot-kubeconfig
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: identity-bridge
        cluster:
          server: http://headlamp-identity-bridge.acl-live-acceptance.svc.cluster.local:8080
    contexts:
      - name: identity-bridge
        context:
          cluster: identity-bridge
          user: identity-bridge
    current-context: identity-bridge
    users:
      - name: identity-bridge
        user: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-pilot
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp-pilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
        app.kubernetes.io/instance: headlamp-pilot
        app.kubernetes.io/component: headlamp-pilot
        app.kubernetes.io/part-of: sre-platform
    spec:
      serviceAccountName: headlamp-pilot
      automountServiceAccountToken: false
      hostUsers: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp@sha256:5d03caa26df7a715079405df2949907160518750b9b62b6bf4de8d1a6142c541
          imagePullPolicy: IfNotPresent
          env:
            - name: HEADLAMP_MODE
              value: local
            - name: HOME
              value: /tmp/headlamp
          args:
            - -kubeconfig=/headlamp/config/kubeconfig
            - -plugins-dir=/headlamp/plugins
            - -session-ttl=86400
            - -proxy-auth=true
            - -proxy-auth-username-header=Remote-User
            - -proxy-auth-group-header=Remote-Groups
            - -proxy-auth-email-header=Remote-Email
            - -proxy-auth-token-header=Remote-Id-Token
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
          livenessProbe:
            httpGet:
              path: "/"
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "/"
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: kubeconfig
              mountPath: /headlamp/config
              readOnly: true
            - name: plugins
              mountPath: /headlamp/plugins
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kubeconfig
          configMap:
            name: headlamp-pilot-kubeconfig
            defaultMode: 420
        - name: plugins
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-pilot
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-pilot-ingress
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp-pilot
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 4466
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-pilot-egress
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
      app.kubernetes.io/instance: headlamp-pilot
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: headlamp-identity-bridge
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: acl-headlamp
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
spec:
  secretName: acl-headlamp-tls
  issuerRef:
    name: sre-tools-letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - acl-headlamp.139.162.145.158.nip.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acl-headlamp-route
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: headlamp-pilot
    app.kubernetes.io/component: headlamp-pilot
    app.kubernetes.io/part-of: sre-platform
  annotations:
    sre-platform.io/ingress-type: access-control-acceptance
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/auth-method: GET
    nginx.ingress.kubernetes.io/auth-url: http://acl-authelia.acl-live-acceptance.svc.cluster.local/api/authz/auth-request
    nginx.ingress.kubernetes.io/auth-signin: https://acl-auth.139.162.145.158.nip.io?rm=$request_method
    nginx.ingress.kubernetes.io/auth-response-headers: Remote-User,Remote-Groups,Remote-Email,Remote-Id-Token
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - acl-headlamp.139.162.145.158.nip.io
      secretName: acl-headlamp-tls
  rules:
    - host: acl-headlamp.139.162.145.158.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp-pilot
                port:
                  number: 80