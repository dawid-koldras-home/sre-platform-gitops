apiVersion: batch/v1
kind: CronJob
metadata:
  name: cost-explorer
  namespace: cost-explorer
  labels:
    app.kubernetes.io/name: cost-explorer
    app.kubernetes.io/instance: cost-explorer
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cost-explorer
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cost-explorer
            app.kubernetes.io/instance: cost-explorer
            app.kubernetes.io/part-of: sre-platform
            app.kubernetes.io/managed-by: srectl
          annotations:
            checksum/config: 8ff388b1d3d68a52495ddd995285558aa7c16b8db55e188a1ea3940a369d3289
        spec:
          serviceAccountName: cost-explorer
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: estimator
              image: "ghcr.io/dawid-koldras-home/cost-explorer-runtime@sha256:fb36d031085d8c399ccb3f4924622229231e45d19832866010f1f5836a6248ee"
              imagePullPolicy: IfNotPresent
              command:
                - /cost-explorer
                - estimate
                - --prometheus-url=http://prometheus-server.prometheus
                - --provider=linode
                - --region=us-ord
                - --currency=USD
                - --namespace=$(POD_NAMESPACE)
                - --retention-days=30
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: pricing-config
                  mountPath: /etc/cost-explorer
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: pricing-config
              configMap:
                name: cost-explorer-pricing
