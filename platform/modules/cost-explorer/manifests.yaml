# Source: cost-explorer/templates/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cost-explorer
  labels:
    app.kubernetes.io/name: cost-explorer
    app.kubernetes.io/instance: cost-explorer
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cost-explorer
rules:
# Read Prometheus metrics via HTTP (service account token auth)
# The estimator queries Prometheus over HTTP; it does not need RBAC for this.
# RBAC below covers CostReport CRD access and node/PVC metadata reads.
- apiGroups: ["sre-platform.io"]
  resources: ["costreports"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["sre-platform.io"]
  resources: ["costreports/status"]
  verbs: ["get", "update", "patch"]
# Read node allocatable capacity for idle calculation
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Read pod resource requests and metadata for attribution
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Read PVC capacity for storage cost attribution
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
# Read workload metadata (deployment/statefulset/daemonset owner references)
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
# Read LoadBalancer service port counts
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
