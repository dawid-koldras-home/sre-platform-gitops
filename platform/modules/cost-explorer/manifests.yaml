# Source: cost-explorer/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cost-explorer
  namespace: cost-explorer
  labels:
    app.kubernetes.io/name: cost-explorer
    app.kubernetes.io/instance: cost-explorer
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cost-explorer
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Prometheus metrics queries through either the cluster Service
    # port (80) or a direct Prometheus endpoint (9090).
    - to: []
      ports:
        - port: 80
          protocol: TCP
        - port: 9090
          protocol: TCP
    # Allow Kubernetes API server access for CostReport CRUD + metadata reads
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
