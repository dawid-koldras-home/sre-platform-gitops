# Source: cost-explorer/templates/crd.yaml
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: costreports.sre-platform.io
  labels:
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
  annotations:
    controller-gen.kubebuilder.io/version: "v0.16.0"
spec:
  group: sre-platform.io
  names:
    kind: CostReport
    listKind: CostReportList
    plural: costreports
    singular: costreport
    shortNames:
      - cr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Total
          type: number
          jsonPath: .status.totalCost
        - name: CPU-Requested
          type: number
          jsonPath: .status.requestedCpuCost
        - name: RAM-Requested
          type: number
          jsonPath: .status.requestedMemoryCost
        - name: PVC
          type: number
          jsonPath: .status.pvcCost
        - name: LB
          type: number
          jsonPath: .status.loadBalancerCost
        - name: Idle
          type: number
          jsonPath: .status.idleCost
        - name: Currency
          type: string
          jsonPath: .spec.currency
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: CostReport captures a time-bucketed cost estimation for a provider/region.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - provider
                - currency
                - pricingSource
                - timeRange
              properties:
                provider:
                  type: string
                  description: Cloud provider name (linode, aws, azure, gcp).
                region:
                  type: string
                  description: Optional provider region identifier.
                currency:
                  type: string
                  default: USD
                  description: Three-letter currency code.
                pricingSource:
                  type: string
                  description: How pricing was determined (operator-validated-input, catalog, etc.).
                priceEffectiveTimestamp:
                  type: string
                  format: date-time
                  description: Timestamp when pricing values were last validated.
                timeRange:
                  type: object
                  required:
                    - start
                    - end
                  properties:
                    start:
                      type: string
                      format: date-time
                    end:
                      type: string
                      format: date-time
                retentionDays:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 30
                  description: Number of days to retain this report before garbage collection.
                filters:
                  type: object
                  description: Filters applied when generating this report.
                  properties:
                    namespace:
                      type: string
                    workloadType:
                      type: string
                    workloadName:
                      type: string
                    node:
                      type: string
            status:
              type: object
              properties:
                totalCost:
                  type: number
                requestedCpuCost:
                  type: number
                actualCpuCost:
                  type: number
                requestedMemoryCost:
                  type: number
                actualMemoryCost:
                  type: number
                pvcCost:
                  type: number
                loadBalancerCost:
                  type: number
                idleCost:
                  type: number
                namespaceBreakdown:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      totalCost:
                        type: number
                      requestedCost:
                        type: number
                      actualCost:
                        type: number
                      pvcCost:
                        type: number
                workloadBreakdown:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      name:
                        type: string
                      kind:
                        type: string
                      totalCost:
                        type: number
                      requestedCost:
                        type: number
                      actualCost:
                        type: number
                categoryBreakdown:
                  type: array
                  items:
                    type: object
                    properties:
                      category:
                        type: string
                      totalCost:
                        type: number
                nodeBreakdown:
                  type: array
                  items:
                    type: object
                    properties:
                      node:
                        type: string
                      totalCost:
                        type: number
                      allocatedCost:
                        type: number
                      idleCost:
                        type: number
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                lastCalculationTime:
                  type: string
                  format: date-time
                warnings:
                  type: array
                  items:
                    type: string
                observedGeneration:
                  type: integer
                  format: int64
