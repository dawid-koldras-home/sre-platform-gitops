data:
  config.yaml: |
    endpoints:
    - alerts: []
      conditions:
      - '[STATUS] == 200'
      group: Platform
      interval: 1m
      method: GET
      name: Argo CD
      url: http://argocd.139.162.145.158.nip.io/
    - alerts: []
      conditions:
      - '[STATUS] == 200'
      group: Identity
      interval: 1m
      method: GET
      name: Authelia
      url: https://auth.139.162.145.158.nip.io/
    - alerts: []
      conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 4000'
      group: Platform
      interval: 1m
      method: GET
      name: Headlamp backend health
      url: http://headlamp.headlamp.svc.cluster.local/
    - alerts: []
      client:
        ignore-redirect: true
      conditions:
      - '[STATUS] == 200 || [STATUS] == 302'
      group: Platform
      interval: 1m
      method: GET
      name: Headlamp public route
      url: https://headlamp.139.162.145.158.nip.io/
    - alerts: []
      conditions:
      - '[STATUS] == 200 || [STATUS] == 429'
      group: Secrets
      interval: 1m
      method: GET
      name: OpenBao API
      url: https://openbao.139.162.145.158.nip.io/v1/sys/health
    - alerts: []
      conditions:
      - '[STATUS] == 200'
      group: Security
      interval: 1m
      method: GET
      name: Policy Reporter UI
      url: http://policy-reporter.139.162.145.158.nip.io/
    metrics: true
    storage:
      type: memory
