# Source: gatus/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    helm.sh/chart: gatus-1.5.0
    app.kubernetes.io/name: gatus
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/version: "v5.34.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
      app.kubernetes.io/instance: gatus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
        app.kubernetes.io/instance: gatus
      annotations:
        checksum/config: ba82fe98d33ec106a9f2875e7ff6329cec7248186f34d7af7b977c53b86edfcb
    spec:
      
      serviceAccountName: gatus
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatus
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
          image: "twinproduction/gatus:v5.34.0@sha256:3fff895e77d35ee62e898860f4613755bc2344127d93e3f326429d40270e2115"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gatus
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            limits:
              cpu: 250m
              ephemeral-storage: 32Mi
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 48Mi
          volumeMounts:
            - name: gatus-config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
              subPath: 
              readOnly: false
      volumes:
        - name: gatus-config
          configMap:
            name: gatus
        - name: tmp
          emptyDir: {}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
    sre.platform.io/component: gatus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
      app.kubernetes.io/instance: gatus
  policyTypes:
    - Ingress
    - Egress
  # No dashboard route is published, so no source is permitted.
  ingress: []
  egress:
    # DNS to the cluster resolver, so endpoint hostnames can be resolved at all. This
    # is the only allowance not derived from the endpoint configuration.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # In-cluster readiness endpoints, each allowed only to its own namespace and the
    # validated port. Not an exact Service or pod selection: see the comment on
    # gatusInternalEgress for why an offline renderer cannot narrow it further.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: headlamp
      ports:
        - protocol: TCP
          port: 80
    # The public endpoint checks. ipBlock is used because a NetworkPolicy cannot
    # resolve a customer hostname, and no configured address is repeated in a selector.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
