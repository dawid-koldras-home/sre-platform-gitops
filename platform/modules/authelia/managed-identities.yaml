apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/managed-by: srectl
    app.kubernetes.io/part-of: sre-platform
    sre.platform.io/component: external-secrets
  name: authelia-users-database
  namespace: authelia
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: identities/platform-admin
      metadataPolicy: None
      property: password
    secretKey: credential_0
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: identities/task224-admin
      metadataPolicy: None
      property: password
    secretKey: credential_1
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: identities/task224-e2e-20261031124325
      metadataPolicy: None
      property: password
    secretKey: credential_2
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: platform-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: authelia-users-database
    template:
      data:
        users_database.yml: |
          {{- if gt (len .credential_0) 512 }}{{ fail "credential credential_0 exceeds the 512 byte maximum" }}{{ end -}}
          {{- if gt (len .credential_1) 512 }}{{ fail "credential credential_1 exceeds the 512 byte maximum" }}{{ end -}}
          {{- if gt (len .credential_2) 512 }}{{ fail "credential credential_2 exceeds the 512 byte maximum" }}{{ end -}}
          # generated by srectl from spec.identity; edit the installation, not this Secret
          users:
            "platform-admin":
              displayname: "Platform Admin"
              disabled: false
              groups:
                - "platform-operators"
              password: {{ .credential_0 }}
            "task224-admin":
              displayname: "Temporary Live Acceptance Admin"
              email: "task224-admin@example.invalid"
              disabled: false
              groups:
                - "platform-operators"
              password: {{ .credential_1 }}
            "task224-e2e-20261031124325":
              displayname: "Task224 Live Acceptance Edited"
              email: "task224-e2e-20261031124325.edited@example.invalid"
              disabled: false
              groups:
                - "platform-operators"
              password: {{ .credential_2 }}
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
