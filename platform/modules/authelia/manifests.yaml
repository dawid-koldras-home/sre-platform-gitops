# Source: authelia/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: authelia
  labels: 
    app.kubernetes.io/name: authelia
    app.kubernetes.io/instance: authelia
    app.kubernetes.io/version: 4.39.24
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: authelia-0.11.22
  annotations: 
    cert-manager.io/cluster-issuer: sre-tools-letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: 'auth.139.162.145.158.nip.io'
    http:
      paths:
        - path: '/'
          pathType: Prefix
          backend:
            service:
              name: authelia
              port:
                number: 80
  tls:
    - hosts:
        - 'auth.139.162.145.158.nip.io'
      secretName: authelia-tls
