apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  labels:
    app.kubernetes.io/managed-by: srectl
    app.kubernetes.io/part-of: sre-platform
  name: sre-tools-letsencrypt
spec:
  acme:
    privateKeySecretRef:
      name: sre-tools-letsencrypt-account
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
