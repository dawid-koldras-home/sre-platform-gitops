apiVersion: v1
kind: Namespace
metadata:
  name: access-change-api
  labels:
    app.kubernetes.io/name: access-change-api
    app.kubernetes.io/instance: access-change-api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: access-change-api
---
# Source: access-change-api/templates/networkpolicy.yaml
# The API accepts submissions and answers status reads; it writes nothing
# except through its own Git transaction and the audit sink, each tightened by
# its own validation. Egress is DNS, the Kubernetes API server for the Argo
# observation, the GitOps repository (https), the review workflow and the
# audit sink, all reached on the standard TLS port.
#
# Ingress is denied entirely by this policy. The only source ever permitted is
# the ingress controller that publishes the bounded same-origin route, and that
# allowance is rendered separately - and only when the route is enabled - by
# internal/resolver/accesschange.go. It is deliberately NOT a same-namespace
# podSelector: a workflow in this namespace that could reach the API directly
# would be a trusted identity proxy, and the API's whole identity model is that
# only the forward-auth proxy may assert Remote-User/Remote-Groups.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: access-change-api
  namespace: access-change-api
  labels:
    app.kubernetes.io/name: access-change-api
    app.kubernetes.io/instance: access-change-api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: access-change-api
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # An empty rule list under an explicit Ingress policy type is deny-all, which
  # is the intent. Dropping Ingress from policyTypes to make the policy look
  # empty would leave the pod's ingress unrestricted instead.
  ingress: []
  egress:
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to: []
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # The attribution sink terminates TLS on 8443 (its Service port), which is
    # not the standard 443 the repository and review workflow use. NetworkPolicy
    # cannot match a hostname, so this allowance is by port only; the sink is the
    # only 8443 destination the API is ever configured to reach.
    - to: []
      ports:
        - port: 8443
          protocol: TCP
    # OpenBao credential provisioning: in-cluster service only, scoped by
    # namespace/pod selector and exact port. No 0.0.0.0/0 or CIDR allowance.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "openbao"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - port: 8443
          protocol: TCP
