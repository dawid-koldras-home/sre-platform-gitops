  name: access-change-api-argo-observer
  namespace: argocd
  labels:
    app.kubernetes.io/name: access-change-api
    app.kubernetes.io/instance: access-change-api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: access-change-api
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]
