  package.json: |-
    {
      "name": "sre-platform-synthetic",
      "version": "0.1.0",
      "private": true,
      "description": "Reusable configuration-driven Playwright synthetic monitoring framework (TASK-142)",
      "type": "commonjs",
      "engines": {
        "node": ">=22 <25"
      },
      "scripts": {
        "start": "tsx runner/index.ts",
        "list": "tsx runner/index.ts --list",
        "validate": "tsx runner/index.ts --validate-only",
        "test": "node node_modules/@playwright/test/cli.js test tests --config=playwright.config.ts",
        "browsers": "playwright install chromium"
      },
      "dependencies": {
        "@playwright/test": "1.63.0",
        "esbuild": "0.28.2",
        "nodemailer": "10.0.9",
        "tsx": "4.23.13",
        "yaml": "2.9.1",
        "zod": "4.6.2"
      },
      "devDependencies": {
        "@types/node": "22.20.2",
        "typescript": "7.0.2"
      }
    }
  playwright.runner.config.ts: |-
    import path from 'node:path';
    import { defineConfig } from '@playwright/test';

    const outputDir = process.env.SYNTHETIC_OUTPUT_DIR || path.resolve(__dirname, 'output');

    // Runner-only config: executes the compiled journey spec produced by
    // `npm run start`. The umbrella `npm test` suite must NOT see journeys.spec.ts,
    // so this config is selected explicitly by runner/index.ts.
    export default defineConfig({
      testDir: 'tests',
      testMatch: '**/journeys.spec.ts',
      timeout: 120000,
      expect: { timeout: 10000 },
      fullyParallel: false,
      workers: 1,
      retries: 0,
      reporter: [
        ['list'],
        // One sanitized JSON line per target on stdout (CronJob log contract). See
        // runner/jsonreporter.ts. Non-zero exit on failure is the check result.
        [path.join(__dirname, 'runner', 'jsonreporter.ts')],
      ],
      use: {
        browserName: 'chromium',
        trace: 'off',
        screenshot: 'off',
        video: 'off',
      },
      outputDir: path.join(outputDir, '.playwright'),
    });
  runner.actions.ts: |-
    import path from 'node:path';
    import type { Page } from '@playwright/test';
    import { ensureDir, evidenceDirFor, maskSelectorsFor, noArtifactsEnabled } from './artifacts';
    import { findFirstVisible, resolveLocator, visibleSelectorReport } from './locators';
    import { actionSchema, isCredentialed, type Action, type Target } from './schema';

    export interface RunContext {
      target: Target;
      page: Page;
      outputDir: string;
    }

    export interface CheckResult {
      target: string;
      check: string;
      action: Action['type'];
      status: 'passed' | 'failed';
      durationMs: number;
      httpStatus?: number;
      selector?: string;
      error?: string;
    }

    export type CheckReporter = (result: CheckResult) => void | Promise<void>;

    function resolveUrl(target: Target, url: string): string {
      if (url.startsWith('/')) {
        return new URL(url, target.baseUrl).toString();
      }
      return url;
    }

    function assertSingleVisible(ctx: RunContext, selectors: string[]): Promise<NonNullable<Awaited<ReturnType<typeof findFirstVisible>>>> {
      return findFirstVisible(ctx.page, selectors, ctx.target.timeoutMs).then((locator) => {
        if (locator === null) {
          throw new Error(`visibility check failed for ${ctx.target.id}: ${visibleSelectorReport(selectors)}`);
        }
        return locator;
      });
    }

    function normalizeText(text: string): string {
      return text.replace(/\s+/g, ' ').trim();
    }

    export async function runActions(target: Target, page: Page, outputDir: string, report?: CheckReporter): Promise<void> {
      // Re-validate so zod defaults (e.g. empty fallback lists) are applied even
      // when a caller constructs a literal target without parsing it.
      const actions = target.actions.map((a) => actionSchema.parse(a));
      const ctx: RunContext = { target, page, outputDir };
      for (const [index, action] of actions.entries()) {
        const startedAt = Date.now();
        const check = action.check ?? `${action.type}-${index + 1}`;
        try {
          const details = await runAction(ctx, action);
          await report?.({ target: target.id, check, action: action.type, status: 'passed', durationMs: Date.now() - startedAt, ...details });
        } catch (err) {
          const error = err instanceof Error ? err.message : String(err);
          await report?.({ target: target.id, check, action: action.type, status: 'failed', durationMs: Date.now() - startedAt, error });
          throw err;
        }
      }
    }

    export async function runAction(ctx: RunContext, action: Action): Promise<Pick<CheckResult, 'httpStatus' | 'selector'>> {
      const { page, target } = ctx;
      const selectorsOf = (primary: string, fallback: string[] | undefined): string[] => [primary, ...(fallback ?? [])];

      switch (action.type) {
        case 'goto': {
          const url = resolveUrl(target, action.url);
          const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: target.timeoutMs });
          if (response !== null && !response.ok()) {
            throw new Error(`HTTP ${response.status()} for ${url} on ${target.id}`);
          }
          return response === null ? {} : { httpStatus: response.status() };
        }
        case 'wait': {
          await page.waitForTimeout(action.durationMs);
          return {};
        }
        case 'visible': {
          await assertSingleVisible(ctx, selectorsOf(action.selector, action.fallback));
          return { selector: action.selector };
        }
        case 'text': {
          let haystack: string;
          if (action.selector !== undefined) {
            const locator = await assertSingleVisible(ctx, selectorsOf(action.selector, action.fallback));
            haystack = await locator.innerText();
          } else {
            const body = page.locator('body');
            await body.waitFor({ state: 'visible', timeout: target.timeoutMs });
            haystack = await body.innerText();
          }
          const needle = normalizeText(action.text);
          const found = normalizeText(haystack).includes(needle);
          if (action.contains && !found) {
            throw new Error(`expected text '${action.text}' not found on ${target.id}`);
          }
          if (!action.contains && found) {
            throw new Error(`unexpected text '${action.text}' present on ${target.id}`);
          }
          return action.selector === undefined ? {} : { selector: action.selector };
        }
        case 'url': {
          const current = page.url();
          const matches = action.regex
            ? new RegExp(action.pattern).test(current)
            : current === action.pattern;
          if (!matches) {
            throw new Error(`URL check failed on ${target.id}: pattern '${action.pattern}' does not match '${current}'`);
          }
          return {};
        }
        case 'fill': {
          const value =
            action.value !== undefined ? action.value : (process.env[action.valueFromEnv as string] ?? '');
          if (value.trim() === '') {
            throw new Error(`fill action on ${target.id} resolved to an empty value`);
          }
          const locator = await assertSingleVisible(ctx, selectorsOf(action.selector, action.fallback));
          await locator.fill(value);
          return { selector: action.selector };
        }
        case 'click': {
          const locator = await assertSingleVisible(ctx, selectorsOf(action.selector, action.fallback));
          await locator.click({ timeout: target.timeoutMs });
          return { selector: action.selector };
        }
        case 'screenshot': {
          if (noArtifactsEnabled()) {
            return {};
          }
          const dir = evidenceDirFor(ctx.outputDir, target.id);
          ensureDir(dir);
          const file = path.join(dir, `${action.name}.png`);
          const masks = action.mask.map((raw) => resolveLocator(page, raw));
          const masksForCredentialed = isCredentialed(target) ? masks : [];
          await page.screenshot({
            path: file,
            fullPage: action.fullPage,
            mask: [...masksForCredentialed, ...masks],
          });
          return {};
        }
      }
    }
  runner.artifacts.ts: |-
    import fs from 'node:fs';
    import path from 'node:path';
    import { isCredentialed, type Target } from './schema';

    // Scheduled CronJob runs set SYNTHETIC_NO_ARTIFACTS=1 so no screenshots,
    // traces or evidence files are produced (see platform/synthetic-monitoring
    // bases/cronjob.yaml). Local/CI runs keep the default artifact behavior.
    export const NO_ARTIFACTS_ENV = 'SYNTHETIC_NO_ARTIFACTS';

    export function noArtifactsEnabled(): boolean {
      return process.env[NO_ARTIFACTS_ENV] === '1';
    }

    export function ensureDir(dir: string): void {
      fs.mkdirSync(dir, { recursive: true });
    }

    export function cleanDir(dir: string): void {
      fs.rmSync(dir, { recursive: true, force: true });
    }

    const SECRET_LIKE =
      /(?<=\s)(?:password|passwd|pass|secret|token|api[_-]?key|client[_-]?secret)\b.*/gi;

    export function redactText(text: string): string {
      return text.replace(SECRET_LIKE, (match) => match.replace(/[A-Za-z0-9_.\-]{4,}/g, '****'));
    }

    export function maskSelectorsFor(target: Target): string[] {
      if (!isCredentialed(target)) {
        return [];
      }
      return target.actions
        .filter((a) => a.type === 'fill')
        .map((a) => (a.type === 'fill' ? a.selector : ''));
    }

    export function evidenceDirFor(outputDir: string, targetId: string): string {
      return path.join(outputDir, targetId);
    }
  runner.email.ts: |-
    import fs from 'node:fs';
    import path from 'node:path';
    import nodemailer from 'nodemailer';

    export interface CheckEvent {
      target: string;
      check: string;
      action: string;
      status: 'passed' | 'failed';
      durationMs: number;
      httpStatus?: number;
      selector?: string;
      error?: string;
    }

    export interface TargetSummary {
      target: string;
      status: 'passed' | 'failed' | 'skipped';
      startedAt: string;
      finishedAt: string;
      durationMs: number;
    }

    export interface EmailConfig {
      host: string;
      port: number;
      user: string;
      pass: string;
      from: string;
      to: string;
    }

    export interface EmailTransport {
      sendMail(message: { from: string; to: string; subject: string; html: string }): Promise<unknown>;
    }

    const emailDir = () => process.env.SYNTHETIC_EMAIL_DIR || '/synthetic-email';

    function readSecretFile(dir: string, key: string): string | undefined {
      const file = path.join(dir, key);
      if (!fs.existsSync(file)) return undefined;
      const value = fs.readFileSync(file, 'utf8').trim();
      return value === '' ? undefined : value;
    }

    export function loadEmailConfig(dir = emailDir()): EmailConfig | undefined {
      const host = readSecretFile(dir, 'SMTP_HOST');
      if (host === undefined) return undefined;
      const port = Number(readSecretFile(dir, 'SMTP_PORT'));
      const user = readSecretFile(dir, 'SMTP_USER');
      const pass = readSecretFile(dir, 'SMTP_PASS');
      const from = readSecretFile(dir, 'MAIL_FROM');
      const to = readSecretFile(dir, 'MAIL_TO');
      if (!Number.isInteger(port) || port < 1 || port > 65535 || !user || !pass || !from || !to) {
        throw new Error('synthetic email Secret is incomplete or invalid');
      }
      return { host, port, user, pass, from, to };
    }

    function isCheckEvent(value: unknown): value is CheckEvent {
      return typeof value === 'object' && value !== null && 'check' in value && 'action' in value && 'target' in value;
    }

    function isTargetSummary(value: unknown): value is TargetSummary {
      return typeof value === 'object' && value !== null && !('check' in value) && 'target' in value && 'status' in value;
    }

    export function parseRunOutput(output: string): { checks: CheckEvent[]; summaries: TargetSummary[] } {
      const checks: CheckEvent[] = [];
      const summaries: TargetSummary[] = [];
      for (const line of output.split(/\r?\n/)) {
        try {
          const parsed: unknown = JSON.parse(line);
          if (isCheckEvent(parsed)) checks.push(parsed);
          if (isTargetSummary(parsed)) summaries.push(parsed);
        } catch {
          // Playwright's human-readable output is not part of the notification.
        }
      }
      return { checks, summaries };
    }

    function escapeHTML(value: string | number): string {
      return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char] as string);
    }

    export function failureEmailHTML(summary: TargetSummary, checks: CheckEvent[]): string {
      const rows = checks
        .filter((check) => check.target === summary.target)
        .map((check) => {
          const failed = check.status === 'failed';
          const status = failed ? 'FAILED' : 'PASSED';
          const color = failed ? '#b42318' : '#16794c';
          return `<tr><td>${escapeHTML(check.check)}</td><td>${escapeHTML(check.action)}</td><td style="color:${color};font-weight:600">${status}</td><td>${escapeHTML(check.durationMs)} ms</td><td>${check.httpStatus === undefined ? '-' : escapeHTML(check.httpStatus)}</td><td>${check.error === undefined ? '-' : escapeHTML(check.error)}</td></tr>`;
        })
        .join('');
      return `<!doctype html><html><body style="font-family:Arial,sans-serif;color:#172033"><h2 style="color:#b42318">Synthetic monitor failed</h2><p><strong>Target:</strong> ${escapeHTML(summary.target)}<br><strong>Duration:</strong> ${escapeHTML(summary.durationMs)} ms<br><strong>Finished:</strong> ${escapeHTML(summary.finishedAt)}</p><table style="border-collapse:collapse;width:100%"><thead><tr><th style="text-align:left;border-bottom:1px solid #d0d7de">Check</th><th style="text-align:left;border-bottom:1px solid #d0d7de">Action</th><th style="text-align:left;border-bottom:1px solid #d0d7de">Status</th><th style="text-align:left;border-bottom:1px solid #d0d7de">Duration</th><th style="text-align:left;border-bottom:1px solid #d0d7de">HTTP</th><th style="text-align:left;border-bottom:1px solid #d0d7de">Details</th></tr></thead><tbody>${rows}</tbody></table><p style="color:#57606a;font-size:12px">Generated by SRE Platform synthetic monitoring. Details are scrubbed before delivery.</p></body></html>`;
    }

    export async function sendFailureNotifications(
      output: string,
      runFailed: boolean,
      config = loadEmailConfig(),
      createTransport: (config: EmailConfig) => EmailTransport = (smtp) => nodemailer.createTransport({ host: smtp.host, port: smtp.port, secure: smtp.port === 465, requireTLS: smtp.port === 587, auth: { user: smtp.user, pass: smtp.pass } }),
    ): Promise<number> {
      if (!runFailed || config === undefined) return 0;
      const { checks, summaries } = parseRunOutput(output);
      const transport = createTransport(config);
      const failedTargets = new Set([
        ...summaries.filter((summary) => summary.status === 'failed').map((summary) => summary.target),
        ...checks.filter((check) => check.status === 'failed').map((check) => check.target),
      ]);
      let sent = 0;
      for (const target of failedTargets) {
        const summary = summaries.find((item) => item.target === target) ?? {
          target,
          status: 'failed' as const,
          startedAt: '',
          finishedAt: '',
          durationMs: 0,
        };
        await transport.sendMail({
          from: config.from,
          to: config.to,
          subject: `[FAIL] SRE Synthetic Monitor: ${summary.target}`,
          html: failureEmailHTML(summary, checks),
        });
        sent += 1;
      }
      return sent;
    }
  runner.index.ts: |-
    #!/usr/bin/env node
    import { spawnSync } from 'node:child_process';
    import fs from 'node:fs';
    import path from 'node:path';
    import { build } from 'esbuild';
    import { cleanDir, ensureDir } from './artifacts';
    import { loadTargetsOrFail, filterTargetsById, unknownTargetIds, targetsDirectory } from './loader';
    import { writeLock } from './lock';
    import { checkTargetSecrets } from './secrets';
    import { sendFailureNotifications } from './email';
    import { COMPILED_DIR, ENV_LOCK_FILE, ENV_OUTPUT_DIR, LOCK_FILE_NAME, type Target } from './schema';

    const root = path.resolve(__dirname, '..');

    interface CliArgs {
      targets: string[];
      outputDir: string;
      listOnly: boolean;
      validateOnly: boolean;
    }

    function parseArgs(argv: string[]): CliArgs {
      const args: CliArgs = {
        targets: [],
        outputDir: path.join(root, 'output'),
        listOnly: false,
        validateOnly: false,
      };
      for (let i = 0; i < argv.length; i += 1) {
        const arg = argv[i];
        switch (arg) {
          case '--targets': {
            const value = argv[i + 1];
            if (value === undefined) throw new Error('--targets requires a comma-separated list');
            args.targets = value
              .split(',')
              .map((s) => s.trim())
              .filter((s) => s.length > 0);
            i += 1;
            break;
          }
          case '--output-dir': {
            const value = argv[i + 1];
            if (value === undefined) throw new Error('--output-dir requires a path');
            args.outputDir = path.resolve(value);
            i += 1;
            break;
          }
          case '--list':
            args.listOnly = true;
            break;
          case '--validate-only':
            args.validateOnly = true;
            break;
          default:
            throw new Error(`unknown argument: ${arg}`);
        }
      }
      return args;
    }

    function printTargets(targets: Target[]): void {
      const rows = targets.map((t) => ({
        id: t.id,
        mode: t.auth.mode,
        min: t.minIntervalMinutes,
        retries: t.retries,
        source: t.journey ?? `${t.actions.length} actions`,
      }));
      const width = (key: keyof (typeof rows)[number]) =>
        Math.max(...rows.map((r) => String(r[key]).length), key.length);
      const nameW = Math.max(...rows.map((r) => r.id.length), 'id'.length);
      for (const r of rows) {
        const pad = (s: string, n: number) => String(s).padEnd(n);
        console.log(
          `${pad(r.id, nameW)} | ${pad(r.mode, 12)} | ${pad(String(r.min), width('min'))} | ${pad(
            String(r.retries),
            width('retries'),
          )} | ${r.source}`,
        );
      }
      console.log(`${rows.length} target(s) configured`);
    }

    async function compileJourneys(targets: Target[], outputDir: string): Promise<void> {
      const wanted = targets.filter((t) => t.journey !== undefined);
      if (wanted.length === 0) {
        return;
      }
      const journeyDir = path.join(root, 'journeys');
      const entryPoints: string[] = [];
      for (const target of wanted) {
        const entry = path.join(journeyDir, path.basename(target.journey as string));
        if (!fs.existsSync(entry)) {
          throw new Error(`journey file not found: ${target.journey}`);
        }
        entryPoints.push(entry);
      }
      const compileDir = path.join(outputDir, COMPILED_DIR);
      cleanDir(compileDir);
      ensureDir(compileDir);
      await build({
        entryPoints,
        outdir: compileDir,
        bundle: true,
        platform: 'node',
        format: 'cjs',
        target: 'node22',
        sourcemap: false,
        logLevel: 'error',
      });
    }

    async function run(args: CliArgs, targets: Target[]): Promise<number> {
      const lockFile = writeLock(targets, args.outputDir);

      const skips = targets
        .map((t) => checkTargetSecrets(t))
        .filter((c): c is Extract<typeof c, { ok: false }> => !c.ok);
      if (skips.length > 0) {
        console.warn(`[warn] ${skips.length} credentialed target(s) will be skipped (secrets not provided):`);
        for (const skip of skips) {
          console.warn(`  ${skip.reason}`);
        }
      }

      const cli = path.join(root, 'node_modules', '@playwright', 'test', 'cli.js');
      const specFilter = 'tests/journeys.spec.ts'; // relative filter within testDir
      const runnerConfig = path.join(root, 'playwright.runner.config.ts');
      const result = spawnSync(
        process.execPath,
        [cli, 'test', specFilter, '--config', runnerConfig],
        {
          cwd: root,
          stdio: ['inherit', 'pipe', 'inherit'],
          encoding: 'utf8',
          env: {
            ...process.env,
            [ENV_LOCK_FILE]: lockFile,
            [ENV_OUTPUT_DIR]: args.outputDir,
          },
        },
      );
      const output = result.stdout ?? '';
      process.stdout.write(output);
      const status = result.status ?? 1;
      try {
        const sent = await sendFailureNotifications(output, status !== 0);
        if (sent > 0) console.log(`[notification] sent ${sent} failure email(s)`);
      } catch {
        console.error('[notification] email delivery failed; inspect the synthetic-email Secret and SMTP access');
        return 1;
      }
      return status;
    }

    async function main(): Promise<void> {
      const args = parseArgs(process.argv.slice(2));

      const all = loadTargetsOrFail(root);

      let selected = all;
      if (args.targets.length > 0) {
        const unknown = unknownTargetIds(all, args.targets);
        if (unknown.length > 0) {
          console.error(`unknown target(s): ${unknown.join(', ')}`);
          process.exit(1);
        }
        selected = filterTargetsById(all, args.targets);
      }

      if (args.listOnly) {
        printTargets(selected);
        return;
      }

      if (args.validateOnly) {
        printTargets(selected);
        return;
      }

      await compileJourneys(selected, args.outputDir);
      process.exit(await run(args, selected));
    }

    ensureDir(targetsDirectory(root));
    main().catch((err: unknown) => {
      console.error(`synthetic: ${err instanceof Error ? err.message : String(err)}`);
      process.exit(1);
    });
  runner.journey.ts: |-
    import fs from 'node:fs';
    import path from 'node:path';
    import type { Browser, Page, TestInfo } from '@playwright/test';
    import { runActions } from './actions';
    import { checkAttachmentName, formatCheckResult } from './jsonreporter';
    import { ensureDir, evidenceDirFor, maskSelectorsFor, noArtifactsEnabled } from './artifacts';
    import { resolveLocator } from './locators';
    import { COMPILED_DIR, isCredentialed, type Target } from './schema';
    import { checkTargetSecrets } from './secrets';

    export interface JourneyHelpers {
      navigate: (path: string) => Promise<void>;
      screenshot: (name: string, fullPage?: boolean) => Promise<void>;
    }

    export type JourneyFunction = (page: Page, target: Target, helpers: JourneyHelpers) => Promise<void>;

    export interface RunOutcome {
      status: 'passed' | 'skipped';
      reason?: string;
    }

    export function compileJourneyPath(outputDir: string, target: Target): string | null {
      if (target.journey === undefined) {
        return null;
      }
      return path.join(outputDir, COMPILED_DIR, `${path.basename(target.journey, '.ts')}.js`);
    }

    function loadJourney(outputDir: string, target: Target): JourneyFunction | null {
      const compiled = compileJourneyPath(outputDir, target);
      if (compiled === null || !fs.existsSync(compiled)) {
        return null;
      }
      // eslint-disable-next-line @typescript-eslint/no-var-requires
      const mod = require(compiled) as { default?: JourneyFunction };
      if (mod.default === undefined || typeof mod.default !== 'function') {
        throw new Error(`journey ${target.journey} must export a default async function`);
      }
      return mod.default;
    }

    function maskLocators(page: Page, target: Target) {
      return maskSelectorsFor(target).map((raw) => resolveLocator(page, raw));
    }

    export async function runTargetJourney(args: {
      target: Target;
      browser: Browser;
      testInfo: TestInfo;
      outputDir: string;
    }): Promise<RunOutcome> {
      const { target, browser, testInfo, outputDir } = args;
      const secretCheck = checkTargetSecrets(target);
      if (!secretCheck.ok) {
        return { status: 'skipped', reason: secretCheck.reason };
      }

      const evidenceDir = evidenceDirFor(outputDir, target.id);
      const artifactsOff = noArtifactsEnabled();
      if (!artifactsOff) {
        ensureDir(evidenceDir);
      }
      const traceAllowed = !isCredentialed(target) && !artifactsOff;

      const journey = loadJourney(outputDir, target);
      const attempts = isCredentialed(target) ? 1 : target.retries + 1;

      let lastError: Error | null = null;
      const pageRef: { current?: Page } = {};

      for (let attempt = 1; attempt <= attempts; attempt += 1) {
        const context = await browser.newContext({
          userAgent: 'Mozilla/5.0 (compatible; SRE-Platform-Synthetic/0.1)',
        });
        pageRef.current = await context.newPage();
        if (traceAllowed) {
          await context.tracing.start({ screenshots: true, snapshots: true, sources: false });
        }
        try {
          const helpers: JourneyHelpers = {
            navigate: async (p: string) => {
              await pageRef.current!.goto(new URL(p, target.baseUrl).toString(), {
                waitUntil: 'domcontentloaded',
                timeout: target.timeoutMs,
              });
            },
            screenshot: async (name: string, fullPage = true) => {
              if (artifactsOff) {
                return;
              }
              ensureDir(evidenceDir);
              const masks = maskLocators(pageRef.current!, target);
              await pageRef.current!.screenshot({
                path: path.join(evidenceDir, `${name}.png`),
                fullPage,
                mask: masks,
              });
            },
          };
          if (journey !== null) {
            await journey(pageRef.current, target, helpers);
          } else {
            await runActions(target, pageRef.current, outputDir, async (result) => {
              await testInfo.attach(checkAttachmentName(result.check), {
                body: Buffer.from(formatCheckResult(result)),
                contentType: 'application/json',
              });
            });
          }
          if (traceAllowed) {
            await context.tracing.stop();
          }
          return { status: 'passed' };
        } catch (err) {
          lastError = err instanceof Error ? err : new Error(String(err));
          if (traceAllowed) {
            try {
              const tracePath = path.join(evidenceDir, 'failure.trace.zip');
              await context.tracing.stop({ path: tracePath });
              await testInfo.attach(`${target.id}-trace`, {
                path: tracePath,
                contentType: 'application/zip',
              });
            } catch {
              // tracing artifacts are best-effort
            }
          }
          try {
            if (!artifactsOff) {
              const shotPath = path.join(evidenceDir, 'failure.png');
              await pageRef.current.screenshot({
                path: shotPath,
                fullPage: true,
                mask: maskLocators(pageRef.current, target),
              });
              await testInfo.attach(`${target.id}-screenshot`, { path: shotPath, contentType: 'image/png' });
            }
          } catch {
            // screenshot artifacts are best-effort
          }
        } finally {
          await context.close();
        }
      }

      throw lastError ?? new Error(`journey for ${target.id} failed`);
    }
  runner.jsonreporter.ts: |-
    import type { Reporter, TestCase, TestResult } from '@playwright/test/reporter';
    import { redactText } from './artifacts';
    import type { CheckResult } from './actions';

    export interface SyntheticRunLine {
      target: string;
      status: 'passed' | 'failed' | 'skipped';
      startedAt: string;
      finishedAt: string;
      durationMs: number;
      error?: string;
    }

    const CHECK_ATTACHMENT_PREFIX = 'synthetic-check:';

    function scrub(text: string): string {
      const flattened = redactText(text);
      return flattened
        .replace(/https?:\/\/[^\s'\"]+/gi, '[url]')
        .replace(/\u001b\[[0-9;]*m/g, '')
        .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Emits scrubbed per-action diagnostics. Values typed into forms and URL query
    // strings are deliberately never included in this contract.
    export function formatCheckResult(result: CheckResult): string {
      const line = {
        target: result.target,
        check: result.check,
        action: result.action,
        status: result.status,
        durationMs: result.durationMs,
        ...(result.httpStatus === undefined ? {} : { httpStatus: result.httpStatus }),
        ...(result.selector === undefined ? {} : { selector: result.selector }),
        ...(result.error === undefined ? {} : { error: scrub(result.error) }),
      };
      return JSON.stringify(line);
    }

    export function checkAttachmentName(check: string): string {
      return `${CHECK_ATTACHMENT_PREFIX}${check}`;
    }

    // Emits exactly one sanitized JSON object per target to stdout. Playwright
    // exits non-zero when any test fails, so the container exit code remains the
    // source of truth for the CronJob; this line is the machine-readable summary.
    export class SyntheticJsonReporter implements Reporter {
      onTestEnd(test: TestCase, result: TestResult): void {
        for (const attachment of result.attachments) {
          if (attachment.name.startsWith(CHECK_ATTACHMENT_PREFIX) && attachment.body !== undefined) {
            process.stdout.write(`${attachment.body.toString()}\n`);
          }
        }
        const target = test.title.split(': ')[0] || test.title;
        const status: SyntheticRunLine['status'] =
          result.status === 'passed' ? 'passed' : result.status === 'skipped' ? 'skipped' : 'failed';
        const line: SyntheticRunLine = {
          target,
          status,
          startedAt: new Date(result.startTime).toISOString(),
          finishedAt: new Date(result.startTime.getTime() + result.duration).toISOString(),
          durationMs: result.duration,
        };
        if (status !== 'passed') {
          const errors = result.errors.map((e) => e.message ?? String(e)).join('\n');
          line.error = scrub(errors) || `target ${target} did not finish successfully`;
        }
        process.stdout.write(`${JSON.stringify(line)}\n`);
      }
    }

    export default SyntheticJsonReporter;
  runner.loader.ts: |-
    import path from 'node:path';
    import fs from 'node:fs';
    import { globSync } from 'fs';
    import { parse } from 'yaml';
    import { targetSchema, TARGETS_DIR, type Target } from './schema';

    export interface TargetFile {
      file: string;
      target?: Target;
      error?: string;
    }

    export function targetsDirectory(root: string): string {
      return path.join(root, TARGETS_DIR);
    }

    export function loadAllTargets(root: string): TargetFile[] {
      const dir = targetsDirectory(root);
      if (!fs.existsSync(dir)) {
        throw new Error(`targets directory not found: ${dir}`);
      }
      // Customer targets are grouped below targets/customers/<customer>/ while
      // _template.yaml deliberately remains at the root for discoverability.
      const files = globSync('**/*.yaml', { cwd: dir }).sort();
      return files.map((file) => loadTargetFile(path.join(dir, file)));
    }

    export function loadTargetFile(file: string): TargetFile {
      const raw = fs.readFileSync(file, 'utf8');
      let parsed: unknown;
      try {
        parsed = parse(raw);
      } catch (err) {
        return { file, error: `invalid YAML: ${(err as Error).message}` };
      }
      const result = targetSchema.safeParse(parsed);
      if (!result.success) {
        return {
          file,
          error: result.error.issues.map((i) => `${i.path.join('.') || 'target'}: ${i.message}`).join('; '),
        };
      }
      return { file, target: result.data };
    }

    export function loadTargetsOrFail(root: string): Target[] {
      const results = loadAllTargets(root);
      const errors = results.filter((r) => r.error !== undefined);
      if (errors.length > 0) {
        const detail = errors.map((e) => `  ${e.file}: ${e.error}`).join('\n');
        throw new Error(`target validation failed:\n${detail}`);
      }
      return results.map((r) => r.target as Target);
    }

    export function filterTargetsById(targets: Target[], ids: string[]): Target[] {
      const wanted = new Set(ids);
      return targets.filter((t) => wanted.has(t.id));
    }

    export function unknownTargetIds(targets: Target[], ids: string[]): string[] {
      const known = new Set(targets.map((t) => t.id));
      return ids.filter((id) => !known.has(id));
    }
  runner.locators.ts: |-
    import type { Locator, Page } from '@playwright/test';

    const PREFIX_RE = /^(data-testid|role|text|css):(.+)$/;

    export interface ResolvedSelector {
      selector: string;
      kind: 'data-testid' | 'role' | 'text' | 'css';
      value: string;
      name?: string;
    }

    const PRIORITY = ['data-testid', 'role', 'text', 'css'] as const;

    export function parseSelector(raw: string): ResolvedSelector {
      const m = PREFIX_RE.exec(raw);
      if (!m) {
        throw new Error(`selector must be prefixed (data-testid: | role: | text: | css:): ${raw}`);
      }
      const kind = m[1] as ResolvedSelector['kind'];
      const value = m[2];
      if (kind === 'role') {
        const colon = value.indexOf(':');
        if (colon === -1) {
          return { selector: raw, kind, value };
        }
        return { selector: raw, kind, value: value.slice(0, colon), name: value.slice(colon + 1) };
      }
      return { selector: raw, kind, value };
    }

    export function selectorKindOrder(raw: string): number {
      return PRIORITY.indexOf(parseSelector(raw).kind);
    }

    export function orderSelectors(primary: string, fallback: string[]): string[] {
      const ordered = [primary, ...fallback].slice();
      const byKind: Record<ResolvedSelector['kind'], string[]> = {
        'data-testid': [],
        role: [],
        text: [],
        css: [],
      };
      for (const raw of ordered) {
        byKind[parseSelector(raw).kind].push(raw);
      }
      const result: string[] = [];
      for (const kind of PRIORITY) {
        result.push(...byKind[kind]);
      }
      return result;
    }

    function shortProbeTimeout(timeoutMs: number): number {
      return Math.min(3000, Math.max(500, Math.floor(timeoutMs / 6)));
    }

    export async function findFirstVisible(page: Page, selectors: string[], timeoutMs: number): Promise<Locator | null> {
      for (const raw of orderSelectors(selectors[0], selectors.slice(1))) {
        const locator = resolveLocator(page, raw);
        const deadline = Date.now() + shortProbeTimeout(timeoutMs);
        while (Date.now() < deadline) {
          const count = await locator.count();
          for (let index = 0; index < count; index += 1) {
            const candidate = locator.nth(index);
            if (await candidate.isVisible().catch(() => false)) {
              return candidate;
            }
          }
          await page.waitForTimeout(100);
        }
      }
      return null;
    }

    export function resolveLocator(page: Page, raw: string): Locator {
      const parsed = parseSelector(raw);
      switch (parsed.kind) {
        case 'data-testid':
          return page.getByTestId(parsed.value);
        case 'role':
          return page.getByRole(parsed.value as never, parsed.name ? { name: parsed.name } : undefined);
        case 'text':
          return page.getByText(parsed.value, { exact: false });
        case 'css':
          return page.locator(parsed.value);
      }
    }

    export function visibleSelectorReport(selectors: string[]): string {
      const ordered = orderSelectors(selectors[0], selectors.slice(1));
      return ordered.length === 1
        ? `selector ${ordered[0]} was not visible`
        : `none of the selectors were visible: ${ordered.join(' | ')}`;
    }
  runner.lock.ts: |-
    import fs from 'node:fs';
    import path from 'node:path';
    import { z } from 'zod';
    import { ensureDir } from './artifacts';
    import { targetSchema, LOCK_FILE_NAME, type Target } from './schema';

    const lockSchema = z.object({
      version: z.number(),
      targets: z.array(targetSchema),
    });

    export const LOCK_VERSION = 1;

    export function writeLock(targets: Target[], outputDir: string): string {
      ensureDir(outputDir);
      const file = path.join(outputDir, LOCK_FILE_NAME);
      const payload = { version: LOCK_VERSION, targets };
      fs.writeFileSync(file, JSON.stringify(payload, null, 2), 'utf8');
      return file;
    }

    export function readLock(lockFile: string): Target[] {
      const raw = fs.readFileSync(lockFile, 'utf8');
      const parsed: unknown = JSON.parse(raw);
      const result = lockSchema.safeParse(parsed);
      if (!result.success) {
        throw new Error(`invalid target lock file ${lockFile}: ${result.error.message}`);
      }
      if (result.data.version !== LOCK_VERSION) {
        throw new Error(`unsupported target lock version ${result.data.version}`);
      }
      return result.data.targets;
    }
  runner.schema.ts: |-
    import { z } from 'zod';

    export const ENV_LOCK_FILE = 'SYNTHETIC_LOCK_FILE';
    export const ENV_OUTPUT_DIR = 'SYNTHETIC_OUTPUT_DIR';
    export const DEFAULT_OUTPUT_DIR = 'output';
    export const TARGETS_DIR = 'targets';
    export const COMPILED_DIR = '.compiled';
    export const LOCK_FILE_NAME = '.target-lock.json';

    export const selectorField = (message: string) =>
      z
        .string()
        .min(1)
        .refine(isPrefixedSelector, { message });

    export function isPrefixedSelector(raw: string): boolean {
      return /^(data-testid|role|text|css):/.test(raw);
    }

    const checkField = z
      .string()
      .regex(/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/, 'check must be lowercase kebab-case')
      .optional();

    const goToAction = z.object({
      check: checkField,
      type: z.literal('goto'),
      url: z.string().refine(
        (u) => u.startsWith('https://') || u.startsWith('/'),
        'goto url must be an absolute HTTPS URL or a root-relative path',
      ),
    });

    const waitAction = z.object({
      check: checkField,
      type: z.literal('wait'),
      durationMs: z.number().int().min(1).max(60000),
    });

    const visibleAction = z
      .object({
        check: checkField,
        type: z.literal('visible'),
        selector: selectorField(
          'visible selector must be prefixed: data-testid:<id> | role:<role>[:<name>] | text:<text> | css:<selector>',
        ),
      })
      .extend({ fallback: z.array(selectorField('fallback selectors must be prefixed')).default([]) });

    const textAction = z
      .object({
        check: checkField,
        type: z.literal('text'),
        text: z.string().min(1),
        selector: selectorField('text selector must be prefixed').optional(),
        contains: z.boolean().default(true),
      })
      .extend({ fallback: z.array(selectorField('fallback selectors must be prefixed')).default([]) });

    const urlAction = z.object({
      check: checkField,
      type: z.literal('url'),
      pattern: z.string().min(1),
      regex: z.boolean().default(false),
    });

    const fillAction = z
      .object({
        check: checkField,
        type: z.literal('fill'),
        selector: selectorField('fill selector must be prefixed'),
        value: z.string().optional(),
        valueFromEnv: z
          .string()
          .regex(/^[A-Z][A-Z0-9_]*$/, 'valueFromEnv must be an UPPER_CASE environment variable name')
          .optional(),
      })
      .extend({ fallback: z.array(selectorField('fallback selectors must be prefixed')).default([]) })
      .superRefine((v, ctx) => {
        if ((v.value !== undefined) === (v.valueFromEnv !== undefined)) {
          ctx.addIssue({
            code: 'custom',
            message: 'fill requires exactly one of value or valueFromEnv',
          });
        }
      });

    const clickAction = z
      .object({
        check: checkField,
        type: z.literal('click'),
        selector: selectorField('click selector must be prefixed'),
      })
      .extend({ fallback: z.array(selectorField('fallback selectors must be prefixed')).default([]) });

    const screenshotAction = z.object({
      check: checkField,
      type: z.literal('screenshot'),
      name: z.string().regex(/^[a-zA-Z0-9_-]+$/, 'screenshot name must be [a-zA-Z0-9_-]'),
      fullPage: z.boolean().default(true),
      mask: z.array(selectorField('mask selectors must be prefixed')).default([]),
    });

    export const actionSchema = z.discriminatedUnion('type', [
      goToAction,
      waitAction,
      visibleAction,
      textAction,
      urlAction,
      fillAction,
      clickAction,
      screenshotAction,
    ]);
    export type Action = z.infer<typeof actionSchema>;

    const anonymousAuth = z.object({ mode: z.literal('anonymous') });
    const credentialedAuth = z.object({
      mode: z.literal('credentialed'),
      envVars: z
        .array(z.string().regex(/^[A-Z][A-Z0-9_]*$/, 'envVar names must be UPPER_CASE'))
        .min(1, 'credentialed targets must declare at least one envVars name'),
    });
    export const authSchema = z.discriminatedUnion('mode', [anonymousAuth, credentialedAuth]);
    export type Auth = z.infer<typeof authSchema>;

    export const targetSchema = z
      .object({
        id: z.string().regex(/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/, 'id must be lowercase kebab-case'),
        name: z.string().min(1).max(200),
        baseUrl: z
          .string()
          .url('baseUrl must be a valid absolute URL')
          .refine((u) => u.startsWith('https://'), 'baseUrl must be HTTPS (never plain http)'),
        auth: authSchema.default({ mode: 'anonymous' }),
        minIntervalMinutes: z.number().int().min(15).max(1440).default(15),
        timeoutMs: z.number().int().min(5000).max(600000).default(120000),
        retries: z.number().int().min(0).max(2).default(0),
        journey: z
          .string()
          .regex(/^journeys\/[a-z0-9-]+\.ts$/, 'journey must be journeys/<kebab-id>.ts')
          .optional(),
        selectors: z.string().optional(),
        actions: z.array(actionSchema).default([]),
      })
      .refine((t) => t.journey !== undefined || t.actions.length > 0, {
        message: 'target must declare a journey or at least one action to execute',
      });

    export type Target = z.infer<typeof targetSchema>;

    export type CredentialedTarget = Target & {
      auth: { mode: 'credentialed'; envVars: string[] };
    };

    export function isCredentialed(target: Target): target is CredentialedTarget {
      return target.auth.mode === 'credentialed';
    }
  runner.secrets.ts: |-
    import { isCredentialed, type Target } from './schema';

    export type SecretCheck =
      | { ok: true }
      | { ok: false; missing: string[]; reason: string };

    export function checkTargetSecrets(target: Target, env: NodeJS.ProcessEnv = process.env): SecretCheck {
      if (!isCredentialed(target)) {
        return { ok: true };
      }
      const missing = target.auth.envVars.filter((name) => {
        const value = env[name];
        return value === undefined || value.trim() === '';
      });
      if (missing.length > 0) {
        return {
          ok: false,
          missing,
          reason: `credentialed target '${target.id}' requires env vars ${missing.join(', ')}; set them to execute, or the target is skipped`,
        };
      }
      return { ok: true };
    }
  tests.journeys.spec.ts: |-
    import { test } from '@playwright/test';
    import { readLock } from '../runner/lock';
    import { runTargetJourney } from '../runner/journey';
    import { ENV_LOCK_FILE, ENV_OUTPUT_DIR, DEFAULT_OUTPUT_DIR } from '../runner/schema';

    const lockFile = process.env[ENV_LOCK_FILE];
    if (lockFile === undefined) {
      throw new Error(`${ENV_LOCK_FILE} must point at the target lock file`);
    }
    const outputDir = process.env[ENV_OUTPUT_DIR] || DEFAULT_OUTPUT_DIR;

    const targets = readLock(lockFile);

    for (const target of targets) {
      test(`${target.id}: ${target.name}`, async ({ browser }, testInfo) => {
        const outcome = await runTargetJourney({
          target,
          browser,
          testInfo,
          outputDir,
        });
        if (outcome.status === 'skipped') {
          test.skip(true, outcome.reason ?? 'target skipped');
        }
      });
    }
  tsconfig.json: |-
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "NodeNext",
        "moduleResolution": "NodeNext",
        "strict": true,
        "esModuleInterop": true,
        "skipLibCheck": true,
        "forceConsistentCasingInFileNames": true,
        "resolveJsonModule": true,
        "noEmit": true,
        "types": ["node"]
      },
      "include": ["runner/**/*.ts", "tests/**/*.ts", "journeys/**/*.ts", "*.ts"]
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: synthetic-monitoring
    app.kubernetes.io/name: synthetic-monitor
    app.kubernetes.io/part-of: sre-platform
  name: synthetic-source
  namespace: synthetic-monitoring
---
apiVersion: v1
data:
  customers.newmedia.electrocraft-updates.yaml: |-
    # Synthetic monitoring target: ElectroCraft MotionPRO public update catalog (TASK-164)
    #
    # This host intentionally serves an Apache directory index. Its useful service
    # contract is the HTTPS /motionpro/ catalog and the listed release directories;
    # checks never follow links or download artifacts.

    id: electrocraft-updates
    name: ElectroCraft MotionPRO update catalog - availability and listing rendering
    baseUrl: https://updates.electrocraft.com/motionpro/
    minIntervalMinutes: 15
    timeoutMs: 120000
    retries: 0

    actions:
      - type: goto
        check: motionpro-catalog-http
        url: https://updates.electrocraft.com/motionpro/

      - type: url
        check: motionpro-catalog-url
        pattern: ^https://updates\.electrocraft\.com/motionpro/?$
        regex: true

      - type: visible
        check: catalog-heading
        selector: css:h1

      - type: text
        check: catalog-title
        text: Index of /motionpro
        contains: true

      - type: visible
        check: configurations-directory
        selector: css:a[href="Configurations/"]

      - type: visible
        check: firmware-directory
        selector: css:a[href="Firmware/"]
  customers.newmedia.hansen-motor.yaml: |-
    # Synthetic monitoring target: Hansen Corporation public site (TASK-164)
    #
    # Read-only availability and essential rendering checks. The live homepage
    # exposes a stable main header, branded logo, product heading, and footer.

    id: hansen-motor
    name: Hansen Corporation public site - availability and essential rendering
    baseUrl: https://www.hansen-motor.com/
    minIntervalMinutes: 15
    timeoutMs: 120000
    retries: 0

    actions:
      - type: goto
        check: homepage-http
        url: https://www.hansen-motor.com/

      - type: url
        check: homepage-url
        pattern: ^https://www\.hansen-motor\.com/?$
        regex: true

      - type: visible
        check: main-header
        selector: css:header#main-header

      - type: visible
        check: brand-logo
        selector: css:img[alt="Hansen Corporation logo"]

      - type: text
        check: product-heading
        text: Hansen Precision Electric Motors
        contains: true

      - type: visible
        check: footer
        selector: css:footer#main-footer
  customers.newmedia.mechatronics-bearing.yaml: |-
    # Synthetic monitoring target: Mechatronics Bearing Group public site (TASK-164)
    #
    # The HTTP host redirects to this www HTTPS canonical hostname. Checks cover
    # the branded header/logo, visible Products navigation, and footer only.

    id: mechatronics-bearing
    name: Mechatronics Bearing Group public site - availability and essential rendering
    baseUrl: https://www.mechatronicsbearing.com/
    minIntervalMinutes: 15
    timeoutMs: 120000
    retries: 0

    actions:
      - type: goto
        check: homepage-http
        url: https://www.mechatronicsbearing.com/

      - type: url
        check: homepage-url
        pattern: ^https://www\.mechatronicsbearing\.com/?$
        regex: true

      - type: visible
        check: site-header
        selector: css:header

      - type: visible
        check: brand-logo
        selector: css:img[src*="mechatronics-logo-white.svg"]

      - type: visible
        check: products-navigation
        selector: css:a[href="#products"]

      - type: visible
        check: footer
        selector: css:footer
  customers.newmedia.new-media-consulting.yaml: |-
    # Synthetic monitoring target: New Media Consulting public site (TASK-164)
    #
    # A deliberately small public-site check: successful HTTPS rendering, the
    # contact route, and stable visible marketing copy. No secured login is opened.

    id: new-media-consulting
    name: New Media Consulting public site - availability and essential rendering
    baseUrl: https://newmediaconsulting.com/
    minIntervalMinutes: 15
    timeoutMs: 120000
    retries: 0

    actions:
      - type: goto
        check: homepage-http
        url: https://newmediaconsulting.com/

      - type: url
        check: homepage-url
        pattern: ^https://newmediaconsulting\.com/?$
        regex: true

      - type: visible
        check: contact-navigation
        selector: css:a[href="/contact/"]

      - type: text
        check: marketing-copy
        text: Since 1998, NMC provides integrated online marketing strategies
        contains: true

      - type: text
        check: brand-copy
        text: New Media Consulting
        contains: true
  customers.plantmaster.plantmaster-auth.yaml: |-
    # Synthetic monitoring target: PlantMaster authenticated login (TASK-154)
    #
    # This is deliberately a read-only session check. It submits the login form,
    # then verifies that the anonymous recovery text is absent. It never creates,
    # updates, deletes, or submits any business data.
    #
    # Credentials are declared only by environment-variable names. The Kubernetes
    # CronJob maps them from the existing plantmaster-synthetic-auth Secret.

    id: plantmaster-auth
    name: PlantMaster authenticated login and session rendering
    baseUrl: https://plantmaster.com/
    auth:
      mode: credentialed
      envVars:
        - PLANTMASTER_USER
        - PLANTMASTER_PASS
    minIntervalMinutes: 15
    timeoutMs: 120000
    retries: 0

    actions:
      - type: goto
        check: login-page-http
        url: /login.php

      - type: visible
        check: login-form
        selector: css:form#frmLogin

      - type: fill
        check: login-username
        selector: css:input#email
        valueFromEnv: PLANTMASTER_USER

      - type: fill
        check: login-password
        selector: css:input#password
        valueFromEnv: PLANTMASTER_PASS

      - type: click
        check: login-submit
        selector: css:input#submit

      # A successful session must replace the anonymous login form. This check
      # avoids account data and remains robust if dashboard copy changes.
      - type: text
        check: authenticated-form-dismissed
        text: Forgot Password?
        contains: false

      # The authenticated landing page exposes a Projects link. The responsive
      # markup also contains a hidden duplicate, so the runner intentionally
      # selects the first visible match without opening or following the link.
      - type: visible
        check: authenticated-projects-navigation
        selector: css:a[href="/projects/"]

      # Revisit the public homepage after a short session-settling period. The
      # user-menu control is present only in the authenticated homepage view; its
      # text is deliberately not read or logged.
      - type: goto
        check: authenticated-homepage-http
        url: /

      - type: wait
        check: authenticated-homepage-settled
        durationMs: 10000

      - type: visible
        check: authenticated-homepage-user-menu
        selector: css:#plantmaster-menu .top-bar-right a[href="#"][role="menuitem"]
  customers.plantmaster.plantmaster.yaml: |-
    # Synthetic monitoring target: PlantMaster public marketing site (TASK-142, TASK-146)
    #
    # SELECTOR RATIONALE
    # The PlantMaster homepage is a server-rendered Zurb Foundation site. It exposes:
    #   - no ARIA roles and no data-testid attributes (verified against live HTML)
    #   - semantic <header> and <footer id="footer"> landmarks
    #   - the primary navigation is the Foundation top bar:
    #       header .top-bar > .top-bar-left > ul.menu > li > a
    #   - branding is the PlantMaster logo image: header .top-bar-logo
    # Therefore this target uses css:/text: prefixed selectors with fallbacks and
    # deliberately avoids asserting exact marketing copy that may change.
    #
    # SAFETY
    # Read-only availability checks only. No forms are submitted, no records are
    # created or mutated, no login is performed, no client storage is relied upon,
    # and this profile never persists credentials. Retries are zero; the scheduled
    # CronJob run executes this anonymous target and never receives secrets. The
    # scheduled run also sets SYNTHETIC_NO_ARTIFACTS=1 (see cronjob.yaml) so no
    # screenshots or traces are produced on CronJob runs.

    id: plantmaster
    name: PlantMaster public site - availability and essential rendering
    baseUrl: https://plantmaster.com/
    # Bounded schedule: 15 minutes is the maximum permitted frequency
    # (minIntervalMinutes >= 15 enforced by the schema).
    minIntervalMinutes: 15
    timeoutMs: 120000
    retries: 0

    actions:
      # 1. Page loads over HTTPS with a 2xx status
      - type: goto
        check: homepage-http
        url: https://plantmaster.com/

      # 2. URL reflects the expected site (allow hash anchors, no redirect target
      #    drift expected; do not assert marketing landing paths that may change)
      - type: url
        check: homepage-url
        pattern: ^https://plantmaster\.com/?(#.*)?$
        regex: true

      # 3. Branding/header renders (logo image in the Foundation top bar;
      #    fall back to the whole top bar, then site header, then skip-to-content)
      - type: visible
        check: header-logo
        selector: css:header .top-bar-logo
        fallback:
          - css:#plantmaster-menu
          - css:header
          - css:a[href="#content"]

      # 4. Primary navigation renders (top bar menu links; fall back to the two
      #    header auth links which have been stable on this site)
      - type: visible
        check: primary-navigation
        selector: css:header .top-bar ul.menu a
        fallback:
          - text:Log In
          - text:Sign Up

      # 5. Footer renders
      - type: visible
        check: footer
        selector: css:footer#footer
        fallback:
          - css:footer
          - text:PlantMaster
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: synthetic-monitoring
    app.kubernetes.io/name: synthetic-monitor
    app.kubernetes.io/part-of: sre-platform
  name: synthetic-targets
  namespace: synthetic-monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: synthetic-monitoring
    app.kubernetes.io/name: synthetic-monitor
    app.kubernetes.io/part-of: sre-platform
  name: synthetic-monitor
  namespace: synthetic-monitoring
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/component: synthetic-monitoring
        app.kubernetes.io/name: synthetic-monitor
        app.kubernetes.io/part-of: sre-platform
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: synthetic-monitoring
            app.kubernetes.io/name: synthetic-monitor
            app.kubernetes.io/part-of: sre-platform
        spec:
          containers:
          - args:
            - node_modules/tsx/dist/cli.mjs
            - runner/index.ts
            - --targets
            - plantmaster,plantmaster-auth,hansen-motor,mechatronics-bearing,electrocraft-updates,new-media-consulting
            - --output-dir
            - /synthetic-output
            command:
            - node
            env:
            - name: HOME
