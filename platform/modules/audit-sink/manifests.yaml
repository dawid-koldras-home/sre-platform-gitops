    # after the connect timeout (measured on the TASK-228 clean rebuild).
    argocd.argoproj.io/sync-wave: "-13"
  labels:
    app.kubernetes.io/name: audit-sink
    app.kubernetes.io/instance: audit-sink
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
