apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-sink-sink-egress
  namespace: audit-sink
  annotations:
    # Every policy this module owns is applied in the earliest wave, before the
    # database and the jobs that dial it. Kubernetes NetworkPolicies are
    # additive: once any policy selects a pod for a direction, only the union of
