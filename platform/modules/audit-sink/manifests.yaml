    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: sink
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - sink
          - migrate
          - grants
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit-sink
              app.kubernetes.io/instance: audit-sink
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
