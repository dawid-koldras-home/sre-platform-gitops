---
# Source: audit-sink/templates/network-policies.yaml
# Default-deny plus the conversations the sink actually needs.
#
# Order of evaluation: 1) nothing is allowed until a later policy permits it;
# 2) DNS to the cluster resolver; 3) the configured writer peers -> sink; 4) the
# sink/migrate/grants identity -> PostgreSQL. Everything else stays denied.
#
# The sink ingress peers are not a same-namespace wildcard: each entry is
# exactly one namespaceSelector/podSelector pair ANDed in a single peer, so a
# pod carrying the writer label in another namespace, or any other pod in the
# sink namespace, does not match. An empty peer list renders a deny-all sink
# ingress posture.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-sink-default-deny
  namespace: audit-sink
  annotations:
    # Every policy this module owns is applied in the earliest wave, before the
    # database and the jobs that dial it. Kubernetes NetworkPolicies are
    # additive: once any policy selects a pod for a direction, only the union of
    # all policies allows traffic. The identity bridge renders an ingress policy
    # that selects every pod labelled app.kubernetes.io/name=audit-sink (the
    # database included) and allows only port 8443, so until this module's own
    # 5432 allow exists the migration cannot reach PostgreSQL and fails closed
    # after the connect timeout (measured on the TASK-228 clean rebuild).
    argocd.argoproj.io/sync-wave: "-13"
  labels:
    app.kubernetes.io/name: audit-sink
    app.kubernetes.io/instance: audit-sink
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Source: audit-sink/templates/network-policies.yaml
apiVersion: networking.k8s.io/v1
