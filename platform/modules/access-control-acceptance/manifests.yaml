apiVersion: v1
data:
  configuration.yaml: |2
        theme: 'auto'
        default_2fa_method: 'totp'
        server:
          address: 'tcp://0.0.0.0:9091/'
          endpoints:
            authz:
              auth-request:
                implementation: 'AuthRequest'
        log:
          level: 'info'
          format: 'json'
          keep_stdout: true
        totp:
          disable: false
          issuer: 'SRE Platform Acceptance'
          skew: 1
          secret_size: 32
          algorithm: 'SHA1'
          digits: 6
          period: 30
        authentication_backend:
          refresh_interval: '5 minutes'
          file:
            path: '/config/authelia/users/users_database.yml'
            watch: true
            password:
              algorithm: 'argon2'
              argon2:
                variant: 'argon2id'
                iterations: 3
                memory: 65536
                parallelism: 2
                key_length: 32
                salt_length: 16
        session:
          name: 'acl_acceptance_session'
          same_site: 'lax'
          inactivity: '15 minutes'
          expiration: '1 hour'
          remember_me: '8 hours'
          cookies:
            - domain: '139.162.145.158.nip.io'
              authelia_url: 'https://acl-auth.139.162.145.158.nip.io'
              default_redirection_url: 'https://acl-bridge.139.162.145.158.nip.io'
        regulation:
          modes:
            - 'user'
          max_retries: 3
          find_time: '2 minutes'
          ban_time: '5 minutes'
        storage:
          local:
            path: '/config/db.sqlite3'
        notifier:
          disable_startup_check: true
          filesystem:
            filename: '/config/notification.txt'
        access_control:
          default_policy: 'deny'
          rules:
            - policy: 'two_factor'
              domain:
                - 'acl-bridge.139.162.145.158.nip.io'
                - 'acl-access.139.162.145.158.nip.io'
