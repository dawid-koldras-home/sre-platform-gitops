

---
apiVersion: v1
kind: Namespace
metadata:
  name: acl-live-acceptance
  labels:
    app.kubernetes.io/managed-by: srectl
    app.kubernetes.io/name: acl-live-acceptance
    app.kubernetes.io/part-of: sre-platform
    sre.platform.io/owner-module: access-control-acceptance
    sre.platform.io/tenant: acl-stagec
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-identity-bridge
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-identity-bridge-allow-list
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
data:
  allow-list.json: '{"users":["alice@example.com","owen@example.com","pat@example.com","vera@example.com"],"groups":["acl-operators","acl-platform-admins","acl-viewers","sre"]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-identity-bridge
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-identity-bridge
  template:
    metadata:
      annotations:
        sre.platform.io/accepted-git-revision: task/220-access-control-live-acceptance
        sre.platform.io/break-glass-projection: sha256:3c536529ab68e11b00463d8b034be3b376cd231531be75f4a48fa1fb7f7ae8f7
      labels:
        app.kubernetes.io/name: headlamp-identity-bridge
        app.kubernetes.io/part-of: sre-platform
        app.kubernetes.io/component: headlamp-identity-bridge
    spec:
      automountServiceAccountToken: false
      serviceAccountName: headlamp-identity-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: headlamp-identity-bridge
      containers:
      - name: bridge
        image: ghcr.io/dawid-koldras-home/sre-platform-headlamp-identity-bridge@sha256:f98c50ad028db76978a50ff887a8bbfaae983bf9e72fceec61c7d342552f3f10
        imagePullPolicy: IfNotPresent
        args:
        - --upstream-url=https://kubernetes.default.svc
        - --upstream-ca-file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - --token-path=/var/run/secrets/kubernetes.io/serviceaccount/token
        - --allow-list-file=/etc/identity-bridge/allow-list.json
        - --username-header=Remote-User
        - --groups-header=Remote-Groups
        - --listen-addr=:8080
        - --break-glass-grants-file=/etc/identity-bridge/break-glass/approved-break-glass-grants.json
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: allow-list
          mountPath: /etc/identity-bridge
          readOnly: true
        - name: break-glass-grants
          mountPath: /etc/identity-bridge/break-glass
          readOnly: true
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: allow-list
        configMap:
          name: headlamp-identity-bridge-allow-list
      - name: break-glass-grants
        configMap:
          name: access-break-glass-grants
          optional: true
          items:
          - key: approved-break-glass-grants.json
            path: approved-break-glass-grants.json
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-identity-bridge
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp-identity-bridge
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-identity-bridge-default-deny
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-identity-bridge-egress
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp-identity-bridge
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.0.0.1/32
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-identity-bridge-ingress
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp-identity-bridge
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
            app.kubernetes.io/name: headlamp
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    platform.sre-platform.io/access-contract: headlamp-rbac.sre.platform.io/v1alpha1
    platform.sre-platform.io/access-matrix-digest: sha256:66e3759519f45a55c4c497d4abe948e36f65ddd102c204d0afa45234cf7c561b
    platform.sre-platform.io/access-policies: ""
    platform.sre-platform.io/access-role: identity-bridge
    platform.sre-platform.io/access-rule-ids: R-BRIDGE-01,R-BRIDGE-02
    platform.sre-platform.io/access-scope: cluster
  labels:
    app.kubernetes.io/managed-by: srectl-accesscontrol
    app.kubernetes.io/part-of: sre-platform
  name: headlamp-identity-bridge-acceptance
rules:
- apiGroups:
  - ""
  resourceNames:
  - alice@example.com
  - owen@example.com
  - pat@example.com
  - vera@example.com
  resources:
  - users
  verbs:
  - impersonate
- apiGroups:
  - ""
  resourceNames:
  - acl-operators
  - acl-platform-admins
  - acl-viewers
  - sre
  resources:
  - groups
  verbs:
  - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    platform.sre-platform.io/access-contract: headlamp-rbac.sre.platform.io/v1alpha1
    platform.sre-platform.io/access-matrix-digest: sha256:66e3759519f45a55c4c497d4abe948e36f65ddd102c204d0afa45234cf7c561b
    platform.sre-platform.io/access-policies: ""
    platform.sre-platform.io/access-role: identity-bridge
    platform.sre-platform.io/access-rule-ids: R-BRIDGE-01,R-BRIDGE-02
    platform.sre-platform.io/access-scope: cluster
    platform.sre-platform.io/access-subject-kind: ServiceAccount
  labels:
    app.kubernetes.io/managed-by: srectl-accesscontrol
    app.kubernetes.io/part-of: sre-platform
  name: headlamp-identity-bridge-acceptance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-identity-bridge-acceptance
subjects:
- kind: ServiceAccount
  name: headlamp-identity-bridge
  namespace: acl-live-acceptance
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acl-live-acceptance
  namespace: argocd
  annotations:
    sre.platform.io/break-glass-engine-application: acl-live-acceptance
    sre.platform.io/break-glass-engine-namespace: argocd
    sre.platform.io/break-glass-grants-namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
    sre.platform.io/tenant: "acl-stagec"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: "https://github.com/dawid-koldras-home/sre-platform-gitops.git"
    targetRevision: "task/220-access-control-live-acceptance"
    path: "platform/access-break-glass"
  destination:
    server: https://kubernetes.default.svc
    namespace: "acl-live-acceptance"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
