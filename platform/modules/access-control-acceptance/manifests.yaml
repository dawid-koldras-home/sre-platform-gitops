apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acl-live-acceptance
  namespace: argocd
  annotations:
    sre.platform.io/break-glass-engine-application: acl-live-acceptance
    sre.platform.io/break-glass-engine-namespace: argocd
    sre.platform.io/break-glass-grants-namespace: acl-live-acceptance
