  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp-identity-bridge
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 10.0.0.1/32
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-identity-bridge-ingress
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
