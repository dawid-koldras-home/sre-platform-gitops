apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-identity-bridge-allow-list
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
data:
  allow-list.json: '{"users":["alice@example.com","owen@example.com","pat@example.com","vera@example.com"],"groups":["acl-operators","acl-platform-admins","acl-viewers","sre"]}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp-identity-bridge
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp-identity-bridge
  template:
    metadata:
      annotations:
        sre.platform.io/accepted-git-revision: task/220-access-control-live-acceptance
        sre.platform.io/break-glass-projection: sha256:3c536529ab68e11b00463d8b034be3b376cd231531be75f4a48fa1fb7f7ae8f7
        sre.platform.io/content-checksum: sha256:352ac46de4115c24aaeea4f1d72368271bc781f0c0824d8577a6a37cf3e2167a
      labels:
        app.kubernetes.io/name: headlamp-identity-bridge
        app.kubernetes.io/part-of: sre-platform
        app.kubernetes.io/component: headlamp-identity-bridge
    spec:
      automountServiceAccountToken: false
      serviceAccountName: headlamp-identity-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: headlamp-identity-bridge
      containers:
      - name: bridge
        image: ghcr.io/dawid-koldras-home/sre-platform-headlamp-identity-bridge@sha256:f98c50ad028db76978a50ff887a8bbfaae983bf9e72fceec61c7d342552f3f10
        imagePullPolicy: IfNotPresent
        args:
        - --upstream-url=https://kubernetes.default.svc
        - --upstream-ca-file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - --token-path=/var/run/secrets/kubernetes.io/serviceaccount/token
        - --allow-list-file=/etc/identity-bridge/allow-list.json
        - --username-header=Remote-User
        - --groups-header=Remote-Groups
        - --listen-addr=:8080
        - --break-glass-grants-file=/etc/identity-bridge/break-glass/approved-break-glass-grants.json
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: allow-list
          mountPath: /etc/identity-bridge
          readOnly: true
        - name: break-glass-grants
          mountPath: /etc/identity-bridge/break-glass
          readOnly: true
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: allow-list
        configMap:
          name: headlamp-identity-bridge-allow-list
      - name: break-glass-grants
        configMap:
          name: access-break-glass-grants
          optional: true
          items:
          - key: approved-break-glass-grants.json
            path: approved-break-glass-grants.json
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp-identity-bridge
  namespace: acl-live-acceptance
  labels:
    app.kubernetes.io/name: headlamp-identity-bridge
    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/component: headlamp-identity-bridge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp-identity-bridge
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
