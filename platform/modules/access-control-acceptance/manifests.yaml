    app.kubernetes.io/part-of: sre-platform
    app.kubernetes.io/managed-by: srectl
    sre.platform.io/tenant: "acl-stagec"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: "https://github.com/dawid-koldras-home/sre-platform-gitops.git"
    targetRevision: "task/220-access-control-live-acceptance"
    path: "platform/access-break-glass"
  destination:
    server: https://kubernetes.default.svc
    namespace: "acl-live-acceptance"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
